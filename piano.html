 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>البيانو التفاعلي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0a0e27;
    --navy2:#131a3a;
    --gold:#d4af37;
    --gold2:#f4d160;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    height:100%;
    background:var(--navy);
    font-family:'Cairo',sans-serif;
    color:#fff;
    overflow:hidden;
  }
  #stars{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    z-index:0;
  }
  .container{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:20px;
    gap:20px;
  }
  h1{
    color:var(--gold2);
    font-weight:700;
    font-size:1.8em;
    text-shadow:0 0 15px rgba(212,175,55,0.5);
    letter-spacing:1px;
  }
  .subtitle{
    color:#a8b2d1;
    font-size:0.95em;
    text-align:center;
    max-width:500px;
  }
  .controls{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
  }
  .controls button, .controls select{
    background:var(--navy2);
    border:1px solid var(--gold);
    color:var(--gold2);
    padding:8px 16px;
    border-radius:8px;
    font-family:'Cairo',sans-serif;
    font-size:0.9em;
    cursor:pointer;
    transition:.2s;
  }
  .controls button:hover, .controls select:hover{
    background:var(--gold);
    color:var(--navy);
  }
  .controls button.active{
    background:var(--gold);
    color:var(--navy);
  }
  #piano{
    display:flex;
    position:relative;
    padding:16px;
    background:linear-gradient(180deg,#1a2147,#0d1230);
    border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(212,175,55,0.15) inset;
    border:1px solid rgba(212,175,55,0.3);
  }
  .white-key{
    position:relative;
    width:52px;
    height:220px;
    background:linear-gradient(180deg,#fdfdfd,#e8e8e8);
    border:1px solid #333;
    border-radius:0 0 8px 8px;
    margin-right:2px;
    cursor:pointer;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:10px;
    color:#555;
    font-size:0.75em;
    font-weight:600;
    user-select:none;
    transition:background .08s;
    box-shadow:0 4px 6px rgba(0,0,0,0.3);
  }
  .white-key:active, .white-key.pressed{
    background:linear-gradient(180deg,var(--gold2),var(--gold));
    box-shadow:0 2px 3px rgba(0,0,0,0.3) inset;
  }
  .black-key{
    position:absolute;
    width:32px;
    height:135px;
    background:linear-gradient(180deg,#2a2a2a,#000);
    border-radius:0 0 6px 6px;
    z-index:2;
    cursor:pointer;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:8px;
    color:#d4af37;
    font-size:0.65em;
    font-weight:600;
    user-select:none;
    box-shadow:0 4px 8px rgba(0,0,0,0.5);
    transition:background .08s;
  }
  .black-key:active, .black-key.pressed{
    background:linear-gradient(180deg,var(--gold),#8a6d1f);
    color:var(--navy);
  }
  footer{
    color:#6b7394;
    font-size:0.8em;
    text-align:center;
  }
  @media (max-width:600px){
    .white-key{width:34px;height:160px;font-size:0.6em;}
    .black-key{width:22px;height:100px;font-size:0.55em;}
    h1{font-size:1.3em;}
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="container">
  <h1>🎹 البيانو التفاعلي</h1>
  <p class="subtitle">اعزف باستخدام الماوس أو اللمس، أو استخدم لوحة المفاتيح (الصف A S D F G H J K والصف W E T Y U للأسود)</p>

  <div class="controls">
    <button id="btnSustain">تصعيد الصوت: إيقاف</button>
    <label style="color:#a8b2d1;">الآلة:
      <select id="waveType">
        <option value="triangle">بيانو ناعم</option>
        <option value="sine">جرس ناعم</option>
        <option value="sawtooth">وتري حاد</option>
        <option value="square">إلكتروني</option>
      </select>
    </label>
    <button id="btnRecord">⏺ تسجيل</button>
    <button id="btnPlay">▶ تشغيل</button>
    <button id="btnClear">🗑 مسح</button>
  </div>

  <div id="piano"></div>

  <footer>مشروع من موقع نجيب — بيانو ويب مبني بـ Web Audio API</footer>
</div>

<script>
// ===== خلفية النجوم المتحركة =====
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resize();
window.addEventListener('resize', resize);
let stars = [];
for(let i=0;i<150;i++){
  stars.push({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height,
    r: Math.random()*1.5+0.3,
    a: Math.random(),
    da: (Math.random()*0.02+0.005)*(Math.random()<0.5?1:-1)
  });
}
function drawStars(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const s of stars){
    s.a += s.da;
    if(s.a<=0||s.a>=1) s.da*=-1;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle = `rgba(212,175,55,${Math.max(0,s.a)})`;
    ctx.fill();
  }
  requestAnimationFrame(drawStars);
}
drawStars();

// ===== إعداد البيانو =====
const AudioCtx = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioCtx();

// ترددات النوتات (أوكتافين: C4 إلى B5)
const notes = [
  {name:'C4', freq:261.63, type:'white', key:'a'},
  {name:'C#4', freq:277.18, type:'black', key:'w'},
  {name:'D4', freq:293.66, type:'white', key:'s'},
  {name:'D#4', freq:311.13, type:'black', key:'e'},
  {name:'E4', freq:329.63, type:'white', key:'d'},
  {name:'F4', freq:349.23, type:'white', key:'f'},
  {name:'F#4', freq:369.99, type:'black', key:'t'},
  {name:'G4', freq:392.00, type:'white', key:'g'},
  {name:'G#4', freq:415.30, type:'black', key:'y'},
  {name:'A4', freq:440.00, type:'white', key:'h'},
  {name:'A#4', freq:466.16, type:'black', key:'u'},
  {name:'B4', freq:493.88, type:'white', key:'j'},
  {name:'C5', freq:523.25, type:'white', key:'k'},
  {name:'C#5', freq:554.37, type:'black', key:'o'},
  {name:'D5', freq:587.33, type:'white', key:'l'},
  {name:'D#5', freq:622.25, type:'black', key:'p'},
  {name:'E5', freq:659.25, type:'white', key:';'},
];

const piano = document.getElementById('piano');
let whiteIndex = 0;
const keyElems = {};

notes.forEach((note) => {
  const el = document.createElement('div');
  el.dataset.name = note.name;
  if(note.type === 'white'){
    el.className = 'white-key';
    el.style.left = 'auto';
    el.textContent = note.key.toUpperCase();
    piano.appendChild(el);
    whiteIndex++;
  } else {
    el.className = 'black-key';
    el.textContent = note.key.toUpperCase();
    // موضع الأسود بين البيضاوين
    el.style.right = (whiteIndex * 54 - 16) + 'px';
    piano.appendChild(el);
  }
  keyElems[note.key] = {el, note};
});

let sustain = false;
let waveType = 'triangle';
document.getElementById('waveType').addEventListener('change', e => waveType = e.target.value);
document.getElementById('btnSustain').addEventListener('click', function(){
  sustain = !sustain;
  this.textContent = 'تصعيد الصوت: ' + (sustain ? 'تشغيل' : 'إيقاف');
  this.classList.toggle('active', sustain);
});

const activeOsc = {};

function playNote(key){
  const item = keyElems[key];
  if(!item || activeOsc[key]) return;
  const {el, note} = item;
  el.classList.add('pressed');

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = waveType;
  osc.frequency.value = note.freq;
  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.02);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  activeOsc[key] = {osc, gain};

  if(isRecording){
    recordedNotes.push({name: note.name, time: Date.now() - recordStart, action:'down'});
  }
}

function stopNote(key){
  const item = keyElems[key];
  const active = activeOsc[key];
  if(!item || !active) return;
  item.el.classList.remove('pressed');
  const releaseTime = sustain ? 1.2 : 0.15;
  active.gain.gain.cancelScheduledValues(audioCtx.currentTime);
  active.gain.gain.setValueAtTime(active.gain.gain.value, audioCtx.currentTime);
  active.gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + releaseTime);
  active.osc.stop(audioCtx.currentTime + releaseTime + 0.05);
  delete activeOsc[key];

  if(isRecording){
    recordedNotes.push({name: item.note.name, time: Date.now() - recordStart, action:'up'});
  }
}

// أحداث الماوس واللمس
Object.entries(keyElems).forEach(([key, {el}]) => {
  el.addEventListener('mousedown', (e)=>{ e.preventDefault(); audioCtx.resume(); playNote(key); });
  el.addEventListener('mouseup', ()=> stopNote(key));
  el.addEventListener('mouseleave', ()=> stopNote(key));
  el.addEventListener('touchstart', (e)=>{ e.preventDefault(); audioCtx.resume(); playNote(key); }, {passive:false});
  el.addEventListener('touchend', (e)=>{ e.preventDefault(); stopNote(key); }, {passive:false});
});

// أحداث لوحة المفاتيح
const pressedKeys = new Set();
window.addEventListener('keydown', (e)=>{
  const key = e.key.toLowerCase();
  if(keyElems[key] && !pressedKeys.has(key)){
    pressedKeys.add(key);
    audioCtx.resume();
    playNote(key);
  }
});
window.addEventListener('keyup', (e)=>{
  const key = e.key.toLowerCase();
  pressedKeys.delete(key);
  stopNote(key);
});

// ===== تسجيل وتشغيل =====
let isRecording = false;
let recordStart = 0;
let recordedNotes = [];
const btnRecord = document.getElementById('btnRecord');
const btnPlay = document.getElementById('btnPlay');
const btnClear = document.getElementById('btnClear');

btnRecord.addEventListener('click', ()=>{
  isRecording = !isRecording;
  if(isRecording){
    recordedNotes = [];
    recordStart = Date.now();
    btnRecord.textContent = '⏹ إيقاف التسجيل';
    btnRecord.classList.add('active');
  } else {
    btnRecord.textContent = '⏺ تسجيل';
    btnRecord.classList.remove('active');
  }
});

btnPlay.addEventListener('click', ()=>{
  if(recordedNotes.length === 0) return;
  audioCtx.resume();
  recordedNotes.forEach(entry => {
    setTimeout(()=>{
      const key = Object.keys(keyElems).find(k => keyElems[k].note.name === entry.name);
      if(!key) return;
      if(entry.action === 'down') playNote(key);
      else stopNote(key);
    }, entry.time);
  });
});

btnClear.addEventListener('click', ()=>{
  recordedNotes = [];
});
</script>
</body>
</html>
