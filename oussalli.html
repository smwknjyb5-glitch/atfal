 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مواقيت الصلاة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0A2233;
    --bg-mid:#0F3244;
    --bg-card:#123C4E;
    --gold:#CBA135;
    --gold-light:#E8CE8A;
    --cream:#F3EAD8;
    --muted:#7FA39C;
    --line:rgba(203,161,53,0.22);
    --active-bg:#1B4F55;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, #16495B 0%, var(--bg-deep) 55%);
    color:var(--cream);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    padding:32px 16px 60px;
    position:relative;
    overflow-x:hidden;
  }
  .pattern-bg{
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(45deg, rgba(203,161,53,0.035) 0, rgba(203,161,53,0.035) 1px, transparent 1px, transparent 26px),
      repeating-linear-gradient(-45deg, rgba(203,161,53,0.035) 0, rgba(203,161,53,0.035) 1px, transparent 1px, transparent 26px);
    pointer-events:none;
  }
  .wrap{max-width:560px; margin:0 auto; position:relative; z-index:1;}

  .top-row{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom:6px; gap:10px;
  }
  .city-box{display:flex; flex-direction:column; gap:2px;}
  .city-name{font-size:20px; font-weight:700; color:var(--cream); display:flex; align-items:center; gap:6px;}
  .hijri{font-size:13px; color:var(--muted);}
  .locate-btn{
    background:transparent; border:1px solid var(--line); color:var(--gold-light);
    border-radius:20px; padding:7px 14px; font-family:'Tajawal',sans-serif; font-size:12px;
    cursor:pointer; white-space:nowrap; transition:background .2s;
  }
  .locate-btn:hover{background:rgba(203,161,53,0.12);}
  .greg{font-size:13px; color:var(--muted); margin-bottom:22px;}

  .hero{
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:38px 20px 30px;
    margin-bottom:28px;
  }
  .star-motif{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:340px; height:340px; opacity:0.16;
    animation: spin 140s linear infinite;
  }
  @keyframes spin{ from{transform:translate(-50%,-50%) rotate(0deg);} to{transform:translate(-50%,-50%) rotate(360deg);} }
  .hero-inner{position:relative; z-index:2; text-align:center;}
  .next-label{font-size:14px; color:var(--muted); letter-spacing:.5px; margin-bottom:6px;}
  .next-name{
    font-family:'Aref Ruqaa', serif; font-weight:700;
    font-size:52px; color:var(--gold-light); line-height:1.1; margin-bottom:14px;
  }
  .countdown{
    font-size:38px; font-weight:500; color:var(--cream);
    letter-spacing:1px; font-variant-numeric:tabular-nums;
    margin-bottom:6px;
  }
  .countdown-label{font-size:13px; color:var(--muted);}

  .divider{
    display:flex; align-items:center; gap:12px; margin:0 0 20px;
  }
  .divider .line{flex:1; height:1px; background:var(--line);}
  .divider .diamond{width:8px; height:8px; background:var(--gold); transform:rotate(45deg);}

  .prayer-list{display:flex; flex-direction:column; gap:10px;}
  .prayer-card{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--bg-card); border:1px solid var(--line);
    border-radius:14px; padding:16px 20px;
    transition:background .3s, border-color .3s;
  }
  .prayer-card.active{
    background:var(--active-bg); border-color:var(--gold);
  }
  .prayer-left{display:flex; align-items:center; gap:14px;}
  .prayer-icon{
    width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(203,161,53,0.12); flex-shrink:0;
  }
  .prayer-card.active .prayer-icon{background:rgba(203,161,53,0.28);}
  .prayer-icon svg{width:18px; height:18px;}
  .prayer-name{font-family:'Aref Ruqaa', serif; font-size:22px; font-weight:700; color:var(--cream);}
  .prayer-sub{font-size:11px; color:var(--muted); margin-top:1px;}
  .prayer-time{font-size:20px; font-weight:500; color:var(--gold-light); font-variant-numeric:tabular-nums;}

  .status-msg{
    text-align:center; font-size:13px; color:var(--muted);
    margin-top:26px; min-height:18px;
  }

  @media (max-width:420px){
    .next-name{font-size:40px;}
    .countdown{font-size:30px;}
    .star-motif{width:260px; height:260px;}
  }
</style>
</head>
<body>
<div class="pattern-bg"></div>
<div class="wrap">

  <div class="top-row">
    <div class="city-box">
      <div class="city-name" id="cityName">جارٍ التحديد…</div>
      <div class="hijri" id="hijriDate">&nbsp;</div>
    </div>
    <button class="locate-btn" id="locateBtn">📍 موقعي الحالي</button>
  </div>
  <div class="greg" id="gregDate">&nbsp;</div>

  <div class="hero">
    <svg class="star-motif" viewBox="0 0 200 200">
      <g fill="none" stroke="#CBA135" stroke-width="1">
        <polygon points="100,10 118,70 180,70 130,108 148,168 100,130 52,168 70,108 20,70 82,70"/>
        <circle cx="100" cy="100" r="90"/>
      </g>
    </svg>
    <div class="hero-inner">
      <div class="next-label">الصلاة القادمة</div>
      <div class="next-name" id="nextPrayerName">—</div>
      <div class="countdown" id="countdown">00:00:00</div>
      <div class="countdown-label">الوقت المتبقي</div>
    </div>
  </div>

  <div class="divider"><div class="line"></div><div class="diamond"></div><div class="line"></div></div>

  <div class="prayer-list" id="prayerList"></div>

  <div class="status-msg" id="statusMsg">جارٍ تحميل مواقيت الصلاة…</div>
</div>

<script>
const PRAYERS = [
  {key:'Fajr', name:'الفجر', sub:'صلاة الصبح'},
  {key:'Dhuhr', name:'الظهر', sub:'صلاة الظهيرة'},
  {key:'Asr', name:'العصر', sub:'صلاة العصر'},
  {key:'Maghrib', name:'المغرب', sub:'صلاة الغروب'},
  {key:'Isha', name:'العشاء', sub:'صلاة الليل'}
];

const ICONS = {
  Fajr: '<svg viewBox="0 0 24 24" fill="none" stroke="#E8CE8A" stroke-width="1.6"><path d="M12 3v6M4.2 10.5l1.6 1.2M19.8 10.5l-1.6 1.2M2 18h20M5 18a7 7 0 0114 0"/></svg>',
  Dhuhr: '<svg viewBox="0 0 24 24" fill="none" stroke="#E8CE8A" stroke-width="1.6"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
  Asr: '<svg viewBox="0 0 24 24" fill="none" stroke="#E8CE8A" stroke-width="1.6"><circle cx="12" cy="14" r="4.2"/><path d="M12 4v3M4.5 8.5l2 1.5M19.5 8.5l-2 1.5M2 21h20"/></svg>',
  Maghrib: '<svg viewBox="0 0 24 24" fill="none" stroke="#E8CE8A" stroke-width="1.6"><path d="M2 18h20M5 18a7 7 0 0114 0M2 21h20M9 18l3-4 3 4"/></svg>',
  Isha: '<svg viewBox="0 0 24 24" fill="none" stroke="#E8CE8A" stroke-width="1.6"><path d="M20 14.5A8 8 0 1110 3a6.5 6.5 0 0010 11.5z"/></svg>'
};

let timings = null;
let nextInfo = null;

function fmtHM(str){
  return str.split(' ')[0];
}

function parseTimeToday(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  const d = new Date();
  d.setHours(h, m, 0, 0);
  return d;
}

function computeNext(){
  const now = new Date();
  let upcoming = null;
  for(const p of PRAYERS){
    const t = parseTimeToday(fmtHM(timings[p.key]));
    if(t > now){ upcoming = {...p, time:t}; break; }
  }
  if(!upcoming){
    const t = parseTimeToday(fmtHM(timings['Fajr']));
    t.setDate(t.getDate()+1);
    upcoming = {...PRAYERS[0], time:t};
  }
  return upcoming;
}

function renderList(){
  const list = document.getElementById('prayerList');
  list.innerHTML = '';
  const activeKey = nextInfo ? nextInfo.key : null;
  PRAYERS.forEach(p=>{
    const div = document.createElement('div');
    div.className = 'prayer-card' + (p.key===activeKey ? ' active' : '');
    div.innerHTML = `
      <div class="prayer-left">
        <div class="prayer-icon">${ICONS[p.key]}</div>
        <div>
          <div class="prayer-name">${p.name}</div>
          <div class="prayer-sub">${p.sub}</div>
        </div>
      </div>
      <div class="prayer-time">${fmtHM(timings[p.key])}</div>
    `;
    list.appendChild(div);
  });
}

function tickCountdown(){
  if(!timings) return;
  nextInfo = computeNext();
  document.getElementById('nextPrayerName').textContent = nextInfo.name;
  const diff = nextInfo.time - new Date();
  const h = Math.floor(diff/3600000);
  const m = Math.floor((diff%3600000)/60000);
  const s = Math.floor((diff%60000)/1000);
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('countdown').textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
  renderList();
}

async function loadPrayerTimes(lat, lng, label){
  document.getElementById('statusMsg').textContent = 'جارٍ تحميل مواقيت الصلاة…';
  try{
    const res = await fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lng}&method=3`);
    const data = await res.json();
    if(data.code !== 200) throw new Error('bad response');
    timings = data.data.timings;
    const hijri = data.data.date.hijri;
    const greg = data.data.date.gregorian;
    document.getElementById('hijriDate').textContent = `${hijri.day} ${hijri.month.ar} ${hijri.year}هـ`;
    document.getElementById('gregDate').textContent = `${greg.weekday.ar} ${greg.day} ${greg.month.en} ${greg.year}`;
    document.getElementById('cityName').textContent = label;
    document.getElementById('statusMsg').textContent = '';
    tickCountdown();
  }catch(e){
    document.getElementById('statusMsg').textContent = 'تعذّر تحميل المواقيت. حاول مرة أخرى.';
  }
}

function useDefaultLocation(){
  // Annaba, Algeria as fallback
  loadPrayerTimes(36.9000, 7.7667, 'عنابة، الجزائر');
}

function locateUser(){
  document.getElementById('cityName').textContent = 'جارٍ التحديد…';
  if(!navigator.geolocation){ useDefaultLocation(); return; }
  navigator.geolocation.getCurrentPosition(
    pos => loadPrayerTimes(pos.coords.latitude, pos.coords.longitude, 'موقعك الحالي'),
    () => useDefaultLocation(),
    {timeout:6000}
  );
}

document.getElementById('locateBtn').addEventListener('click', locateUser);

useDefaultLocation();
setInterval(tickCountdown, 1000);
</script>
</body>
</html>
