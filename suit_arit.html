 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكاة المتتاليات الحسابية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            padding: 30px;
            width: 100%;
            max-width: 900px;
            backdrop-filter: blur(10px);
        }
        h1 {
            text-align: center;
            color: #1e3c72;
            margin-bottom: 30px;
            font-size: 2.2rem;
            border-bottom: 3px solid #2a5298;
            padding-bottom: 15px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-bottom: 25px;
            background: #f0f4ff;
            padding: 20px;
            border-radius: 15px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .input-group label {
            font-weight: bold;
            color: #1e3c72;
            margin-bottom: 5px;
            font-size: 1rem;
        }
        .input-group input {
            padding: 12px 15px;
            border: 2px solid #d0d7e2;
            border-radius: 10px;
            font-size: 1rem;
            width: 140px;
            text-align: center;
            transition: 0.3s;
            background: white;
        }
        .input-group input:focus {
            border-color: #2a5298;
            outline: none;
            box-shadow: 0 0 0 3px rgba(42,82,152,0.2);
        }
        .buttons {
            display: flex;
            gap: 15px;
            align-self: flex-end;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            background: #2a5298;
            color: white;
            letter-spacing: 0.5px;
        }
        button:hover {
            background: #1e3c72;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        button.reset {
            background: #e74c3c;
        }
        button.reset:hover {
            background: #c0392b;
        }
        button:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .output-area {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        .table-container {
            flex: 1 1 250px;
            background: #f9fbfd;
            border-radius: 12px;
            padding: 15px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
            max-height: 350px;
            overflow-y: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        th {
            background: #2a5298;
            color: white;
            padding: 10px;
            position: sticky;
            top: 0;
            border-radius: 8px 8px 0 0;
        }
        td {
            padding: 8px 10px;
            text-align: center;
            border-bottom: 1px solid #e0e6ed;
            transition: 0.2s;
        }
        .new-row {
            background-color: #e8f0fe;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chart-container {
            flex: 1 1 400px;
            background: white;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            width: 100%;
            height: auto;
            max-height: 300px;
            background: #ffffff;
            border-radius: 8px;
        }
        .sum-display {
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #1e3c72;
            background: #eaf0fa;
            padding: 12px 20px;
            border-radius: 10px;
            text-align: center;
        }
        .step-indicator {
            text-align: center;
            margin: 10px 0;
            color: #2a5298;
            font-weight: bold;
            height: 24px;
        }
        @media (max-width: 700px) {
            .container { padding: 20px; }
            .controls { flex-direction: column; align-items: center; }
            .buttons { align-self: center; }
            .input-group input { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📐 محاكاة المتتالية الحسابية</h1>

        <div class="controls">
            <div class="input-group">
                <label for="firstTerm">الحد الأول (أ₁)</label>
                <input type="number" id="firstTerm" value="3" step="any" required>
            </div>
            <div class="input-group">
                <label for="commonDiff">الفرق المشترك (د)</label>
                <input type="number" id="commonDiff" value="2" step="any" required>
            </div>
            <div class="input-group">
                <label for="numTerms">عدد الحدود (ن)</label>
                <input type="number" id="numTerms" value="10" min="1" max="80" step="1" required>
            </div>
            <div class="buttons">
                <button id="generateBtn">▶ توليد المتتالية</button>
                <button id="resetBtn" class="reset">↺ إعادة</button>
            </div>
        </div>

        <div class="step-indicator" id="stepIndicator"></div>

        <div class="output-area">
            <div class="table-container">
                <table id="seqTable">
                    <thead>
                        <tr>
                            <th>الرقم (ن)</th>
                            <th>الحد (أₙ)</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- dynamically filled -->
                    </tbody>
                </table>
            </div>
            <div class="chart-container">
                <canvas id="seqChart" width="400" height="250"></canvas>
            </div>
        </div>

        <div class="sum-display" id="sumDisplay">
            المجموع: سيظهر هنا بعد اكتمال التوليد
        </div>
    </div>

    <script>
        (function() {
            // DOM elements
            const firstTermInput = document.getElementById('firstTerm');
            const commonDiffInput = document.getElementById('commonDiff');
            const numTermsInput = document.getElementById('numTerms');
            const generateBtn = document.getElementById('generateBtn');
            const resetBtn = document.getElementById('resetBtn');
            const tableBody = document.getElementById('tableBody');
            const stepIndicator = document.getElementById('stepIndicator');
            const sumDisplay = document.getElementById('sumDisplay');
            const canvas = document.getElementById('seqChart');
            const ctx = canvas.getContext('2d');

            // State variables
            let animationInterval = null;
            let currentStep = 0;
            let termsArray = [];
            let isAnimating = false;

            // Helper to clear any ongoing animation
            function stopAnimation() {
                if (animationInterval) {
                    clearInterval(animationInterval);
                    animationInterval = null;
                }
                isAnimating = false;
                generateBtn.disabled = false;
            }

            // Reset everything
            function resetAll() {
                stopAnimation();
                // Clear table
                tableBody.innerHTML = '';
                // Clear canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                // Reset indicator and sum
                stepIndicator.textContent = '';
                sumDisplay.textContent = 'المجموع: سيظهر هنا بعد اكتمال التوليد';
                // Reset state
                currentStep = 0;
                termsArray = [];
                // Enable generate button
                generateBtn.disabled = false;
                // Optionally set focus to first input
                firstTermInput.focus();
            }

            // Draw the chart up to index 'endIndex' (0-based, so draw points from 0 to endIndex-1)
            function drawChart(endIndex) {
                if (!canvas || !ctx) return;
                const w = canvas.width;
                const h = canvas.height;
                ctx.clearRect(0, 0, w, h);

                if (endIndex <= 0 || termsArray.length === 0) return;

                // Determine visible terms slice
                const visibleTerms = termsArray.slice(0, endIndex);
                const nTotal = termsArray.length;
                const xMin = 1;
                const xMax = nTotal;

                // Compute y range from full termsArray for consistent scaling
                let yMin = Math.min(...termsArray);
                let yMax = Math.max(...termsArray);
                // If constant, add padding
                if (yMin === yMax) {
                    yMin -= 1;
                    yMax += 1;
                }
                const yRange = yMax - yMin;
                const padding = { left: 40, right: 20, top: 20, bottom: 30 };
                const plotWidth = w - padding.left - padding.right;
                const plotHeight = h - padding.top - padding.bottom;

                // Draw axes
                ctx.strokeStyle = '#b0bec5';
                ctx.lineWidth = 1;
                ctx.beginPath();
                // x-axis
                ctx.moveTo(padding.left, h - padding.bottom);
                ctx.lineTo(w - padding.right, h - padding.bottom);
                // y-axis
                ctx.moveTo(padding.left, padding.top);
                ctx.lineTo(padding.left, h - padding.bottom);
                ctx.stroke();

                // Draw axis labels
                ctx.fillStyle = '#2c3e50';
                ctx.font = '10px Tahoma';
                ctx.textAlign = 'center';
                // x-axis label
                ctx.fillText('ن', w - padding.right + 15, h - padding.bottom + 4);
                // y-axis label
                ctx.save();
                ctx.translate(padding.left - 25, h/2);
                ctx.rotate(-Math.PI/2);
                ctx.fillText('أₙ', 0, 0);
                ctx.restore();

                // Draw grid and y-axis ticks (simple)
                ctx.strokeStyle = '#e0e0e0';
                ctx.lineWidth = 0.5;
                const yTicks = 5;
                for (let i = 0; i <= yTicks; i++) {
                    const yVal = yMin + (i / yTicks) * yRange;
                    const yPos = h - padding.bottom - ((yVal - yMin) / yRange) * plotHeight;
                    ctx.beginPath();
                    ctx.moveTo(padding.left, yPos);
                    ctx.lineTo(w - padding.right, yPos);
                    ctx.stroke();
                    ctx.fillStyle = '#2c3e50';
                    ctx.textAlign = 'right';
                    ctx.fillText(yVal.toFixed(1), padding.left - 5, yPos + 3);
                }

                // Draw line connecting visible points
                if (visibleTerms.length > 1) {
                    ctx.beginPath();
                    ctx.strokeStyle = '#2a5298';
                    ctx.lineWidth = 2.5;
                    for (let i = 0; i < visibleTerms.length; i++) {
                        const x = padding.left + ((i + 1 - xMin) / (xMax - xMin)) * plotWidth;
                        const y = h - padding.bottom - ((visibleTerms[i] - yMin) / yRange) * plotHeight;
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }

                // Draw points
                for (let i = 0; i < visibleTerms.length; i++) {
                    const x = padding.left + ((i + 1 - xMin) / (xMax - xMin)) * plotWidth;
                    const y = h - padding.bottom - ((visibleTerms[i] - yMin) / yRange) * plotHeight;
                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, 2 * Math.PI);
                    ctx.fillStyle = '#e74c3c';
                    ctx.fill();
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    // Optionally write small value near point
                    ctx.fillStyle = '#2c3e50';
                    ctx.font = '9px Tahoma';
                    ctx.textAlign = 'left';
                    ctx.fillText(visibleTerms[i].toFixed(1), x + 8, y - 8);
                }
            }

            // Add a row to the table for a given term (1-indexed)
            function addTableRow(index, value) {
                const row = document.createElement('tr');
                row.className = 'new-row';
                row.innerHTML = `<td>${index}</td><td>${value.toFixed(4)}</td>`;
                tableBody.appendChild(row);
                // scroll to bottom
                const container = document.querySelector('.table-container');
                if (container) container.scrollTop = container.scrollHeight;
            }

            // Compute sum up to n terms
            function computeSum(n) {
                if (n <= 0) return 0;
                const a = parseFloat(firstTermInput.value) || 0;
                const d = parseFloat(commonDiffInput.value) || 0;
                // S_n = n/2 * (2a + (n-1)d)
                return (n / 2) * (2 * a + (n - 1) * d);
            }

            // Generate the full terms array based on inputs
            function generateTermsArray() {
                const a = parseFloat(firstTermInput.value) || 0;
                const d = parseFloat(commonDiffInput.value) || 0;
                const n = parseInt(numTermsInput.value, 10);
                if (isNaN(n) || n < 1) return [];
                const arr = [];
                for (let i = 0; i < n; i++) {
                    arr.push(a + i * d);
                }
                return arr;
            }

            // Start the animation sequence
            function startGeneration() {
                // Validate inputs
                const n = parseInt(numTermsInput.value, 10);
                if (isNaN(n) || n < 1) {
                    alert('الرجاء إدخال عدد حدود صحيح أكبر من 0');
                    return;
                }
                if (n > 80) {
                    alert('الحد الأقصى لعدد الحدود هو 80 لتجنب بطء المتصفح');
                    return;
                }

                // Stop any existing animation
                stopAnimation();
                // Reset display elements
                tableBody.innerHTML = '';
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                stepIndicator.textContent = '';
                sumDisplay.textContent = 'المجموع: سيظهر هنا بعد اكتمال التوليد';
                currentStep = 0;

                // Generate terms array
                termsArray = generateTermsArray();
                if (termsArray.length === 0) return;

                // Disable generate button during animation
                generateBtn.disabled = true;
                isAnimating = true;

                const totalSteps = termsArray.length;
                // Animate step by step
                animationInterval = setInterval(() => {
                    if (currentStep < totalSteps) {
                        // Add one term
                        const termValue = termsArray[currentStep];
                        addTableRow(currentStep + 1, termValue);
                        // Update chart up to current step + 1 (since we want to show this point)
                        drawChart(currentStep + 1);
                        // Update step indicator
                        stepIndicator.textContent = `جاري توليد الحد ${currentStep + 1} من ${totalSteps}`;
                        currentStep++;
                    } else {
                        // Animation complete
                        clearInterval(animationInterval);
                        animationInterval = null;
                        isAnimating = false;
                        generateBtn.disabled = false;
                        stepIndicator.textContent = '✅ تم توليد جميع الحدود';
                        // Show sum
                        const sum = computeSum(totalSteps);
                        sumDisplay.textContent = `المجموع (Sₙ) = ${sum.toFixed(4)}`;
                        // Optionally, ensure chart is fully drawn (it already is)
                        drawChart(totalSteps);
                    }
                }, 300); // 300ms delay per term
            }

            // Event listeners
            generateBtn.addEventListener('click', startGeneration);
            resetBtn.addEventListener('click', resetAll);

            // Prevent accidental form submission if inside form (there isn't)
            // Also allow pressing Enter in inputs to trigger generation
            const inputs = [firstTermInput, commonDiffInput, numTermsInput];
            inputs.forEach(input => {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (!isAnimating) {
                            startGeneration();
                        }
                    }
                });
            });

            // Initial draw empty canvas (optional)
            drawChart(0);
        })();
    </script>
</body>
</html>
