 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أنواع أجهزة قياس ضغط الدم وطريقة استعمالها</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Tajawal:wght@400;500;700&display=swap');

:root{
  --bg:#EEF3F5;
  --panel:#FFFFFF;
  --ink:#1E2C3A;
  --dim:#5C6B7A;
  --line:#DCE4E9;
  --teal:#1F7A73;
  --teal-light:#E4F1EF;
  --coral:#C85B4E;
  --coral-light:#FBEAE7;
  --gold:#B8873B;
  --gold-light:#FBF3E4;
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',sans-serif;}

.wrap{max-width:880px;margin:0 auto;padding:34px 18px 70px;}

header{text-align:center;margin-bottom:30px;}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;letter-spacing:.18em;color:var(--teal);text-transform:uppercase;
}
h1{
  font-family:'Space Grotesk',sans-serif;
  font-size:clamp(24px,4.4vw,34px);
  margin:8px 0 6px;
}
.sub{color:var(--dim);font-size:14.5px;max-width:560px;margin:0 auto;line-height:1.8;}

nav.tabs{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
  margin:28px 0 22px;
}
nav.tabs button{
  font-family:'Tajawal',sans-serif;
  font-weight:700;
  font-size:13.5px;
  border:1.5px solid var(--line);
  background:var(--panel);
  color:var(--dim);
  padding:10px 18px;
  border-radius:999px;
  cursor:pointer;
  transition:.15s ease;
}
nav.tabs button.active{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink);
}

section{display:none;}
section.active{display:block;}

/* ---------- Types grid ---------- */
.types-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:16px;
}
.type-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px 18px 16px;
  cursor:pointer;
  transition:.2s ease;
}
.type-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(30,44,58,.08);}
.type-card .icon{width:56px;height:56px;margin-bottom:10px;}
.type-card h3{
  font-family:'Space Grotesk',sans-serif;
  font-size:16px;margin:0 0 4px;
}
.type-card .tagline{font-size:12.5px;color:var(--teal);font-weight:700;margin-bottom:8px;}
.type-card p{font-size:13px;color:var(--dim);line-height:1.75;margin:0;}
.type-card .details{
  display:none;
  margin-top:12px;
  border-top:1px dashed var(--line);
  padding-top:12px;
}
.type-card.open .details{display:block;}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.pill{
  font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;
}
.pill.good{background:var(--teal-light);color:var(--teal);}
.pill.bad{background:var(--coral-light);color:var(--coral);}
.expand-hint{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;color:#9aa8b5;margin-top:10px;
}

/* ---------- How-to steps ---------- */
.stepper{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:24px;
}
.step-progress{
  display:flex;
  gap:6px;
  margin-bottom:22px;
}
.step-progress .dot{
  flex:1;height:5px;border-radius:3px;background:var(--line);
}
.step-progress .dot.done{background:var(--teal);}

.step-body{
  display:flex;
  gap:24px;
  align-items:center;
  flex-wrap:wrap;
}
.step-illustration{
  flex:0 0 auto;
  width:200px;height:200px;
  background:var(--teal-light);
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;
}
.step-illustration svg{width:150px;height:150px;}
.step-text{flex:1;min-width:220px;}
.step-num{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;color:var(--teal);letter-spacing:.1em;
}
.step-title{
  font-family:'Space Grotesk',sans-serif;
  font-size:20px;margin:4px 0 8px;
}
.step-desc{font-size:14px;color:var(--dim);line-height:1.85;}

.step-nav{
  display:flex;justify-content:space-between;margin-top:24px;
}
.step-nav button{
  font-family:'Tajawal',sans-serif;font-weight:700;font-size:13.5px;
  border:none;border-radius:10px;padding:11px 20px;cursor:pointer;
}
.step-nav .prev{background:#EEF1F3;color:var(--ink);}
.step-nav .next{background:var(--ink);color:#fff;}
.step-nav button:disabled{opacity:.35;cursor:not-allowed;}

/* ---------- Mistakes ---------- */
.mistakes{
  margin-top:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:12px;
}
.mistake-card{
  background:var(--coral-light);
  border:1px solid #f0d3cd;
  border-radius:14px;
  padding:14px 16px;
  font-size:13px;
  color:#7a3a30;
  line-height:1.7;
}
.mistake-card b{display:block;font-family:'Space Grotesk',sans-serif;font-size:14px;color:var(--coral);margin-bottom:4px;}

footer{
  margin-top:30px;font-size:11.5px;color:#8b98a5;text-align:center;line-height:1.7;
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">دليل تعليمي تفاعلي</div>
    <h1>أجهزة قياس ضغط الدم: الأنواع وطريقة الاستعمال</h1>
    <p class="sub">تعرّف على الأنواع الأربعة الشائعة لأجهزة قياس ضغط الدم، ثم اتبع الخطوات الصحيحة للحصول على قراءة دقيقة وموثوقة.</p>
  </header>

  <nav class="tabs">
    <button class="active" data-tab="types">🩺 الأنواع</button>
    <button data-tab="howto">📋 خطوات الاستعمال</button>
    <button data-tab="mistakes">⚠️ أخطاء شائعة</button>
  </nav>

  <!-- ===== TYPES ===== -->
  <section id="types" class="active">
    <div class="types-grid" id="typesGrid"></div>
  </section>

  <!-- ===== HOW TO ===== -->
  <section id="howto">
    <div class="stepper">
      <div class="step-progress" id="stepProgress"></div>
      <div class="step-body">
        <div class="step-illustration" id="stepIllustration"></div>
        <div class="step-text">
          <div class="step-num" id="stepNum">الخطوة 1 / 7</div>
          <h3 class="step-title" id="stepTitle"></h3>
          <p class="step-desc" id="stepDesc"></p>
        </div>
      </div>
      <div class="step-nav">
        <button class="prev" id="prevBtn">السابق</button>
        <button class="next" id="nextBtn">التالي</button>
      </div>
    </div>
  </section>

  <!-- ===== MISTAKES ===== -->
  <section id="mistakes">
    <div class="mistakes" id="mistakesGrid"></div>
  </section>

  <footer>
    هذا الدليل لأغراض تعليمية عامة ولا يغني عن استشارة طبيب أو ممرض مختص، خصوصًا عند وجود قراءات غير معتادة.
  </footer>
</div>

<script>
(function(){
  // ---------------- Tabs ----------------
  const tabBtns = document.querySelectorAll('nav.tabs button');
  const sections = document.querySelectorAll('section');
  tabBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      tabBtns.forEach(b=>b.classList.remove('active'));
      sections.forEach(s=>s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });

  // ---------------- Types data ----------------
  const icons = {
    mercury: `<svg viewBox="0 0 56 56"><rect x="24" y="6" width="8" height="34" rx="3" fill="#B8873B"/><circle cx="28" cy="44" r="8" fill="#C85B4E"/><rect x="10" y="6" width="6" height="6" rx="1" fill="#1F7A73"/></svg>`,
    aneroid: `<svg viewBox="0 0 56 56"><circle cx="28" cy="26" r="19" fill="#fff" stroke="#B8873B" stroke-width="4"/><line x1="28" y1="26" x2="28" y2="12" stroke="#C85B4E" stroke-width="2.5" stroke-linecap="round"/><circle cx="28" cy="26" r="2.5" fill="#1E2C3A"/><rect x="22" y="44" width="12" height="8" rx="2" fill="#1F7A73"/></svg>`,
    digitalArm: `<svg viewBox="0 0 56 56"><rect x="10" y="10" width="36" height="26" rx="4" fill="#1F7A73"/><rect x="15" y="15" width="26" height="12" rx="2" fill="#fff"/><text x="28" y="24" font-size="8" text-anchor="middle" fill="#1F7A73" font-family="monospace">120/80</text><rect x="20" y="38" width="16" height="10" rx="2" fill="#B8873B"/></svg>`,
    digitalWrist: `<svg viewBox="0 0 56 56"><rect x="16" y="14" width="24" height="20" rx="4" fill="#1F7A73"/><rect x="20" y="18" width="16" height="9" rx="2" fill="#fff"/><path d="M12 24c-4 0-4 8 0 8" stroke="#B8873B" stroke-width="3" fill="none"/><path d="M44 24c4 0 4 8 0 8" stroke="#B8873B" stroke-width="3" fill="none"/></svg>`
  };

  const types = [
    {
      id:'mercury',
      name:'المقياس الزئبقي',
      tag:'المعيار الذهبي (تاريخيًا)',
      desc:'عمود زجاجي مملوء بالزئبق يرتفع مع نفخ الكفة، ويُقرأ الضغط عند مستوى العمود مع سماعة طبية.',
      pros:['دقة عالية جدًا','لا يحتاج معايرة متكررة'],
      cons:['ثقيل وغير محمول','يحتوي زئبقًا سامًا عند الكسر','آخذ في الاختفاء من الاستخدام السريري'],
    },
    {
      id:'aneroid',
      name:'المقياس العقربي (الزنبركي)',
      tag:'شائع في العيادات',
      desc:'يستخدم آلية ميكانيكية بعقرب يتحرك على قرص مدرّج بدلاً من الزئبق، ويحتاج سماعة طبية للاستماع لنبضات كوروتكوف.',
      pros:['خفيف ومحمول','لا يحتوي زئبقًا'],
      cons:['يحتاج معايرة دورية','يتطلب مهارة وتدريبًا على الاستخدام'],
    },
    {
      id:'digitalArm',
      name:'الجهاز الرقمي (للذراع العلوي)',
      tag:'الأكثر شيوعًا منزليًا',
      desc:'كفة تُلف حول أعلى الذراع وتنفخ وتُفرغ أوتوماتيكيًا، مع شاشة تعرض الانقباضي والانبساطي والنبض مباشرة.',
      pros:['سهل الاستخدام دون تدريب','قراءة رقمية واضحة','بعضها يحفظ القراءات السابقة'],
      cons:['أعلى تكلفة قليلاً من العقربي','يحتاج بطاريات أو شحن'],
    },
    {
      id:'digitalWrist',
      name:'الجهاز الرقمي (للمعصم)',
      tag:'للسفر والتنقل',
      desc:'أصغر حجمًا ويُلبس حول المعصم، مناسب للتنقل لكنه أكثر حساسية لوضعية اليد أثناء القياس.',
      pros:['صغير وخفيف جدًا','سهل الحمل في السفر'],
      cons:['أقل دقة إذا لم يكن المعصم بمستوى القلب','أكثر تأثرًا بحركة اليد'],
    }
  ];

  const typesGrid = document.getElementById('typesGrid');
  types.forEach(t=>{
    const card = document.createElement('div');
    card.className='type-card';
    card.innerHTML = `
      <div class="icon">${icons[t.id]}</div>
      <div class="tagline">${t.tag}</div>
      <h3>${t.name}</h3>
      <p>${t.desc}</p>
      <div class="expand-hint">اضغط لعرض المزايا والعيوب ▾</div>
      <div class="details">
        <div class="pill-row">
          ${t.pros.map(p=>`<span class="pill good">✓ ${p}</span>`).join('')}
        </div>
        <div class="pill-row">
          ${t.cons.map(c=>`<span class="pill bad">✕ ${c}</span>`).join('')}
        </div>
      </div>
    `;
    card.addEventListener('click', ()=>card.classList.toggle('open'));
    typesGrid.appendChild(card);
  });

  // ---------------- How-to steps ----------------
  const stepIcons = [
    `<svg viewBox="0 0 100 100"><circle cx="50" cy="30" r="14" fill="#1F7A73"/><rect x="30" y="48" width="40" height="40" rx="10" fill="#B8873B"/></svg>`, // sit rest
    `<svg viewBox="0 0 100 100"><rect x="20" y="60" width="60" height="16" rx="8" fill="#B8873B"/><circle cx="50" cy="30" r="14" fill="#1F7A73"/><rect x="35" y="44" width="30" height="14" rx="7" fill="#1F7A73"/></svg>`, // seated posture
    `<svg viewBox="0 0 100 100"><rect x="30" y="20" width="18" height="60" rx="9" fill="#e8c9a3"/><rect x="24" y="38" width="30" height="18" rx="6" fill="#1F7A73"/></svg>`, // cuff on arm
    `<svg viewBox="0 0 100 100"><rect x="30" y="20" width="18" height="60" rx="9" fill="#e8c9a3"/><circle cx="39" cy="50" r="4" fill="#C85B4E"/><path d="M39 50 Q 60 50 60 70" stroke="#1E2C3A" stroke-width="2" fill="none"/><circle cx="63" cy="74" r="6" fill="#1E2C3A"/></svg>`, // heart level
    `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="6" fill="#1E2C3A"/><path d="M50 50 L50 20" stroke="#1E2C3A" stroke-width="2"/><text x="50" y="90" text-anchor="middle" font-size="10" fill="#5C6B7A">صمت</text></svg>`, // silence
    `<svg viewBox="0 0 100 100"><rect x="20" y="30" width="60" height="40" rx="6" fill="#1F7A73"/><rect x="28" y="38" width="44" height="16" rx="2" fill="#fff"/><text x="50" y="50" text-anchor="middle" font-size="9" fill="#1F7A73" font-family="monospace">120/80</text></svg>`, // read
    `<svg viewBox="0 0 100 100"><rect x="15" y="35" width="30" height="20" rx="3" fill="#fff" stroke="#B8873B" stroke-width="2"/><rect x="55" y="35" width="30" height="20" rx="3" fill="#fff" stroke="#B8873B" stroke-width="2"/><path d="M45 45 L55 45" stroke="#5C6B7A" stroke-width="2"/></svg>` // repeat/log
  ];

  const steps = [
    {title:'الراحة قبل القياس', desc:'اجلس واسترح لمدة 5 دقائق على الأقل قبل القياس، وتجنّب الكافيين والتدخين والرياضة قبل القياس بـ30 دقيقة.'},
    {title:'وضعية الجلوس الصحيحة', desc:'اجلس على كرسي بظهر مسنود، قدماك مستوية على الأرض دون تقاطع الساقين، وظهرك مستقيم.'},
    {title:'تركيب الكفة', desc:'لف الكفة حول الذراع العلوي مباشرة على الجلد (وليس فوق الملابس السميكة)، بحيث تكون مشدودة باعتدال دون ضغط زائد.'},
    {title:'مستوى الذراع مع القلب', desc:'ضع ذراعك على طاولة بحيث يكون منتصف الكفة في نفس مستوى القلب تقريبًا، مع دعم الذراع بالكامل.'},
    {title:'الصمت وعدم الحركة', desc:'ابقَ صامتًا وساكنًا أثناء القياس، فالكلام أو الحركة قد يرفع القراءة بشكل غير حقيقي.'},
    {title:'قراءة النتيجة', desc:'سجّل الرقمين: الانقباضي (العلوي) والانبساطي (السفلي)، ومعدل النبض إن ظهر على الشاشة.'},
    {title:'التكرار والتسجيل', desc:'يُفضّل أخذ قياسين متتاليين بفارق دقيقة إلى دقيقتين وتسجيل المتوسط، خصوصًا عند المتابعة المنزلية.'}
  ];

  let stepIdx = 0;
  const stepProgress = document.getElementById('stepProgress');
  const stepIllustration = document.getElementById('stepIllustration');
  const stepNum = document.getElementById('stepNum');
  const stepTitle = document.getElementById('stepTitle');
  const stepDesc = document.getElementById('stepDesc');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  steps.forEach(()=>{
    const d=document.createElement('div');
    d.className='dot';
    stepProgress.appendChild(d);
  });

  function renderStep(){
    stepIllustration.innerHTML = stepIcons[stepIdx];
    stepNum.textContent = `الخطوة ${stepIdx+1} / ${steps.length}`;
    stepTitle.textContent = steps[stepIdx].title;
    stepDesc.textContent = steps[stepIdx].desc;
    [...stepProgress.children].forEach((dot,i)=>{
      dot.classList.toggle('done', i<=stepIdx);
    });
    prevBtn.disabled = stepIdx===0;
    nextBtn.textContent = stepIdx===steps.length-1 ? 'إنهاء ✓' : 'التالي';
  }
  prevBtn.addEventListener('click', ()=>{ if(stepIdx>0){ stepIdx--; renderStep(); }});
  nextBtn.addEventListener('click', ()=>{
    if(stepIdx<steps.length-1){ stepIdx++; renderStep(); }
    else { stepIdx=0; renderStep(); }
  });
  renderStep();

  // ---------------- Mistakes ----------------
  const mistakes = [
    {title:'وضع الكفة فوق الملابس', text:'يمنع قراءة صحيحة ويزيد الخطأ في القيمة النهائية.'},
    {title:'ذراع أسفل أو أعلى من القلب', text:'يرفع أو يخفض القراءة بشكل مصطنع حتى لو كان الضغط الحقيقي طبيعيًا.'},
    {title:'الكلام أو تحريك الجسم أثناء القياس', text:'يسبب ارتفاعًا مؤقتًا وغير حقيقي في الأرقام.'},
    {title:'قياس مباشرة بعد قهوة أو رياضة', text:'يعطي قراءة أعلى من الضغط الفعلي في حالة الراحة.'},
    {title:'كفة غير مناسبة لحجم الذراع', text:'كفة صغيرة جدًا ترفع القراءة، وكفة كبيرة جدًا قد تخفضها.'},
    {title:'قياس واحد فقط دون تكرار', text:'قد لا يعكس الوضع الحقيقي؛ يُفضّل أخذ قياسين وتسجيل المتوسط.'}
  ];
  const mistakesGrid = document.getElementById('mistakesGrid');
  mistakes.forEach(m=>{
    const c=document.createElement('div');
    c.className='mistake-card';
    c.innerHTML = `<b>${m.title}</b>${m.text}`;
    mistakesGrid.appendChild(c);
  });
})();
</script>
</body>
</html>
