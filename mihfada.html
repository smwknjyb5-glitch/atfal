 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محفظة التلميذ ومحتوياتها</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC;
    --paper-dark:#F1E9D8;
    --ink:#26241E;
    --navy:#25436B;
    --navy-deep:#152A47;
    --clay:#E2593D;
    --leaf:#3E7D57;
    --gold:#D9A441;
    --card:#FFFFFF;
    --line:#E4D9C0;
    --radius:18px;
    --shadow: 0 10px 30px rgba(37,67,107,.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 15% -10%, rgba(217,164,65,.16), transparent 45%),
      radial-gradient(ellipse at 100% 0%, rgba(62,125,87,.10), transparent 40%),
      var(--paper);
    color:var(--ink);
    font-family:'Almarai',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  h1,h2,h3,.disp{font-family:'Tajawal',sans-serif;}

  /* ===== notebook-rule texture strip ===== */
  .rule-strip{
    height:10px;
    background: repeating-linear-gradient(90deg, var(--clay) 0 26px, transparent 26px 40px);
    opacity:.55;
  }

  header{
    text-align:center;
    padding:46px 18px 20px;
    position:relative;
  }
  header .eyebrow{
    display:inline-block;
    background:var(--navy);
    color:var(--paper);
    font-family:'Tajawal',sans-serif;
    font-weight:700;
    font-size:.85rem;
    letter-spacing:.5px;
    padding:6px 18px;
    border-radius:999px;
    margin-bottom:14px;
  }
  header h1{
    font-size:clamp(2rem, 5vw, 3.1rem);
    font-weight:900;
    color:var(--navy-deep);
    margin:0 0 10px;
  }
  header h1 span{color:var(--clay);}
  header p{
    max-width:560px;
    margin:0 auto;
    color:#5c5646;
    font-size:1.05rem;
    line-height:1.9;
  }

  main{max-width:1080px;margin:0 auto;padding:0 20px;}

  /* ===================== BAG STAGE ===================== */
  .stage{
    position:relative;
    margin:34px auto 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:520px;
    justify-content:center;
  }
  .desk{
    position:absolute;
    bottom:0; left:0; right:0;
    height:230px;
    background:
      linear-gradient(180deg, transparent, rgba(37,67,107,.06)),
      repeating-linear-gradient(90deg, #EADFC5 0 3px, #E4D6B8 3px 90px);
    border-top:3px solid var(--line);
    border-radius:0 0 24px 24px;
    z-index:0;
  }
  .bag-wrap{
    position:relative;
    z-index:2;
    cursor:pointer;
    transition:transform .35s ease;
  }
  .bag-wrap:hover{transform:translateY(-4px);}
  .bag-wrap.opened{cursor:default;}
  .bag-wrap.opened:hover{transform:none;}

  svg.bag{width:250px;height:auto;display:block;filter:drop-shadow(0 18px 20px rgba(21,42,71,.22));}
  .flap{ transform-origin: 125px 108px; transition: transform .6s cubic-bezier(.34,1.56,.64,1); }
  .bag-wrap.opened .flap{ transform: rotate(-128deg) translate(-4px,-6px); }
  .zip-hint{
    position:absolute; bottom:-38px; left:50%; transform:translateX(-50%);
    font-family:'Tajawal',sans-serif; font-weight:700; color:var(--navy);
    background:var(--gold); padding:7px 20px; border-radius:999px;
    font-size:.92rem; white-space:nowrap;
    animation: bob 1.6s ease-in-out infinite;
    border:none; cursor:pointer;
  }
  .bag-wrap.opened .zip-hint{display:none;}
  @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(-5px);}}

  /* close button (shown only after the bag is opened) */
  .close-hint{
    position:absolute; bottom:-38px; left:50%; transform:translateX(-50%);
    font-family:'Tajawal',sans-serif; font-weight:700; color:#fff;
    background:var(--clay); padding:7px 20px; border-radius:999px;
    font-size:.92rem; white-space:nowrap;
    border:none; cursor:pointer;
    display:none;
    transition:background .2s ease, transform .2s ease;
  }
  .close-hint:hover{background:#c94a31; transform:translateX(-50%) translateY(-2px);}
  .bag-wrap.opened .close-hint{display:inline-block;}

  .stitch{stroke-dasharray:4 4;}

  /* items spilling out */
  .spill{
    position:relative;
    z-index:1;
    display:flex; flex-wrap:wrap; justify-content:center; gap:14px;
    max-width:900px;
    margin-top:-30px;
    padding-top:20px;
    opacity:0; pointer-events:none;
    transition:opacity .5s ease .25s;
  }
  .bag-wrap.opened ~ .spill{opacity:1; pointer-events:auto;}

  .item{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    width:104px; height:118px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px;
    cursor:pointer;
    box-shadow:0 6px 14px rgba(37,67,107,.08);
    transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    opacity:0; transform:translateY(18px) scale(.85);
    animation:pop .5s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  .item:hover{transform:translateY(-6px) scale(1.04); box-shadow:0 14px 22px rgba(37,67,107,.18); border-color:var(--clay);}
  .item span.lbl{font-size:.78rem; font-weight:700; color:var(--navy-deep); text-align:center; padding:0 6px; line-height:1.25;}
  @keyframes pop{to{opacity:1; transform:translateY(0) scale(1);}}

  .icon{width:44px;height:44px;position:relative;}

  /* ===== simple geometric icon set (shared palette) ===== */
  .icon-pencil{background:linear-gradient(135deg,#F2C14E 55%, #E2593D 55%);clip-path:polygon(0% 100%, 20% 60%, 100% 0%, 100% 22%, 24% 82%);border-radius:2px;}
  .icon-pen{background:var(--navy);clip-path:polygon(48% 0,58% 10%,58% 78%,50% 100%,42% 78%,42% 10%);}
  .icon-eraser{background:linear-gradient(90deg,#F2A6C0,#fff 55%);border-radius:8px 8px 4px 4px;border:2px solid #d98bab;height:26px;margin-top:9px;}
  .icon-sharpener{background:var(--leaf);border-radius:6px;clip-path:polygon(0 0,70% 0,100% 50%,70% 100%,0 100%);}
  .icon-ruler{background:repeating-linear-gradient(90deg, var(--gold) 0 4px, #fff 4px 10px);height:16px;margin-top:14px;border:1.5px solid var(--gold);border-radius:2px;}
  .icon-scissors{background:none;}
  .icon-scissors::before,.icon-scissors::after{content:"";position:absolute;width:16px;height:16px;border:3px solid var(--clay);border-radius:50%;top:20px;}
  .icon-scissors::before{left:2px;}
  .icon-scissors::after{right:2px;}
  .icon-glue{background:var(--gold);border-radius:6px 6px 3px 3px;clip-path:polygon(30% 0,70% 0,70% 18%,100% 30%,100% 100%,0 100%,0 30%,30% 18%);}
  .icon-colors{background:linear-gradient(90deg,#E2593D 0 20%, #D9A441 20% 40%, #3E7D57 40% 60%, #25436B 60% 80%, #8B5FBF 80% 100%);clip-path:polygon(0 100%,15% 40%,25% 0,35% 40%,50% 100%);height:34px;margin-top:6px;}
  .icon-book{background:var(--clay);border-radius:3px 8px 8px 3px;position:relative;}
  .icon-book::after{content:"";position:absolute;inset:5px 5px 5px 12px;background:rgba(255,255,255,.55);border-radius:2px;}
  .icon-notebook{background:#fff;border:2px solid var(--navy);border-radius:3px;position:relative;}
  .icon-notebook::before{content:"";position:absolute;right:-4px;top:2px;bottom:2px;width:5px;background:repeating-linear-gradient(180deg, var(--navy) 0 3px, transparent 3px 6px);}
  .icon-diary{background:var(--leaf);border-radius:4px;position:relative;}
  .icon-diary::after{content:"★";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:16px;}
  .icon-bottle{background:linear-gradient(180deg,#bfe3ea,#7fc4d4);border-radius:0 0 10px 10px;position:relative;margin-top:8px;height:36px;}
  .icon-bottle::before{content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:14px;height:10px;background:var(--navy);border-radius:2px;}
  .icon-sandwich{background:linear-gradient(180deg,#F2C14E,#fff 35%,#F2C14E 65%,#E2593D);border-radius:40% 40% 8px 8px;}
  .icon-bag{background:var(--navy);border-radius:6px;position:relative;}
  .icon-bag::after{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:18px;height:8px;border:3px solid var(--navy);border-bottom:none;border-radius:8px 8px 0 0;}

  /* ===================== CATEGORY LEGEND ===================== */
  .legend{
    display:flex; justify-content:center; flex-wrap:wrap; gap:10px;
    margin:38px 0 6px;
  }
  .legend button{
    font-family:'Tajawal',sans-serif; font-weight:700; font-size:.9rem;
    border:2px solid var(--line); background:#fff; color:var(--navy-deep);
    padding:8px 18px; border-radius:999px; cursor:pointer; transition:.2s;
  }
  .legend button.active, .legend button:hover{background:var(--navy); color:#fff; border-color:var(--navy);}

  /* ===================== DETAIL PANEL ===================== */
  .overlay{
    position:fixed; inset:0; background:rgba(21,42,71,.55);
    display:none; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .overlay.show{display:flex;}
  .panel{
    background:var(--card); border-radius:22px; max-width:440px; width:100%;
    padding:30px 28px 26px; position:relative; box-shadow:var(--shadow);
    animation:riseIn .3s ease;
  }
  @keyframes riseIn{from{opacity:0; transform:translateY(20px);}to{opacity:1; transform:translateY(0);}}
  .panel .icon{width:64px;height:64px;margin:0 auto 14px;}
  .panel h3{text-align:center; color:var(--navy-deep); font-size:1.4rem; margin:0 0 4px;}
  .panel .cat-tag{
    display:block; text-align:center; color:var(--clay); font-weight:700; font-size:.85rem; margin-bottom:16px;
  }
  .panel .field{margin-bottom:12px;}
  .panel .field b{color:var(--leaf); display:block; font-family:'Tajawal',sans-serif; margin-bottom:3px;}
  .panel .field p{margin:0; line-height:1.8; color:#463f30; font-size:.96rem;}
  .close-btn{
    position:absolute; top:14px; left:14px; width:32px; height:32px; border-radius:50%;
    border:none; background:var(--paper-dark); color:var(--navy-deep); font-size:1.1rem; cursor:pointer;
  }
  .close-btn:hover{background:var(--clay); color:#fff;}

  /* ===================== SECTION HEADERS ===================== */
  .section-head{text-align:center; margin:70px 0 26px;}
  .section-head .eyebrow{
    display:inline-block; color:var(--leaf); font-family:'Tajawal',sans-serif; font-weight:700;
    letter-spacing:1px; font-size:.85rem; margin-bottom:8px;
  }
  .section-head h2{font-size:1.9rem; color:var(--navy-deep); margin:0;}

  /* ===================== QUIZ ===================== */
  .quiz-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:28px; box-shadow:var(--shadow); max-width:680px; margin:0 auto;
  }
  .q-progress{
    font-family:'Tajawal',sans-serif; font-weight:700; color:var(--navy); font-size:.85rem; margin-bottom:10px;
  }
  .q-track{height:6px; background:var(--paper-dark); border-radius:99px; margin-bottom:22px; overflow:hidden;}
  .q-fill{height:100%; background:var(--gold); border-radius:99px; transition:width .4s ease;}
  .q-text{font-size:1.12rem; font-weight:700; color:var(--ink); margin-bottom:20px; line-height:1.7;}
  .q-options{display:flex; flex-direction:column; gap:10px;}
  .q-opt{
    text-align:right; border:2px solid var(--line); background:var(--paper); border-radius:12px;
    padding:13px 16px; cursor:pointer; font-family:'Almarai'; font-size:.98rem; color:var(--ink); transition:.2s;
  }
  .q-opt:hover{border-color:var(--navy);}
  .q-opt.correct{background:#E6F3EA; border-color:var(--leaf); color:#1f5236; font-weight:700;}
  .q-opt.wrong{background:#FBE7E2; border-color:var(--clay); color:#7d2a1a; font-weight:700;}
  .q-opt.disabled{pointer-events:none;}
  .q-explain{
    margin-top:16px; background:var(--paper-dark); border-radius:10px; padding:12px 14px;
    font-size:.92rem; color:#463f30; line-height:1.7; display:none;
  }
  .q-explain.show{display:block;}
  .q-next{
    margin-top:18px; display:none; background:var(--navy); color:#fff; border:none; padding:11px 22px;
    border-radius:999px; font-family:'Tajawal'; font-weight:700; cursor:pointer; font-size:.95rem;
  }
  .q-next.show{display:inline-block;}

  .quiz-result{text-align:center; display:none;}
  .quiz-result.show{display:block;}
  .quiz-result .score{font-family:'Tajawal',sans-serif; font-size:3rem; font-weight:900; color:var(--navy-deep);}
  .quiz-result p{color:#5c5646; line-height:1.8;}
  .restart-btn{
    background:var(--clay); color:#fff; border:none; padding:12px 26px; border-radius:999px;
    font-family:'Tajawal'; font-weight:700; cursor:pointer; margin-top:10px;
  }

  footer{text-align:center; color:#8a8371; font-size:.85rem; margin-top:60px;}

  @media (max-width:560px){
    .item{width:88px; height:104px;}
    svg.bag{width:200px;}
  }
</style>
</head>
<body>

<header>
  <span class="eyebrow">محاكاة تفاعلية</span>
  <h1>محفظة <span>التلميذ</span> ومحتوياتها</h1>
  <p>افتح المحفظة، اكتشف كل غرض بداخلها، وتعرّف على استعماله... ثم اختبر معلوماتك في اختبار قصير.</p>
</header>
<div class="rule-strip"></div>

<main>

  <!-- ============ BAG STAGE ============ -->
  <section class="stage">
    <div class="desk"></div>
    <div class="bag-wrap" id="bagWrap">
      <svg class="bag" viewBox="0 0 250 260">
        <!-- straps -->
        <path d="M85 40 C70 10, 60 -10, 75 -20" stroke="#152A47" stroke-width="10" fill="none" stroke-linecap="round" opacity="0"></path>
        <ellipse cx="125" cy="240" rx="88" ry="14" fill="#152A47" opacity=".12"></ellipse>
        <!-- main body -->
        <rect x="35" y="95" width="180" height="140" rx="26" fill="#25436B"></rect>
        <rect x="35" y="95" width="180" height="140" rx="26" fill="url(#bagGrad)" opacity=".5"></rect>
        <rect x="35" y="95" width="180" height="140" rx="26" fill="none" stroke="#152A47" stroke-width="3" class="stitch"></rect>
        <!-- front pocket -->
        <rect x="60" y="165" width="130" height="58" rx="16" fill="#1E3A5F"></rect>
        <rect x="60" y="165" width="130" height="58" rx="16" fill="none" stroke="#0F2138" stroke-width="2.5" class="stitch"></rect>
        <circle cx="125" cy="194" r="7" fill="#D9A441"></circle>
        <!-- side pockets -->
        <rect x="14" y="130" width="26" height="70" rx="12" fill="#1E3A5F"></rect>
        <rect x="210" y="130" width="26" height="70" rx="12" fill="#1E3A5F"></rect>
        <!-- straps top -->
        <rect x="70" y="60" width="18" height="45" rx="8" fill="#152A47"></rect>
        <rect x="162" y="60" width="18" height="45" rx="8" fill="#152A47"></rect>
        <!-- flap (opens) -->
        <g class="flap">
          <path d="M35 108 Q125 40 215 108 L215 118 Q125 60 35 118 Z" fill="#E2593D"></path>
          <rect x="35" y="70" width="180" height="55" rx="20" fill="#2B4C7E"></rect>
          <rect x="35" y="70" width="180" height="55" rx="20" fill="none" stroke="#152A47" stroke-width="3" class="stitch"></rect>
          <rect x="112" y="95" width="26" height="18" rx="4" fill="#D9A441"></rect>
        </g>
        <defs>
          <linearGradient id="bagGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3E6394"></stop>
            <stop offset="1" stop-color="#1E3A5F"></stop>
          </linearGradient>
        </defs>
      </svg>
      <button type="button" class="zip-hint" id="openHint">👆 انقر لفتح المحفظة</button>
      <button type="button" class="close-hint" id="closeHint">✕ إغلاق المحفظة</button>
    </div>

    <div class="spill" id="spill"></div>
  </section>

  <!-- ============ FILTER ============ -->
  <div class="legend" id="legend"></div>

  <!-- ============ QUIZ ============ -->
  <div class="section-head">
    <span class="eyebrow">اختبر نفسك</span>
    <h2>أي أداة تحتاج؟</h2>
  </div>
  <div class="quiz-card">
    <div id="quizBody">
      <div class="q-progress" id="qProgress"></div>
      <div class="q-track"><div class="q-fill" id="qFill"></div></div>
      <div class="q-text" id="qText"></div>
      <div class="q-options" id="qOptions"></div>
      <div class="q-explain" id="qExplain"></div>
      <button class="q-next" id="qNext">السؤال التالي ←</button>
    </div>
    <div class="quiz-result" id="quizResult">
      <div class="score" id="qScore"></div>
      <p id="qFeedback"></p>
      <button class="restart-btn" id="qRestart">إعادة الاختبار</button>
    </div>
  </div>

</main>

<footer>محاكاة تعليمية تفاعلية — محفظة التلميذ ومحتوياتها</footer>

<!-- ============ ITEM DETAIL OVERLAY ============ -->
<div class="overlay" id="overlay">
  <div class="panel">
    <button class="close-btn" id="closeBtn">✕</button>
    <div class="icon" id="panelIcon"></div>
    <h3 id="panelName"></h3>
    <span class="cat-tag" id="panelCat"></span>
    <div class="field"><b>الاستعمال</b><p id="panelUse"></p></div>
    <div class="field"><b>نصيحة</b><p id="panelTip"></p></div>
  </div>
</div>

<script>
/* ===================== DATA ===================== */
const CATEGORIES = [
  {id:'books', label:'الكتب والكراسات', color:'#25436B'},
  {id:'tools', label:'أدوات الكتابة', color:'#3E7D57'},
  {id:'other', label:'أغراض أخرى', color:'#D9A441'},
];

const ITEMS = [
  {id:'book', name:'الكتاب المدرسي', cat:'books', icon:'icon-book',
    use:'يحتوي على الدروس التي يعتمد عليها التلميذ للتعلّم في كل مادة دراسية.',
    tip:'تُغلَّف الكتب بغلاف واقٍ للحفاظ عليها نظيفة طوال السنة الدراسية.'},
  {id:'notebook', name:'الكراسة', cat:'books', icon:'icon-notebook',
    use:'يُدوِّن فيها التلميذ الدروس والتمارين والملاحظات أثناء الحصة.',
    tip:'يُفضَّل تخصيص كراسة لكل مادة لتسهيل المراجعة لاحقًا.'},
  {id:'diary', name:'المفكرة', cat:'books', icon:'icon-diary',
    use:'يُسجَّل فيها الجدول الزمني للحصص، والواجبات المنزلية، والإعلانات المهمة.',
    tip:'تفقّد المفكرة يوميًا قبل مغادرة المدرسة حتى لا تفوتك واجباتك.'},
  {id:'pencil', name:'قلم الرصاص', cat:'tools', icon:'icon-pencil',
    use:'يُستعمل للكتابة والرسم الأولي، ويمكن مسح ما يُكتَب به بسهولة.',
    tip:'احرص دائمًا على وجود قلم رصاص مبريّ جاهز في المحفظة.'},
  {id:'pen', name:'قلم الحبر', cat:'tools', icon:'icon-pen',
    use:'يُستعمل للكتابة النهائية في الكراسات بخط ثابت لا يُمحى.',
    tip:'من المفيد حمل قلم احتياطي تجنّبًا لنفاد الحبر أثناء الحصة.'},
  {id:'eraser', name:'الممحاة', cat:'tools', icon:'icon-eraser',
    use:'تُستعمل لمحو الكتابة أو الرسم المُنجَز بقلم الرصاص عند الخطأ.',
    tip:'اختر ممحاة طرية لا تُتلِف الورقة أو تترك آثارًا عليها.'},
  {id:'sharpener', name:'المبراة', cat:'tools', icon:'icon-sharpener',
    use:'تُستعمل لبري قلم الرصاص وتحديد رأسه ليصبح صالحًا للكتابة.',
    tip:'اختر مبراة ذات علبة صغيرة لجمع النشارة وعدم تلويث المحفظة.'},
  {id:'ruler', name:'المسطرة', cat:'tools', icon:'icon-ruler',
    use:'تُستعمل لرسم الخطوط المستقيمة وقياس الأطوال بدقة.',
    tip:'استعمل المسطرة أيضًا لتسطير هامش صفحاتك بشكل منظّم.'},
  {id:'scissors', name:'المقص', cat:'tools', icon:'icon-scissors',
    use:'يُستعمل لقصّ الورق أو الصور في الأنشطة اليدوية والفنية.',
    tip:'استعمله دائمًا بحذر، ويُفضَّل اختيار مقص ذي رأس مستدير للأمان.'},
  {id:'glue', name:'اللاصق', cat:'tools', icon:'icon-glue',
    use:'يُستعمل للصق الصور أو الأوراق المقصوصة داخل الكراسة.',
    tip:'أغلق غطاء اللاصق جيدًا بعد كل استعمال حتى لا يجفّ.'},
  {id:'colors', name:'الأقلام الملوّنة', cat:'tools', icon:'icon-colors',
    use:'تُستعمل لتلوين الرسومات وتمييز عناصر مهمة في الدرس.',
    tip:'رتّب الألوان في علبتها حسب تدرّج الألوان لتسهيل إيجادها.'},
  {id:'bottle', name:'قارورة الماء', cat:'other', icon:'icon-bottle',
    use:'يشرب منها التلميذ الماء خلال اليوم الدراسي للحفاظ على نشاطه.',
    tip:'اغسل القارورة يوميًا واملأها بماء نظيف كل صباح.'},
  {id:'sandwich', name:'الوجبة الخفيفة', cat:'other', icon:'icon-sandwich',
    use:'وجبة صغيرة تُؤكَل خلال الاستراحة لتزويد الجسم بالطاقة.',
    tip:'يُفضَّل أن تكون الوجبة صحية كالفواكه بدل الحلويات الصناعية.'},
];

/* ===================== BUILD LEGEND ===================== */
const legendEl = document.getElementById('legend');
let activeFilter = 'all';
function renderLegend(){
  const all = [{id:'all', label:'الكل'}, ...CATEGORIES];
  legendEl.innerHTML = all.map(c =>
    `<button data-cat="${c.id}" class="${activeFilter===c.id?'active':''}">${c.label}</button>`
  ).join('');
  legendEl.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeFilter = btn.dataset.cat;
      renderLegend();
      renderItems();
    });
  });
}

/* ===================== BUILD SPILLED ITEMS ===================== */
const spillEl = document.getElementById('spill');
function renderItems(){
  const list = ITEMS.filter(it => activeFilter==='all' || it.cat===activeFilter);
  spillEl.innerHTML = list.map((it,i) =>
    `<div class="item" style="animation-delay:${i*0.05}s" data-id="${it.id}">
       <div class="icon ${it.icon}"></div>
       <span class="lbl">${it.name}</span>
     </div>`
  ).join('');
  spillEl.querySelectorAll('.item').forEach(el=>{
    el.addEventListener('click', ()=> openPanel(el.dataset.id));
  });
}

/* ===================== BAG OPEN / CLOSE ===================== */
const bagWrap = document.getElementById('bagWrap');
const openHint = document.getElementById('openHint');
const closeHint = document.getElementById('closeHint');

bagWrap.addEventListener('click', (e)=>{
  // إذا كان النقر على زر الإغلاق فلا نُعيد الفتح
  if(e.target === closeHint) return;
  if(bagWrap.classList.contains('opened')) return;
  bagWrap.classList.add('opened');
});

closeHint.addEventListener('click', (e)=>{
  e.stopPropagation();
  bagWrap.classList.remove('opened');
});

/* ===================== ITEM DETAIL PANEL ===================== */
const overlay = document.getElementById('overlay');
function openPanel(id){
  const it = ITEMS.find(x=>x.id===id);
  const cat = CATEGORIES.find(c=>c.id===it.cat);
  document.getElementById('panelIcon').className = 'icon '+it.icon;
  document.getElementById('panelName').textContent = it.name;
  document.getElementById('panelCat').textContent = cat.label;
  document.getElementById('panelUse').textContent = it.use;
  document.getElementById('panelTip').textContent = it.tip;
  overlay.classList.add('show');
}
document.getElementById('closeBtn').addEventListener('click', ()=> overlay.classList.remove('show'));
overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.classList.remove('show'); });

/* ===================== QUIZ ===================== */
const QUESTIONS = [
  {q:'انكسر رأس قلم الرصاص أثناء الحصة، فماذا تستعمل؟', opts:['المبراة','الممحاة','المقص'], correct:0,
   exp:'المبراة هي الأداة المخصّصة لبري قلم الرصاص وتحديد رأسه من جديد.'},
  {q:'أخطأتَ في كتابة كلمة بقلم الرصاص، فبماذا تصحّح ذلك؟', opts:['بقلم الحبر','بالممحاة','بالمسطرة'], correct:1,
   exp:'الممحاة تُستعمل لمحو ما كُتب بقلم الرصاص دون إتلاف الورقة.'},
  {q:'تريد رسم خط مستقيم ودقيق في كراستك، فماذا تستعمل؟', opts:['المقص','اللاصق','المسطرة'], correct:2,
   exp:'المسطرة هي الأداة المناسبة لرسم الخطوط المستقيمة وقياس الأطوال.'},
  {q:'أين يُدوِّن التلميذ الواجبات المنزلية التي يُمليها عليه الأستاذ؟', opts:['في المفكرة','في الكتاب المدرسي','في علبة الألوان'], correct:0,
   exp:'المفكرة مخصّصة لتدوين الجدول الزمني والواجبات والإعلانات المهمة.'},
  {q:'ما الأداة التي تُستعمل للصق صورة مقصوصة داخل الكراسة؟', opts:['قلم الحبر','اللاصق','المسطرة'], correct:1,
   exp:'اللاصق يُستعمل لتثبيت الأوراق أو الصور المقصوصة داخل الكراسة.'},
  {q:'ما الغرض غير المدرسي الذي يجب ألا يغيب عن المحفظة للحفاظ على نشاط التلميذ؟', opts:['المقص','قارورة الماء','قلم الرصاص'], correct:1,
   exp:'شرب الماء خلال اليوم الدراسي ضروري لبقاء التلميذ نشيطًا ومركّزًا.'},
];

let qIndex = 0, qScore = 0;
const qProgress = document.getElementById('qProgress');
const qFill = document.getElementById('qFill');
const qText = document.getElementById('qText');
const qOptions = document.getElementById('qOptions');
const qExplain = document.getElementById('qExplain');
const qNext = document.getElementById('qNext');
const quizBody = document.getElementById('quizBody');
const quizResult = document.getElementById('quizResult');

function renderQuestion(){
  const item = QUESTIONS[qIndex];
  qProgress.textContent = `السؤال ${qIndex+1} من ${QUESTIONS.length}`;
  qFill.style.width = `${(qIndex/QUESTIONS.length)*100}%`;
  qText.textContent = item.q;
  qExplain.classList.remove('show');
  qExplain.textContent = '';
  qNext.classList.remove('show');
  qOptions.innerHTML = item.opts.map((o,i)=>
    `<div class="q-opt" data-i="${i}">${o}</div>`
  ).join('');
  qOptions.querySelectorAll('.q-opt').forEach(el=>{
    el.addEventListener('click', ()=> answerQuestion(parseInt(el.dataset.i)));
  });
}

function answerQuestion(choice){
  const item = QUESTIONS[qIndex];
  const opts = qOptions.querySelectorAll('.q-opt');
  opts.forEach(o=>o.classList.add('disabled'));
  opts[item.correct].classList.add('correct');
  if(choice !== item.correct){
    opts[choice].classList.add('wrong');
  } else {
    qScore++;
  }
  qExplain.textContent = item.exp;
  qExplain.classList.add('show');
  qNext.classList.add('show');
}

qNext.addEventListener('click', ()=>{
  qIndex++;
  if(qIndex < QUESTIONS.length){
    renderQuestion();
  } else {
    finishQuiz();
  }
});

function finishQuiz(){
  quizBody.style.display='none';
  quizResult.classList.add('show');
  document.getElementById('qScore').textContent = `${qScore} / ${QUESTIONS.length}`;
  let msg;
  if(qScore === QUESTIONS.length) msg = 'ممتاز! أنت تعرف محتويات محفظتك جيدًا واستعمال كل أداة.';
  else if(qScore >= QUESTIONS.length/2) msg = 'نتيجة جيدة! راجع الأدوات التي أخطأت فيها لتُتقنها أكثر.';
  else msg = 'حاول مجددًا بعد استكشاف بطاقات الأدوات في المحفظة أعلاه.';
  document.getElementById('qFeedback').textContent = msg;
}

document.getElementById('qRestart').addEventListener('click', ()=>{
  qIndex = 0; qScore = 0;
  quizResult.classList.remove('show');
  quizBody.style.display='block';
  renderQuestion();
});

/* ===================== INIT ===================== */
renderLegend();
renderItems();
renderQuestion();
</script>
</body>
</html>
