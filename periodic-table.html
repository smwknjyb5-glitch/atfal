<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الجدول الدوري للعناصر</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Tahoma','Segoe UI',sans-serif; }
  body {
    background: radial-gradient(circle at 20% 0%, #1b2a3a, #0a131d 70%);
    color:#fff; min-height:100vh; padding:16px; display:flex; flex-direction:column; align-items:center;
  }
  h1 { font-size:1.5em; color:#ffd166; text-shadow:0 0 10px rgba(255,209,102,.5); margin-bottom:4px; text-align:center;}
  .sub { color:#9fb3c8; font-size:.85em; margin-bottom:14px; text-align:center; }

  .toolbar {
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:14px; width:100%; max-width:1100px;
  }
  input#search {
    flex:1; min-width:180px; padding:9px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.08); color:#fff; font-size:.9em;
  }
  input#search::placeholder{ color:#9fb3c8; }
  select#categoryFilter {
    padding:9px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.2);
    background:rgba(20,30,45,.9); color:#fff; font-size:.85em;
  }

  .legend {
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:14px; max-width:1100px;
  }
  .legend-item { display:flex; align-items:center; gap:5px; font-size:.72em; color:#cfe0f3; }
  .legend-swatch { width:13px; height:13px; border-radius:4px; }

  #tableWrap { width:100%; max-width:1100px; overflow-x:auto; padding-bottom:10px; }
  #grid {
    display:grid;
    grid-template-columns: repeat(18, minmax(46px, 1fr));
    grid-auto-rows: minmax(46px, auto);
    gap:3px;
    min-width:880px;
  }
  .cell {
    border-radius:6px; padding:3px 2px; cursor:pointer; position:relative;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    font-size:.62em; transition:.15s; border:1px solid rgba(255,255,255,0.15);
    color:#0a131d;
  }
  .cell:hover { transform:scale(1.12); z-index:5; box-shadow:0 0 10px rgba(255,255,255,0.4); }
  .cell.dim { opacity:0.18; }
  .cell .num { position:absolute; top:2px; right:3px; font-size:.85em; opacity:.75;}
  .cell .sym { font-size:1.25em; font-weight:bold; line-height:1; }
  .cell .name { font-size:.78em; line-height:1.1; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .cell.placeholder { visibility:hidden; }
  .cell.lan-act-label {
    background:transparent; border:none; color:#9fb3c8; cursor:default; font-size:.7em; align-items:flex-start; justify-content:center;
  }
  .cell.lan-act-label:hover { transform:none; box-shadow:none; }

  /* فئات الألوان */
  .alkali { background:#ff6b6b; }
  .alkaline { background:#ffa45c; }
  .lanthanide { background:#ffd166; }
  .actinide { background:#f4978e; }
  .transition { background:#6fb3ff; }
  .post-transition { background:#83d6c5; }
  .metalloid { background:#9bdb8a; }
  .nonmetal { background:#caf0a4; }
  .halogen { background:#9af0d4; }
  .noble { background:#c8b6ff; }
  .unknown { background:#cfd8e3; }

  #detail {
    margin-top:16px; width:100%; max-width:700px;
    background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.15);
    border-radius:16px; padding:18px; backdrop-filter:blur(6px); min-height:90px;
  }
  #detail .placeholder-text { color:#7e93ab; text-align:center; font-size:.9em; }
  .detail-head { display:flex; align-items:center; gap:14px; margin-bottom:10px; }
  .detail-sym {
    font-size:2.4em; font-weight:bold; width:70px; height:70px; border-radius:14px;
    display:flex; align-items:center; justify-content:center; color:#0a131d;
  }
  .detail-titles .ar { font-size:1.3em; color:#ffd166; font-weight:bold; }
  .detail-titles .en { font-size:.9em; color:#9fb3c8; }
  .detail-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;
  }
  .dstat { background:rgba(0,0,0,0.25); border-radius:10px; padding:8px 10px; font-size:.82em; }
  .dstat .l { color:#9fb3c8; font-size:.78em; }
  .dstat .v { color:#fff; font-weight:bold; margin-top:2px; }
  footer { margin-top:18px; color:#7e93ab; font-size:.72em; text-align:center; }
</style>
</head>
<body>

<h1>🧪 الجدول الدوري للعناصر</h1>
<div class="sub">اضغط على أي عنصر لعرض تفاصيله — أو ابحث / صنّف حسب الفئة</div>

<div class="toolbar">
  <input type="text" id="search" placeholder="🔍 ابحث بالاسم العربي، الإنجليزي، الرمز، أو العدد الذري...">
  <select id="categoryFilter">
    <option value="">كل الفئات</option>
    <option value="alkali">فلزات قلوية</option>
    <option value="alkaline">فلزات قلوية ترابية</option>
    <option value="transition">فلزات انتقالية</option>
    <option value="post-transition">فلزات بعد انتقالية</option>
    <option value="metalloid">أشباه فلزات</option>
    <option value="nonmetal">لافلزات</option>
    <option value="halogen">هالوجينات</option>
    <option value="noble">غازات نبيلة</option>
    <option value="lanthanide">لانثانيدات</option>
    <option value="actinide">أكتينيدات</option>
  </select>
</div>

<div class="legend" id="legend"></div>

<div id="tableWrap">
  <div id="grid"></div>
</div>

<div id="detail"><div class="placeholder-text">اضغط على عنصر من الجدول لعرض معلوماته الكاملة هنا</div></div>

<footer>محاكاة تعليمية للجدول الدوري — البيانات تقريبية لأغراض تعليمية</footer>

const categoryNames = {
  alkali:"فلزات قلوية", alkaline:"فلزات قلوية ترابية", transition:"فلزات انتقالية",
  "post-transition":"فلزات بعد انتقالية", metalloid:"أشباه فلزات", nonmetal:"لافلزات",
  halogen:"هالوجينات", noble:"غازات نبيلة", lanthanide:"لانثانيدات", actinide:"أكتينيدات", unknown:"غير معروف"
};

const grid = document.getElementById('grid');
const detail = document.getElementById('detail');
const legend = document.getElementById('legend');
const search = document.getElementById('search');
const categoryFilter = document.getElementById('categoryFilter');

// بناء الخريطة (صف، عمود) -> عنصر
const map = {};
elements.forEach(e => map[e[6]+'-'+e[7]] = e);

// إضافة فاصل بصري للانثانيدات/أكتينيدات (صف 6 وصف 7 يحتاجان فجوة في العمود 3)

function buildGrid() {
  grid.innerHTML = '';
  for (let row=1; row<=9; row++){
    for (let col=1; col<=18; col++){
      if (row===6 && col===3) { addLabelCell('57–71', row, col); continue; }
      if (row===7 && col===3) { addLabelCell('89–103', row, col); continue; }
      if (row===8 && col===1) { /* skip leading cols for lanthanide row spacer */ }
      const key = row+'-'+col;
      if (map[key]) {
        addElementCell(map[key], row, col);
      } else if (row<=7) {
        addPlaceholder(row,col);
      } else if (row===8 || row===9) {
        if (col<4) addPlaceholder(row,col);
      }
    }
  }
}

function addPlaceholder(row,col){
  const div = document.createElement('div');
  div.className = 'cell placeholder';
  div.style.gridRow = row; div.style.gridColumn = col;
  grid.appendChild(div);
}

function addLabelCell(text,row,col){
  const div = document.createElement('div');
  div.className = 'cell lan-act-label';
  div.style.gridRow = row; div.style.gridColumn = col;
  div.textContent = text;
  grid.appendChild(div);
}

function addElementCell(e, row, col){
  const [num,sym,arName,enName,mass,cat] = e;
  const div = document.createElement('div');
  div.className = 'cell ' + cat;
  div.style.gridRow = row; div.style.gridColumn = col;
  div.dataset.num = num;
  div.innerHTML = `<span class="num">${num}</span><span class="sym">${sym}</span><span class="name">${arName}</span>`;
  div.addEventListener('click', () => showDetail(e));
  grid.appendChild(div);
}

function showDetail(e){
  const [num,sym,arName,enName,mass,cat,row,col,phaseState] = e;
  detail.innerHTML = `
    <div class="detail-head">
      <div class="detail-sym ${cat}">${sym}</div>
      <div class="detail-titles">
        <div class="ar">${arName}</div>
        <div class="en">${enName}</div>
      </div>
    </div>
    <div class="detail-grid">
      <div class="dstat"><div class="l">العدد الذري</div><div class="v">${num}</div></div>
      <div class="dstat"><div class="l">الكتلة الذرية</div><div class="v">${mass}</div></div>
      <div class="dstat"><div class="l">الفئة</div><div class="v">${categoryNames[cat]}</div></div>
      <div class="dstat"><div class="l">الحالة القياسية</div><div class="v">${phaseState}</div></div>
      <div class="dstat"><div class="l">الدورة</div><div class="v">${row<=7?row:(row===8?6:7)}</div></div>
      <div class="dstat"><div class="l">المجموعة</div><div class="v">${(row===8||row===9)?'—':col}</div></div>
    </div>
  `;
}

function buildLegend(){
  legend.innerHTML = '';
  Object.entries(categoryNames).forEach(([key,name])=>{
    if (key==='unknown') return;
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-swatch ${key}"></span>${name}`;
    legend.appendChild(item);
  });
}

function applyFilters(){
  const term = search.value.trim().toLowerCase();
  const cat = categoryFilter.value;
  document.querySelectorAll('.cell:not(.placeholder):not(.lan-act-label)').forEach(cell=>{
    const num = cell.dataset.num;
    const e = elements.find(x=>x[0]==num);
    let visible = true;
    if (cat && e[5] !== cat) visible = false;
    if (term) {
      const hay = (e[1]+' '+e[2]+' '+e[3]+' '+e[0]).toLowerCase();
      if (!hay.includes(term)) visible = false;
    }
    cell.classList.toggle('dim', !visible);
  });
}

search.addEventListener('input', applyFilters);
categoryFilter.addEventListener('change', applyFilters);

buildGrid();
buildLegend();
</script>

</body>
</html>
