 <!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>جمع وطرح الأزمنة</title>
<style>
body{
    font-family:Arial;
    direction:rtl;
    text-align:center;
}
input{
    width:70px;
    padding:5px;
    margin:5px;
}
button{
    padding:8px 15px;
    margin:5px;
}
#result{
    margin-top:15px;
    font-size:20px;
    font-weight:bold;
}
</style>
</head>
<body>

<h2>جمع وطرح الأزمنة</h2>

<h3>الزمن الأول</h3>
<input type="number" id="h1" min="0" placeholder="ساعة">
<input type="number" id="m1" min="0" placeholder="دقيقة">

<h3>الزمن الثاني</h3>
<input type="number" id="h2" min="0" placeholder="ساعة">
<input type="number" id="m2" min="0" placeholder="دقيقة">

<br><br>

<button onclick="addition()">جمع</button>
<button onclick="soustraction()">طرح</button>

 <div id="result" style="direction:ltr;"></div>

<script>
function addition(){

    let h1 = Number(document.getElementById("h1").value);
    let m1 = Number(document.getElementById("m1").value);

    let h2 = Number(document.getElementById("h2").value);
    let m2 = Number(document.getElementById("m2").value);

    let totalMin = h1*60 + m1 + h2*60 + m2;

    let h = Math.floor(totalMin/60);
    let m = totalMin%60;

    document.getElementById("result").innerHTML =
    h + " h " + m + " min";
}

function soustraction(){

    let h1 = Number(document.getElementById("h1").value);
    let m1 = Number(document.getElementById("m1").value);

    let h2 = Number(document.getElementById("h2").value);
    let m2 = Number(document.getElementById("m2").value);

    let total1 = h1*60 + m1;
    let total2 = h2*60 + m2;

    let diff = total1 - total2;

    let signe = "";
    if(diff < 0){
        signe = "-";
        diff = Math.abs(diff);
    }

    let h = Math.floor(diff/60);
    let m = diff%60;

    document.getElementById("result").innerHTML =
    signe + h + " h " + m + " min";
}
</script>

</body>
</html>
