 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تعليم العد</title>

<style>
body{
    font-family:Tahoma;
    background:#eef8ff;
    text-align:center;
    padding:20px;
}

h1{
    color:#0066cc;
}

button{
    width:70px;
    height:70px;
    font-size:28px;
    margin:8px;
    border:none;
    border-radius:15px;
    background:#4CAF50;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#2E8B57;
}

#images{
    margin-top:30px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;
}

#images img{
    width:90px;
    height:90px;
}
</style>
</head>

<body>

<h1>اضغط على الرقم</h1>

<div id="buttons"></div>

<div id="images"></div>

<script>

const buttons=document.getElementById("buttons");
const images=document.getElementById("images");

// إنشاء الأزرار من 1 إلى 10
for(let i=1;i<=10;i++){

    let btn=document.createElement("button");
    btn.innerHTML=i;

    btn.onclick=function(){

        images.innerHTML="";

        for(let j=0;j<i;j++){

            let img=document.createElement("img");

            img.src="orange.png"; // اسم الصورة

            images.appendChild(img);

        }

    }

    buttons.appendChild(btn);

}

</script>

</body>
</html>
