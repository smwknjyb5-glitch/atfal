 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكاة حل التمارين - الرياضيات والفيزياء</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 30px;
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            color: #00d4ff;
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 5px;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }

        .subtitle {
            color: #a0a0a0;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .mode-btn {
            padding: 12px 30px;
            border: 2px solid #00d4ff;
            background: transparent;
            color: #00d4ff;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1em;
            transition: all 0.3s;
            font-weight: bold;
        }

        .mode-btn.active {
            background: linear-gradient(45deg, #00d4ff, #0066ff);
            color: white;
            border-color: transparent;
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.4);
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .exercise-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .panel h3 {
            color: #00d4ff;
            margin-bottom: 20px;
            font-size: 1.3em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .exercise-list {
            max-height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .exercise-item {
            background: rgba(255, 255, 255, 0.08);
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .exercise-item:hover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            transform: translateX(-5px);
        }

        .exercise-item.selected {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
        }

        .exercise-title {
            color: white;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .exercise-desc {
            color: #a0a0a0;
            font-size: 0.9em;
        }

        .solution-area {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 25px;
            margin-top: 20px;
            min-height: 300px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .solution-header {
            color: #00ff88;
            font-size: 1.3em;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .step {
            background: rgba(255, 255, 255, 0.05);
            border-right: 3px solid #00d4ff;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            animation: slideIn 0.5s ease-out;
            opacity: 0;
            animation-fill-mode: forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .step-number {
            color: #00d4ff;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .step-content {
            color: #e0e0e0;
            line-height: 1.6;
        }

        .step-formula {
            background: rgba(0, 212, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
            color: #00d4ff;
            font-family: 'Courier New', monospace;
            font-size: 1.1em;
        }

        .result-box {
            background: linear-gradient(45deg, rgba(0, 212, 255, 0.2), rgba(0, 255, 136, 0.2));
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-top: 20px;
            border: 2px solid #00ff88;
        }

        .result-label {
            color: #a0a0a0;
            font-size: 0.9em;
        }

        .result-value {
            color: #00ff88;
            font-size: 2em;
            font-weight: bold;
            margin: 10px 0;
        }

        .custom-input {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        input, select {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            font-size: 1em;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .solve-btn {
            padding: 12px 25px;
            background: linear-gradient(45deg, #00d4ff, #0066ff);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .solve-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.5);
        }

        .graph-area {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        canvas {
            max-width: 100%;
            border-radius: 10px;
        }

        .physics-units {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .unit-item {
            background: rgba(0, 212, 255, 0.1);
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            color: #00d4ff;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .exercise-panel {
                grid-template-columns: 1fr;
            }
            .physics-units {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧮 محاكاة حل التمارين</h1>
        <p class="subtitle">الرياضيات والفيزياء - حلول تفاعلية خطوة بخطوة</p>

        <div class="mode-selector">
            <button class="mode-btn active" onclick="switchMode('math')">📐 رياضيات</button>
            <button class="mode-btn" onclick="switchMode('physics')">⚡ فيزياء</button>
            <button class="mode-btn" onclick="switchMode('custom')">✏️ معادلة مخصصة</button>
        </div>

        <div class="exercise-panel" id="mathPanel">
            <div class="panel">
                <h3>📚 تمارين الرياضيات</h3>
                <div class="exercise-list" id="mathExercises"></div>
            </div>
            <div class="panel">
                <h3>🔍 معاينة التمرين</h3>
                <div id="exercisePreview"></div>
            </div>
        </div>

        <div class="exercise-panel" id="physicsPanel" style="display: none;">
            <div class="panel">
                <h3>🔬 تمارين الفيزياء</h3>
                <div class="exercise-list" id="physicsExercises"></div>
            </div>
            <div class="panel">
                <h3>📊 المعطيات</h3>
                <div id="physicsData"></div>
                <div class="physics-units" id="physicsUnits"></div>
            </div>
        </div>

        <div id="customPanel" style="display: none;">
            <div class="panel" style="width: 100%;">
                <h3>✏️ أدخل معادلتك</h3>
                <div class="custom-input">
                    <input type="text" id="customEquation" placeholder="مثال: 2x^2 + 4x - 6 = 0 أو v = u + at">
                    <button class="solve-btn" onclick="solveCustom()">حل ✨</button>
                </div>
            </div>
        </div>

        <div class="solution-area" id="solutionArea">
            <div class="solution-header">💡 الحل التفصيلي</div>
            <div id="stepsContainer">
                <p style="color: #888;">اختر تمريناً أو أدخل معادلة للبدء في الحل...</p>
            </div>
        </div>

        <div class="graph-area" id="graphArea" style="display: none;">
            <h4 style="color: #00d4ff; margin-bottom: 15px;">📈 الرسم البياني</h4>
            <canvas id="graphCanvas" width="600" height="300"></canvas>
        </div>
    </div>

    <script>
        let currentMode = 'math';
        let selectedExercise = null;

        // تمارين الرياضيات
        const mathExercises = [
            {
                title: "معادلة تربيعية",
                desc: "حل المعادلة: 2x² + 4x - 6 = 0",
                steps: [
                    "تحديد المعاملات: a = 2, b = 4, c = -6",
                    "حساب المميز: Δ = b² - 4ac",
                    "Δ = 16 - 4(2)(-6) = 16 + 48 = 64",
                    "المميز موجب، إذن يوجد حلان حقيقيان",
                    "x = (-b ± √Δ) / (2a)",
                    "x₁ = (-4 + 8) / 4 = 1",
                    "x₂ = (-4 - 8) / 4 = -3",
                    "التحقق: 2(1)² + 4(1) - 6 = 0 ✓"
                ],
                result: "x = 1 أو x = -3",
                graph: true
            },
            {
                title: "تكامل محدد",
                desc: "أحسب: ∫₀² (x² + 2x) dx",
                steps: [
                    "التكامل غير المحدد: ∫(x² + 2x)dx",
                    "= (x³/3) + x² + C",
                    "تطبيق حدود التكامل من 0 إلى 2",
                    "= [(8/3) + 4] - [0 + 0]",
                    "= 8/3 + 4 = 20/3",
                    "النتيجة النهائية = 6.67 تقريباً"
                ],
                result: "20/3 ≈ 6.67",
                graph: true
            },
            {
                title: "مشتقة دالة",
                desc: "أوجد مشتقة: f(x) = 3x³ - 2x² + 5x - 7",
                steps: [
                    "تطبيق قواعد الاشتقاق",
                    "مشتقة 3x³ = 9x²",
                    "مشتقة -2x² = -4x",
                    "مشتقة 5x = 5",
                    "مشتقة -7 = 0",
                    "f'(x) = 9x² - 4x + 5"
                ],
                result: "f'(x) = 9x² - 4x + 5",
                graph: true
            },
            {
                title: "نظام معادلات",
                desc: "حل النظام: 2x + y = 7, x - y = 2",
                steps: [
                    "من المعادلة الثانية: x = y + 2",
                    "بالتعويض في الأولى: 2(y+2) + y = 7",
                    "2y + 4 + y = 7",
                    "3y = 3",
                    "y = 1",
                    "x = 1 + 2 = 3",
                    "التحقق: 2(3) + 1 = 7 ✓"
                ],
                result: "x = 3, y = 1",
                graph: true
            }
        ];

        // تمارين الفيزياء
        const physicsExercises = [
            {
                title: "السرعة والتسارع",
                desc: "سيارة تبدأ من السكون وتتسارع بانتظام 2 م/ث² لمدة 5 ثوان",
                given: {
                    "السرعة الابتدائية (u)": "0 م/ث",
                    "التسارع (a)": "2 م/ث²",
                    "الزمن (t)": "5 ث"
                },
                steps: [
                    "نستخدم معادلة الحركة: v = u + at",
                    "v = 0 + (2)(5)",
                    "v = 10 م/ث",
                    "لحساب المسافة: s = ut + ½at²",
                    "s = 0 + ½(2)(25)",
                    "s = 25 متر"
                ],
                result: "السرعة النهائية = 10 م/ث, المسافة = 25 م",
                units: ["م/ث", "م/ث²", "ث", "م"]
            },
            {
                title: "قانون نيوتن الثاني",
                desc: "جسم كتلته 5 كجم تؤثر عليه قوة 20 نيوتن",
                given: {
                    "الكتلة (m)": "5 كجم",
                    "القوة (F)": "20 نيوتن"
                },
                steps: [
                    "قانون نيوتن الثاني: F = ma",
                    "20 = 5a",
                    "a = 20/5",
                    "a = 4 م/ث²",
                    "التسارع = 4 متر لكل ثانية مربعة"
                ],
                result: "التسارع = 4 م/ث²",
                units: ["كجم", "نيوتن", "م/ث²"]
            },
            {
                title: "الطاقة الحركية",
                desc: "كرة كتلتها 0.5 كجم تتحرك بسرعة 10 م/ث",
                given: {
                    "الكتلة (m)": "0.5 كجم",
                    "السرعة (v)": "10 م/ث"
                },
                steps: [
                    "الطاقة الحركية: KE = ½mv²",
                    "KE = ½(0.5)(100)",
                    "KE = 0.25 × 100",
                    "KE = 25 جول"
                ],
                result: "الطاقة الحركية = 25 جول",
                units: ["كجم", "م/ث", "جول"]
            }
        ];

        // عرض التمارين
        function displayExercises() {
            const mathContainer = document.getElementById('mathExercises');
            const physicsContainer = document.getElementById('physicsExercises');

            mathExercises.forEach((exercise, index) => {
                const div = createExerciseElement(exercise, 'math', index);
                mathContainer.appendChild(div);
            });

            physicsExercises.forEach((exercise, index) => {
                const div = createExerciseElement(exercise, 'physics', index);
                physicsContainer.appendChild(div);
            });
        }

        function createExerciseElement(exercise, type, index) {
            const div = document.createElement('div');
            div.className = 'exercise-item';
            div.innerHTML = `
                <div class="exercise-title">${exercise.title}</div>
                <div class="exercise-desc">${exercise.desc}</div>
            `;
            div.onclick = () => selectExercise(exercise, type, index);
            return div;
        }

        function selectExercise(exercise, type, index) {
            // إزالة التحديد السابق
            document.querySelectorAll('.exercise-item').forEach(item => {
                item.classList.remove('selected');
            });

            // تحديد التمرين الحالي
            const containers = document.querySelectorAll('.exercise-list');
            const container = type === 'math' ? containers[0] : containers[1];
            container.children[index].classList.add('selected');

            selectedExercise = { ...exercise, type };

            // عرض المعاينة
            if (type === 'math') {
                document.getElementById('exercisePreview').innerHTML = `
                    <h4 style="color: #00ff88;">${exercise.title}</h4>
                    <p style="color: #e0e0e0; margin: 15px 0;">${exercise.desc}</p>
                    <button class="solve-btn" onclick="solveExercise()">ابدأ الحل 🔬</button>
                `;
            } else {
                document.getElementById('physicsData').innerHTML = `
                    <h4 style="color: #00ff88; margin-bottom: 15px;">${exercise.title}</h4>
                    ${Object.entries(exercise.given).map(([key, value]) =>
                        `<p style="color: #e0e0e0; margin: 8px 0;">${key}: <span style="color: #00d4ff;">${value}</span></p>`
                    ).join('')}
                    <button class="solve-btn" onclick="solveExercise()" style="margin-top: 15px;">ابدأ الحل 🔬</button>
                `;
                document.getElementById('physicsUnits').innerHTML = exercise.units.map(unit =>
                    `<div class="unit-item">${unit}</div>`
                ).join('');
            }
        }

        function solveExercise() {
            if (!selectedExercise) return;

            const stepsContainer = document.getElementById('stepsContainer');
            stepsContainer.innerHTML = '';

            // عرض الخطوات بتأثير متحرك
            selectedExercise.steps.forEach((step, index) => {
                setTimeout(() => {
                    const stepDiv = document.createElement('div');
                    stepDiv.className = 'step';
                    stepDiv.innerHTML = `
                        <div class="step-number">الخطوة ${index + 1}:</div>
                        <div class="step-content">${step}</div>
                    `;
                    stepsContainer.appendChild(stepDiv);

                    // تمرير تلقائي
                    stepsContainer.scrollIntoView({ behavior: 'smooth', block: 'end' });

                    // عرض النتيجة في الخطوة الأخيرة
                    if (index === selectedExercise.steps.length - 1) {
                        setTimeout(() => {
                            const resultDiv = document.createElement('div');
                            resultDiv.className = 'result-box';
                            resultDiv.innerHTML = `
                                <div class="result-label">النتيجة النهائية</div>
                                <div class="result-value">${selectedExercise.result}</div>
                            `;
                            stepsContainer.appendChild(resultDiv);
                        }, 500);
                    }
                }, index * 800);
            });

            // رسم بياني إذا كان مطلوباً
            if (selectedExercise.graph) {
                document.getElementById('graphArea').style.display = 'block';
                setTimeout(() => drawGraph(), selectedExercise.steps.length * 800 + 500);
            } else {
                document.getElementById('graphArea').style.display = 'none';
            }
        }

        function drawGraph() {
            const canvas = document.getElementById('graphCanvas');
            const ctx = canvas.getContext('2d');

            // مسح الرسم السابق
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم المحاور
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 1;

            // محور x
            ctx.beginPath();
            ctx.moveTo(50, 150);
            ctx.lineTo(550, 150);
            ctx.stroke();

            // محور y
            ctx.beginPath();
            ctx.moveTo(300, 50);
            ctx.lineTo(300, 250);
            ctx.stroke();

            // رسم دالة تربيعية كمثال
            ctx.strokeStyle = '#00d4ff';
            ctx.lineWidth = 2;
            ctx.beginPath();

            for (let x = -250; x <= 250; x += 1) {
                const realX = x / 50;
                const y = -(2 * realX * realX + 4 * realX - 6) * 20;
                const canvasX = x + 300;
                const canvasY = y + 150;

                if (x === -250) {
                    ctx.moveTo(canvasX, canvasY);
                } else {
                    ctx.lineTo(canvasX, canvasY);
                }
            }
            ctx.stroke();

            // رسم نقاط التقاطع
            ctx.fillStyle = '#00ff88';
            [-3, 1].forEach(root => {
                ctx.beginPath();
                ctx.arc(root * 50 + 300, 150, 5, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function solveCustom() {
            const equation = document.getElementById('customEquation').value.trim();
            if (!equation) return;

            const stepsContainer = document.getElementById('stepsContainer');
            stepsContainer.innerHTML = '';

            // محاكاة حل معادلة مخصصة
            const steps = [
                "تحليل المعادلة المدخلة: " + equation,
                "تحديد نوع المعادلة...",
                "تطبيق الخوارزمية المناسبة...",
                "تبسيط الحدود...",
                "حساب النتيجة..."
            ];

            steps.forEach((step, index) => {
                setTimeout(() => {
                    const stepDiv = document.createElement('div');
                    stepDiv.className = 'step';
                    stepDiv.innerHTML = `
                        <div class="step-number">الخطوة ${index + 1}:</div>
                        <div class="step-content">${step}</div>
                    `;
                    stepsContainer.appendChild(stepDiv);
                }, index * 600);
            });

            document.getElementById('graphArea').style.display = 'none';
        }

        function switchMode(mode) {
            currentMode = mode;

            // تحديث الأزرار
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // إظهار/إخفاء اللوحات
            document.getElementById('mathPanel').style.display = mode === 'math' ? 'grid' : 'none';
            document.getElementById('physicsPanel').style.display = mode === 'physics' ? 'grid' : 'none';
            document.getElementById('customPanel').style.display = mode === 'custom' ? 'block' : 'none';

            // مسح الحل السابق
            document.getElementById('stepsContainer').innerHTML = '<p style="color: #888;">اختر تمريناً أو أدخل معادلة للبدء في الحل...</p>';
            document.getElementById('graphArea').style.display = 'none';
        }

        // التهيئة
        displayExercises();
    </script>
</body>
</html>
