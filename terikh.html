 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>اليوم والتاريخ</title>

<style>
body{
    font-family:Arial;
    background:#eef5ff;
    text-align:center;
    margin-top:60px;
}

button{
    padding:10px 20px;
    font-size:20px;
    margin:5px;
    cursor:pointer;
}

#box{
    width:320px;
    margin:20px auto;
    padding:20px;
    border:2px solid #0077cc;
    border-radius:10px;
    background:white;
    display:none;
    font-size:22px;
    line-height:2;
}
</style>
</head>

<body>

<h2>📅 معلومات اليوم</h2>

<button onclick="showInfo()">إظهار المعلومات</button>

<div id="box">
<div id="info"></div>
<br>
<button onclick="hideInfo()">❌ إغلاق</button>
</div>

<script>

function showInfo(){

const now=new Date();

const days=[
"الأحد","الاثنين","الثلاثاء",
"الأربعاء","الخميس","الجمعة","السبت"
];

const dayName=days[now.getDay()];

const date=now.toLocaleDateString("ar-DZ");

const time=now.toLocaleTimeString("ar-DZ");

const hijri=new Intl.DateTimeFormat("ar-TN-u-ca-islamic",{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}).format(now);

document.getElementById("info").innerHTML=
"📅 اليوم: "+dayName+
"<br>📆 التاريخ الميلادي: "+date+
"<br>🌙 التاريخ الهجري: "+hijri+
"<br>🕒 الوقت: "+time;

document.getElementById("box").style.display="block";

}

function hideInfo(){

document.getElementById("box").style.display="none";

}

</script>

</body>
</html>
