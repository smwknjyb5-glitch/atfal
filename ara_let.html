<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعليم الحروف العربية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0a0e27;
    --bg-panel:#111633;
    --gold:#d4af37;
    --gold-soft:#f0d585;
    --text-main:#eef0fa;
    --text-dim:#9aa3c7;
    --green-ok:#3ecf8e;
    --red-no:#e35c5c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg-deep);
    color:var(--text-main);
    font-family:'Cairo', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  canvas#stars{
    position:fixed; inset:0; width:100%; height:100%; z-index:0;
  }
  .wrap{
    position:relative; z-index:1;
    max-width:980px;
    margin:0 auto;
    padding:32px 20px 80px;
  }
  header{
    text-align:center;
    margin-bottom:28px;
  }
  header h1{
    font-family:'Amiri', serif;
    font-size:clamp(2rem, 5vw, 3.2rem);
    color:var(--gold-soft);
    text-shadow:0 0 24px rgba(212,175,55,0.35);
    letter-spacing:1px;
  }
  header p{
    color:var(--text-dim);
    margin-top:8px;
    font-size:1rem;
  }
  .modes{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:28px;
  }
  .mode-btn{
    background:transparent;
    border:1px solid rgba(212,175,55,0.35);
    color:var(--text-dim);
    padding:10px 22px;
    border-radius:30px;
    font-family:'Cairo', sans-serif;
    font-weight:600;
    font-size:0.95rem;
    cursor:pointer;
    transition:all .25s ease;
  }
  .mode-btn.active{
    background:linear-gradient(135deg, var(--gold), #b8892e);
    color:#1a1408;
    border-color:transparent;
    box-shadow:0 0 20px rgba(212,175,55,0.4);
  }
  .mode-btn:hover{border-color:var(--gold);}

  /* ---- LEARN MODE ---- */
  #learnView{}
  .letters-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(70px,1fr));
    gap:10px;
    margin-bottom:26px;
  }
  .letter-tile{
    aspect-ratio:1/1;
    background:var(--bg-panel);
    border:1px solid rgba(212,175,55,0.15);
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Amiri', serif;
    font-size:1.9rem;
    cursor:pointer;
    transition:transform .2s ease, border-color .2s ease, background .2s ease;
    color:var(--text-main);
  }
  .letter-tile:hover{
    transform:translateY(-4px);
    border-color:var(--gold);
  }
  .letter-tile.selected{
    background:linear-gradient(160deg, rgba(212,175,55,0.25), rgba(212,175,55,0.05));
    border-color:var(--gold);
    color:var(--gold-soft);
  }

  .detail-panel{
    background:var(--bg-panel);
    border:1px solid rgba(212,175,55,0.25);
    border-radius:20px;
    padding:28px;
    display:grid;
    grid-template-columns:1fr;
    gap:22px;
    animation:fadeIn .35s ease;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .detail-top{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    flex-wrap:wrap;
  }
  .big-letter{
    font-family:'Amiri', serif;
    font-size:6.5rem;
    color:var(--gold-soft);
    text-shadow:0 0 30px rgba(212,175,55,0.4);
    line-height:1;
  }
  .detail-info{
    display:flex;
    flex-direction:column;
    gap:6px;
    align-items:flex-start;
  }
  .detail-name{
    font-size:1.6rem;
    font-weight:700;
  }
  .say-btn{
    background:rgba(212,175,55,0.12);
    border:1px solid var(--gold);
    color:var(--gold-soft);
    padding:8px 18px;
    border-radius:24px;
    font-family:'Cairo', sans-serif;
    cursor:pointer;
    font-size:0.9rem;
    display:flex;
    align-items:center;
    gap:8px;
    transition:background .2s ease;
  }
  .say-btn:hover{ background:rgba(212,175,55,0.25); }

  .forms-row{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
    text-align:center;
  }
  .form-box{
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:12px;
    padding:14px 6px;
  }
  .form-box .glyph{
    font-family:'Amiri', serif;
    font-size:2rem;
    color:var(--text-main);
    min-height:2.4rem;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .form-box .label{
    font-size:0.75rem;
    color:var(--text-dim);
    margin-top:6px;
  }

  .example-box{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    background:rgba(255,255,255,0.03);
    border-radius:14px;
    padding:16px;
  }
  .example-emoji{ font-size:2.4rem; }
  .example-word{ font-family:'Amiri', serif; font-size:1.6rem; color:var(--gold-soft); }

  .placeholder{
    text-align:center;
    color:var(--text-dim);
    padding:40px 10px;
    font-size:1rem;
  }

  /* ---- QUIZ MODE ---- */
  #quizView{ display:none; }
  .quiz-panel{
    background:var(--bg-panel);
    border:1px solid rgba(212,175,55,0.25);
    border-radius:20px;
    padding:32px;
    text-align:center;
  }
  .quiz-score{
    color:var(--text-dim);
    margin-bottom:18px;
    font-size:0.95rem;
  }
  .quiz-score span{ color:var(--gold-soft); font-weight:700; }
  .quiz-letter{
    font-family:'Amiri', serif;
    font-size:7rem;
    color:var(--gold-soft);
    text-shadow:0 0 30px rgba(212,175,55,0.4);
    margin-bottom:6px;
  }
  .quiz-question{ color:var(--text-dim); margin-bottom:22px; }
  .quiz-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    max-width:420px;
    margin:0 auto;
  }
  .quiz-opt{
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.12);
    color:var(--text-main);
    padding:14px;
    border-radius:12px;
    font-family:'Cairo', sans-serif;
    font-size:1.05rem;
    cursor:pointer;
    transition:all .2s ease;
  }
  .quiz-opt:hover{ border-color:var(--gold); }
  .quiz-opt.correct{ background:rgba(62,207,142,0.18); border-color:var(--green-ok); color:var(--green-ok); }
  .quiz-opt.wrong{ background:rgba(227,92,92,0.18); border-color:var(--red-no); color:var(--red-no); }
  .quiz-opt[disabled]{ cursor:default; }

  .next-btn{
    margin-top:22px;
    background:linear-gradient(135deg, var(--gold), #b8892e);
    color:#1a1408;
    border:none;
    padding:10px 26px;
    border-radius:26px;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    cursor:pointer;
    display:none;
  }

  footer{
    text-align:center;
    color:var(--text-dim);
    font-size:0.8rem;
    margin-top:40px;
    opacity:0.7;
  }

  @media (max-width:520px){
    .big-letter{ font-size:5rem; }
    .quiz-letter{ font-size:5.5rem; }
    .forms-row{ grid-template-columns:repeat(2,1fr); }
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="wrap">
  <header>
    <h1>تعليم الحروف العربية</h1>
    <p>تعرّف على الحروف، أشكالها، ونطقها بطريقة تفاعلية</p>
  </header>

  <div class="modes">
    <button class="mode-btn active" id="btnLearn">وضع التعلّم</button>
    <button class="mode-btn" id="btnQuiz">وضع الاختبار</button>
  </div>

  <!-- LEARN MODE -->
  <div id="learnView">
    <div class="letters-grid" id="lettersGrid"></div>
    <div class="detail-panel" id="detailPanel">
      <div class="placeholder">اختر حرفًا من الأعلى لعرض تفاصيله</div>
    </div>
  </div>

  <!-- QUIZ MODE -->
  <div id="quizView">
    <div class="quiz-panel">
      <div class="quiz-score">النتيجة: <span id="scoreVal">0</span> / <span id="totalVal">0</span></div>
      <div class="quiz-letter" id="quizLetter">ب</div>
      <div class="quiz-question">ما اسم هذا الحرف؟</div>
      <div class="quiz-options" id="quizOptions"></div>
      <button class="next-btn" id="nextBtn">السؤال التالي ←</button>
    </div>
  </div>

  <footer>تصميم تعليمي تفاعلي للحروف العربية الثمانية والعشرين</footer>
</div>

<script>
/* ---------------- بيانات الحروف ---------------- */
const letters = [
  {ch:'ا', name:'ألف', word:'أَسَد', emoji:'🦁'},
  {ch:'ب', name:'باء', word:'بَطَّة', emoji:'🦆'},
  {ch:'ت', name:'تاء', word:'تُفَّاحَة', emoji:'🍎'},
  {ch:'ث', name:'ثاء', word:'ثَعْلَب', emoji:'🦊'},
  {ch:'ج', name:'جيم', word:'جَمَل', emoji:'🐫'},
  {ch:'ح', name:'حاء', word:'حِصَان', emoji:'🐴'},
  {ch:'خ', name:'خاء', word:'خَرُوف', emoji:'🐑'},
  {ch:'د', name:'دال', word:'دَجَاجَة', emoji:'🐔'},
  {ch:'ذ', name:'ذال', word:'ذِئْب', emoji:'🐺'},
  {ch:'ر', name:'راء', word:'رُمَّان', emoji:'🍎'},
  {ch:'ز', name:'زاي', word:'زَرَافَة', emoji:'🦒'},
  {ch:'س', name:'سين', word:'سَمَكَة', emoji:'🐟'},
  {ch:'ش', name:'شين', word:'شَمْس', emoji:'☀️'},
  {ch:'ص', name:'صاد', word:'صَقْر', emoji:'🦅'},
  {ch:'ض', name:'ضاد', word:'ضِفْدَع', emoji:'🐸'},
  {ch:'ط', name:'طاء', word:'طَائِرَة', emoji:'✈️'},
  {ch:'ظ', name:'ظاء', word:'ظَبْي', emoji:'🦌'},
  {ch:'ع', name:'عين', word:'عِنَب', emoji:'🍇'},
  {ch:'غ', name:'غين', word:'غُرَاب', emoji:'🐦‍⬛'},
  {ch:'ف', name:'فاء', word:'فِيل', emoji:'🐘'},
  {ch:'ق', name:'قاف', word:'قَمَر', emoji:'🌙'},
  {ch:'ك', name:'كاف', word:'كِتَاب', emoji:'📚'},
  {ch:'ل', name:'لام', word:'لَيْمُون', emoji:'🍋'},
  {ch:'م', name:'ميم', word:'مَوْز', emoji:'🍌'},
  {ch:'ن', name:'نون', word:'نَجْمَة', emoji:'⭐'},
  {ch:'ه', name:'هاء', word:'هُدْهُد', emoji:'🐦'},
  {ch:'و', name:'واو', word:'وَرْدَة', emoji:'🌹'},
  {ch:'ي', name:'ياء', word:'يَد', emoji:'✋'},
];

function letterForms(ch){
  return {
    isolated: ch,
    initial: ch + 'ـ',
    medial: 'ـ' + ch + 'ـ',
    final: 'ـ' + ch
  };
}

/* ---------------- خلفية النجوم ---------------- */
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let stars = [];
function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  stars = Array.from({length: Math.floor((canvas.width*canvas.height)/9000)}, () => ({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height,
    r: Math.random()*1.3 + 0.3,
    a: Math.random(),
    speed: Math.random()*0.015 + 0.003
  }));
}
function drawStars(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const s of stars){
    s.a += s.speed;
    const alpha = (Math.sin(s.a)+1)/2 * 0.8 + 0.1;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(240,213,133,${alpha})`;
    ctx.fill();
  }
  requestAnimationFrame(drawStars);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
drawStars();

/* ---------------- وضع التعلّم ---------------- */
const lettersGrid = document.getElementById('lettersGrid');
const detailPanel = document.getElementById('detailPanel');

letters.forEach((l, idx) => {
  const tile = document.createElement('div');
  tile.className = 'letter-tile';
  tile.textContent = l.ch;
  tile.dataset.idx = idx;
  tile.addEventListener('click', () => selectLetter(idx));
  lettersGrid.appendChild(tile);
});

function speak(text){
  if(!('speechSynthesis' in window)) return;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ar-SA';
  utter.rate = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
}

function selectLetter(idx){
  document.querySelectorAll('.letter-tile').forEach(t => t.classList.remove('selected'));
  document.querySelector(`.letter-tile[data-idx="${idx}"]`).classList.add('selected');

  const l = letters[idx];
  const f = letterForms(l.ch);

  detailPanel.innerHTML = `
    <div class="detail-top">
      <div class="big-letter">${l.ch}</div>
      <div class="detail-info">
        <div class="detail-name">حرف ${l.name}</div>
        <button class="say-btn" id="sayBtn">🔊 استمع للنطق</button>
      </div>
    </div>
    <div class="forms-row">
      <div class="form-box"><div class="glyph">${f.isolated}</div><div class="label">منفصل</div></div>
      <div class="form-box"><div class="glyph">${f.initial}</div><div class="label">أول الكلمة</div></div>
      <div class="form-box"><div class="glyph">${f.medial}</div><div class="label">وسط الكلمة</div></div>
      <div class="form-box"><div class="glyph">${f.final}</div><div class="label">آخر الكلمة</div></div>
    </div>
    <div class="example-box">
      <div class="example-emoji">${l.emoji}</div>
      <div class="example-word">${l.word}</div>
    </div>
  `;

  document.getElementById('sayBtn').addEventListener('click', () => speak(l.name + '. ' + l.word));
  speak(l.name);
}

/* ---------------- تبديل الأوضاع ---------------- */
const btnLearn = document.getElementById('btnLearn');
const btnQuiz = document.getElementById('btnQuiz');
const learnView = document.getElementById('learnView');
const quizView = document.getElementById('quizView');

btnLearn.addEventListener('click', () => {
  btnLearn.classList.add('active');
  btnQuiz.classList.remove('active');
  learnView.style.display = 'block';
  quizView.style.display = 'none';
});
btnQuiz.addEventListener('click', () => {
  btnQuiz.classList.add('active');
  btnLearn.classList.remove('active');
  quizView.style.display = 'block';
  learnView.style.display = 'none';
  if(totalCount === 0) nextQuestion();
});

/* ---------------- وضع الاختبار ---------------- */
let scoreCount = 0;
let totalCount = 0;
let currentAnswer = null;

const quizLetterEl = document.getElementById('quizLetter');
const quizOptionsEl = document.getElementById('quizOptions');
const scoreValEl = document.getElementById('scoreVal');
const totalValEl = document.getElementById('totalVal');
const nextBtn = document.getElementById('nextBtn');

function shuffle(arr){
  return arr.map(v => [Math.random(), v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);
}

function nextQuestion(){
  nextBtn.style.display = 'none';
  const correctIdx = Math.floor(Math.random()*letters.length);
  const correct = letters[correctIdx];
  currentAnswer = correct.name;
  quizLetterEl.textContent = correct.ch;

  let pool = letters.filter((_, i) => i !== correctIdx);
  pool = shuffle(pool).slice(0,3);
  let options = shuffle([correct, ...pool]);

  quizOptionsEl.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quiz-opt';
    btn.textContent = opt.name;
    btn.addEventListener('click', () => checkAnswer(btn, opt.name, correct.name));
    quizOptionsEl.appendChild(btn);
  });
}

function checkAnswer(btn, chosen, correct){
  document.querySelectorAll('.quiz-opt').forEach(b => b.disabled = true);
  totalCount++;
  if(chosen === correct){
    scoreCount++;
    btn.classList.add('correct');
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.quiz-opt').forEach(b => {
      if(b.textContent === correct) b.classList.add('correct');
    });
  }
  scoreValEl.textContent = scoreCount;
  totalValEl.textContent = totalCount;
  nextBtn.style.display = 'inline-block';
}

nextBtn.addEventListener('click', nextQuestion);
</script>
</body>
</html>
