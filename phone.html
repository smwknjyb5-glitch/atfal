  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محاكاة مكونات الهاتف النقال</title>
<style>
  :root{
    --navy-deep:#050b1f;
    --navy:#0a1636;
    --navy-light:#132048;
    --gold:#f2c14e;
    --gold-soft:#f7dc8a;
    --text:#e8ecf7;
    --muted:#9aa6c7;
    --accent:#4ecfa0;
    --red:#e8615a;
    --blue:#5a9bd6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:radial-gradient(ellipse at top, var(--navy-light), var(--navy-deep) 70%);
    color:var(--text); font-family:'Tahoma','Segoe UI',sans-serif;
    overflow-x:hidden; position:relative;
  }
  #stars{position:fixed; inset:0; z-index:0; pointer-events:none;}
  .wrap{position:relative; z-index:1; max-width:1150px; margin:0 auto; padding:22px 16px 60px;}
  header{text-align:center; margin-bottom:22px;}
  header h1{color:var(--gold); font-size:1.9rem; margin:0 0 6px; text-shadow:0 0 18px rgba(242,193,78,.35);}
  header p{color:var(--muted); margin:0; font-size:.95rem;}

  .toolbar{
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:16px;
  }
  .btn{
    background:var(--navy-light); border:1px solid rgba(242,193,78,.35);
    color:var(--gold-soft); padding:9px 20px; border-radius:24px;
    cursor:pointer; font-size:.9rem; transition:.2s;
  }
  .btn:hover{background:rgba(242,193,78,.12);}
  .btn.on{
    background:var(--gold); color:var(--navy-deep); font-weight:bold;
    box-shadow:0 0 18px rgba(242,193,78,.4);
  }

  .layout{
    display:grid; grid-template-columns:1fr; gap:20px;
  }
  @media(min-width:900px){ .layout{grid-template-columns:380px 1fr;} }

  .stage{
    background:linear-gradient(160deg, rgba(19,32,72,.85), rgba(10,22,54,.9));
    border:1px solid rgba(242,193,78,.2); border-radius:18px; padding:20px;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
    display:flex; flex-direction:column; align-items:center;
  }

  #phone-svg{ width:100%; max-width:340px; height:auto; display:block; }
  .part{ cursor:pointer; transition:filter .2s, transform .5s ease, opacity .5s ease; }
  .part:hover{ filter:brightness(1.3); }
  .part.selected{ filter:brightness(1.5) drop-shadow(0 0 8px var(--gold)); }

  #screen-glow{ opacity:0; transition:opacity .4s; }

  .info-col{
    background:linear-gradient(160deg, rgba(19,32,72,.85), rgba(10,22,54,.9));
    border:1px solid rgba(242,193,78,.2); border-radius:18px; padding:20px;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
  }
  .info-panel{
    background:var(--navy); border:1px solid rgba(242,193,78,.3); border-radius:14px;
    padding:18px 20px; min-height:110px; margin-bottom:16px;
  }
  .info-panel h3{ color:var(--gold); margin:0 0 8px; font-size:1.15rem; }
  .info-panel p{ margin:0; color:var(--text); line-height:1.8; font-size:.92rem; }
  .info-panel .placeholder{ color:var(--muted); }

  .parts-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:10px;
  }
  .part-chip{
    background:var(--navy); border:1px solid rgba(255,255,255,.12); border-radius:10px;
    padding:10px 12px; font-size:.82rem; color:var(--muted); cursor:pointer;
    text-align:center; transition:.2s;
  }
  .part-chip.active{ border-color:var(--gold); color:var(--gold); background:rgba(242,193,78,.08); }

  .battery-section{
    background:linear-gradient(160deg, rgba(19,32,72,.85), rgba(10,22,54,.9));
    border:1px solid rgba(242,193,78,.2); border-radius:18px; padding:20px;
    box-shadow:0 8px 30px rgba(0,0,0,.35); margin-top:20px;
  }
  .battery-section h2{ color:var(--gold); margin-top:0; text-align:center; font-size:1.3rem; }
  .battery-visual{
    display:flex; align-items:center; justify-content:center; gap:24px; flex-wrap:wrap;
    margin-top:14px;
  }
  .battery-shell{
    width:220px; height:90px; border:4px solid var(--muted); border-radius:10px;
    position:relative; overflow:hidden;
  }
  .battery-tip{
    position:absolute; right:-14px; top:30px; width:12px; height:30px;
    background:var(--muted); border-radius:0 4px 4px 0;
  }
  .battery-fill{
    position:absolute; inset:4px; right:4px; left:auto;
    background:linear-gradient(90deg, var(--accent), #7be0b8);
    border-radius:6px; transition:width 1.2s linear;
  }
  .battery-pct{
    font-size:1.3rem; color:var(--gold); font-weight:bold; min-width:60px; text-align:center;
  }
  .battery-status{ color:var(--muted); font-size:.85rem; text-align:center; margin-top:10px; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="wrap">
  <header>
    <h1>📱 محاكاة مكونات الهاتف النقال</h1>
    <p>انقر على أي جزء لمعرفة وظيفته، أو شغّل الهاتف وراقب استهلاك البطارية</p>
  </header>

  <div class="toolbar">
    <button class="btn" id="power-toggle">⏻ تشغيل الهاتف</button>
    <button class="btn" id="explode-toggle">🔍 عرض تفكيك الأجزاء</button>
    <button class="btn" id="reset-btn">إعادة تعيين</button>
  </div>

  <div class="layout">
    <div class="stage">
      <svg id="phone-svg" viewBox="0 0 300 560" xmlns="http://www.w3.org/2000/svg">
        <!-- body -->
        <rect class="part" data-part="body" x="20" y="20" width="260" height="520" rx="38"
              fill="#141d3d" stroke="#3a4d8a" stroke-width="4"/>

        <!-- screen -->
        <rect class="part" data-part="screen" x="34" y="55" width="232" height="450" rx="18"
              fill="#0a1024" stroke="#2a3a6a" stroke-width="2"/>
        <rect id="screen-glow" x="34" y="55" width="232" height="450" rx="18" fill="#5ac8ff" opacity="0"/>

        <!-- camera / notch (front) -->
        <circle class="part" data-part="camera_front" cx="150" cy="40" r="6" fill="#111" stroke="#4ecfa0" stroke-width="1.5"/>

        <!-- speaker earpiece -->
        <rect class="part" data-part="speaker" x="120" y="38" width="40" height="5" rx="2.5" fill="#333"/>

        <!-- side buttons -->
        <rect class="part" data-part="buttons" x="14" y="150" width="6" height="40" rx="3" fill="#3a4d8a"/>
        <rect class="part" data-part="buttons" x="280" y="130" width="6" height="60" rx="3" fill="#3a4d8a"/>

        <!-- rear camera module (shown as icon on screen corner for simplicity) -->
        <g class="part" data-part="camera_rear">
          <rect x="44" y="65" width="60" height="60" rx="14" fill="#1f2a4f" stroke="#4ecfa0" stroke-width="2"/>
          <circle cx="62" cy="83" r="10" fill="#0a1024" stroke="#4ecfa0" stroke-width="2"/>
          <circle cx="88" cy="83" r="10" fill="#0a1024" stroke="#4ecfa0" stroke-width="2"/>
          <circle cx="62" cy="107" r="10" fill="#0a1024" stroke="#4ecfa0" stroke-width="2"/>
        </g>

        <!-- charging port -->
        <rect class="part" data-part="charging" x="130" y="530" width="40" height="8" rx="4" fill="#f2c14e"/>

        <!-- SIM/antenna lines -->
        <line class="part" data-part="antenna" x1="20" y1="90" x2="20" y2="110" stroke="var(--blue)" stroke-width="4"/>
        <line class="part" data-part="antenna" x1="280" y1="440" x2="280" y2="460" stroke="var(--blue)" stroke-width="4"/>

        <!-- internal exploded parts (hidden until explode mode) -->
        <g id="internal-group" opacity="0">
          <rect class="part exploded" data-part="battery" x="70" y="150" width="160" height="220" rx="10"
                fill="#2f5d3a" stroke="var(--accent)" stroke-width="2"/>
          <text x="150" y="265" text-anchor="middle" font-size="13" fill="#c9f2d9" font-family="Tahoma">البطارية</text>

          <rect class="exploded part" data-part="motherboard" x="90" y="150" width="120" height="60" rx="6"
                fill="#2a2a4a" stroke="var(--gold)" stroke-width="2"/>
          <text x="150" y="184" text-anchor="middle" font-size="11" fill="var(--gold-soft)" font-family="Tahoma">اللوحة الأم</text>

          <circle class="exploded part" data-part="processor" cx="115" cy="180" r="14" fill="#3a1f4a" stroke="#c98fe0" stroke-width="2"/>
          <circle class="exploded part" data-part="ram" cx="185" cy="180" r="12" fill="#1f3a4a" stroke="var(--blue)" stroke-width="2"/>
        </g>
      </svg>
    </div>

    <div class="info-col">
      <div class="info-panel" id="info-panel">
        <h3 id="info-title">اختر جزءًا من الهاتف</h3>
        <p class="placeholder" id="info-text">انقر على أي عنصر في الرسم، أو فعّل "عرض تفكيك الأجزاء" لرؤية المكونات الداخلية.</p>
      </div>
      <div class="parts-grid" id="parts-grid"></div>
    </div>
  </div>

  <div class="battery-section">
    <h2>🔋 استهلاك البطارية أثناء التشغيل</h2>
    <div class="battery-visual">
      <div class="battery-shell">
        <div class="battery-fill" id="battery-fill" style="width:100%"></div>
        <div class="battery-tip"></div>
      </div>
      <div class="battery-pct" id="battery-pct">100%</div>
    </div>
    <div class="battery-status" id="battery-status">الهاتف مطفأ — لا يوجد استهلاك للطاقة</div>
  </div>
</div>

<script>
// ---------- Starfield ----------
const starsCanvas = document.getElementById('stars');
const sctx = starsCanvas.getContext('2d');
function resizeStars(){ starsCanvas.width = window.innerWidth; starsCanvas.height = document.body.scrollHeight; }
let starList = [];
function initStars(){
  resizeStars(); starList = [];
  const count = Math.floor((starsCanvas.width*starsCanvas.height)/9000);
  for(let i=0;i<count;i++){
    starList.push({x:Math.random()*starsCanvas.width,y:Math.random()*starsCanvas.height,r:Math.random()*1.4+0.3,a:Math.random(),speed:Math.random()*0.015});
  }
}
function drawStars(){
  sctx.clearRect(0,0,starsCanvas.width,starsCanvas.height);
  for(const s of starList){
    s.a += s.speed;
    const alpha = Math.abs(Math.sin(s.a));
    sctx.beginPath(); sctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    sctx.fillStyle = `rgba(242,193,78,${alpha*0.8})`; sctx.fill();
  }
  requestAnimationFrame(drawStars);
}
window.addEventListener('resize', initStars);
initStars(); drawStars();

// ---------- Parts info ----------
const partsInfo = {
  body:{name:'هيكل الهاتف', text:'الإطار الخارجي الذي يحمي جميع المكونات الداخلية، ويُصنع عادة من الألمنيوم أو الزجاج أو البلاستيك المقوّى.'},
  screen:{name:'الشاشة', text:'تعرض الصور والواجهات، وتحتوي غالبًا على طبقة لمس حساسة (تاتش) تكتشف لمسات الأصابع لتحويلها إلى أوامر.'},
  camera_front:{name:'الكاميرا الأمامية', text:'تُستخدم لالتقاط الصور الذاتية (سيلفي) ومكالمات الفيديو، وأحيانًا للتعرف على الوجه لفتح القفل.'},
  camera_rear:{name:'الكاميرا الخلفية', text:'تلتقط الصور والفيديوهات بجودة أعلى، وقد تتكون من عدة عدسات (عريضة، تقريب، عمق) لتحسين جودة التصوير.'},
  speaker:{name:'السماعة (مكبر الصوت)', text:'تُصدر الصوت أثناء المكالمات أو تشغيل الوسائط، وتوجد سماعة علوية للمكالمات وأخرى سفلية لمكبر الصوت الخارجي.'},
  buttons:{name:'الأزرار الجانبية', text:'تشمل زر التشغيل/الإيقاف وأزرار التحكم بمستوى الصوت، وتتيح تفاعلًا سريعًا دون لمس الشاشة.'},
  charging:{name:'منفذ الشحن', text:'يُستخدم لشحن البطارية ونقل البيانات بين الهاتف والأجهزة الأخرى عبر كابل USB أو منفذ خاص.'},
  antenna:{name:'الهوائي', text:'يستقبل ويُرسل الإشارات اللاسلكية (شبكة الجوال، Wi-Fi، بلوتوث، GPS) للتواصل مع الشبكات المحيطة.'},
  battery:{name:'البطارية', text:'تخزّن الطاقة الكهربائية اللازمة لتشغيل جميع مكونات الهاتف، وتُعد من نوع ليثيوم-أيون في معظم الهواتف الحديثة.'},
  motherboard:{name:'اللوحة الأم', text:'اللوحة التي تربط جميع المكونات الإلكترونية ببعضها (المعالج، الذاكرة، أجهزة الاستشعار) عبر دوائر كهربائية دقيقة.'},
  processor:{name:'المعالج (Chipset/SoC)', text:'"عقل" الهاتف الذي ينفّذ جميع العمليات الحسابية والمنطقية، ويحدد سرعة أداء التطبيقات والألعاب.'},
  ram:{name:'الذاكرة العشوائية (RAM)', text:'تخزّن البيانات المؤقتة للتطبيقات قيد التشغيل، فكلما زادت سعتها، أمكن تشغيل تطبيقات أكثر في آن واحد بسلاسة.'}
};

const infoTitle = document.getElementById('info-title');
const infoText = document.getElementById('info-text');
const partsGrid = document.getElementById('parts-grid');

function selectPart(key){
  document.querySelectorAll('.part').forEach(p=>p.classList.remove('selected'));
  document.querySelectorAll(`.part[data-part="${key}"]`).forEach(p=>p.classList.add('selected'));
  document.querySelectorAll('.part-chip').forEach(c=>c.classList.toggle('active', c.dataset.part===key));
  const info = partsInfo[key];
  infoTitle.textContent = info.name;
  infoText.textContent = info.text;
  infoText.classList.remove('placeholder');
}

document.querySelectorAll('.part').forEach(el=>{
  el.addEventListener('click', (e)=>{ e.stopPropagation(); selectPart(el.dataset.part); });
});

Object.keys(partsInfo).forEach(key=>{
  const chip = document.createElement('div');
  chip.className='part-chip';
  chip.dataset.part = key;
  chip.textContent = partsInfo[key].name;
  chip.addEventListener('click', ()=> selectPart(key));
  partsGrid.appendChild(chip);
});

// ---------- Explode view toggle ----------
const explodeBtn = document.getElementById('explode-toggle');
const internalGroup = document.getElementById('internal-group');
const screenEl = document.querySelector('rect[data-part="screen"]');
const cameraRearEl = document.querySelector('g[data-part="camera_rear"]');
let exploded = false;

explodeBtn.addEventListener('click', ()=>{
  exploded = !exploded;
  explodeBtn.classList.toggle('on', exploded);
  if(exploded){
    internalGroup.style.transition='opacity .5s';
    internalGroup.setAttribute('opacity','1');
    screenEl.style.opacity='0.15';
    cameraRearEl.style.opacity='0.15';
    explodeBtn.textContent='🔍 إخفاء التفكيك';
  } else {
    internalGroup.setAttribute('opacity','0');
    screenEl.style.opacity='1';
    cameraRearEl.style.opacity='1';
    explodeBtn.textContent='🔍 عرض تفكيك الأجزاء';
  }
});

// ---------- Power on / battery drain ----------
const powerBtn = document.getElementById('power-toggle');
const resetBtn = document.getElementById('reset-btn');
const screenGlow = document.getElementById('screen-glow');
const batteryFill = document.getElementById('battery-fill');
const batteryPct = document.getElementById('battery-pct');
const batteryStatus = document.getElementById('battery-status');

let poweredOn = false;
let batteryLevel = 100;
let drainInterval = null;

function updateBatteryUI(){
  batteryFill.style.width = batteryLevel+'%';
  batteryPct.textContent = Math.round(batteryLevel)+'%';
  if(batteryLevel > 50){ batteryFill.style.background = 'linear-gradient(90deg, #4ecfa0, #7be0b8)'; }
  else if(batteryLevel > 20){ batteryFill.style.background = 'linear-gradient(90deg, #f2c14e, #f7dc8a)'; }
  else { batteryFill.style.background = 'linear-gradient(90deg, #e8615a, #ff9a90)'; }
}

powerBtn.addEventListener('click', ()=>{
  poweredOn = !poweredOn;
  if(poweredOn){
    if(batteryLevel<=0){ poweredOn=false; return; }
    powerBtn.textContent='⏻ إيقاف الهاتف';
    powerBtn.classList.add('on');
    screenGlow.style.opacity = '0.9';
    batteryStatus.textContent = 'الهاتف يعمل — يتم استهلاك الطاقة تدريجيًا';
    drainInterval = setInterval(()=>{
      batteryLevel = Math.max(0, batteryLevel - 1);
      updateBatteryUI();
      if(batteryLevel<=0){
        batteryStatus.textContent = 'نفدت البطارية — يجب الشحن';
        screenGlow.style.opacity='0';
        powerBtn.textContent='⏻ تشغيل الهاتف';
        powerBtn.classList.remove('on');
        poweredOn = false;
        clearInterval(drainInterval);
      }
    }, 400);
  } else {
    powerBtn.textContent='⏻ تشغيل الهاتف';
    powerBtn.classList.remove('on');
    screenGlow.style.opacity='0';
    batteryStatus.textContent = 'الهاتف مطفأ — لا يوجد استهلاك للطاقة';
    clearInterval(drainInterval);
  }
});

resetBtn.addEventListener('click', ()=>{
  poweredOn=false;
  clearInterval(drainInterval);
  batteryLevel = 100;
  updateBatteryUI();
  screenGlow.style.opacity='0';
  powerBtn.textContent='⏻ تشغيل الهاتف';
  powerBtn.classList.remove('on');
  batteryStatus.textContent = 'الهاتف مطفأ — لا يوجد استهلاك للطاقة';

  exploded=false;
  explodeBtn.classList.remove('on');
  explodeBtn.textContent='🔍 عرض تفكيك الأجزاء';
  internalGroup.setAttribute('opacity','0');
  screenEl.style.opacity='1';
  cameraRearEl.style.opacity='1';

  document.querySelectorAll('.part').forEach(p=>p.classList.remove('selected'));
  document.querySelectorAll('.part-chip').forEach(c=>c.classList.remove('active'));
  infoTitle.textContent='اختر جزءًا من الهاتف';
  infoText.textContent='انقر على أي عنصر في الرسم، أو فعّل "عرض تفكيك الأجزاء" لرؤية المكونات الداخلية.';
  infoText.classList.add('placeholder');
});

updateBatteryUI();
</script>
</body>
</html>
