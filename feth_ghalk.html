 <!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>جهة الفتح والغلق</title>
<style>
body{
    font-family: Arial;
    text-align: center;
    margin-top: 40px;
}

#container{
    width: 200px;
    height: 200px;
    margin: auto;
    position: relative;
    border: 2px solid #000;
    border-radius: 50%;
}

#bar{
    position: absolute;
    width: 120px;
    height: 8px;
    background: #333;
    top: 96px;
    left: 40px;
    transform-origin: center center;
    transition: transform 0.3s;
}

button{
    padding: 10px 20px;
    margin: 10px;
    font-size: 16px;
}

#info{
    font-size: 20px;
    margin-top: 15px;
}
</style>
</head>
<body>

<h2>محاكاة مقبض دوران</h2>

<div id="container">
    <div id="bar"></div>
</div>

<br>

<button onclick="openValve()">فتح ↺</button>
<button onclick="closeValve()">غلق ↻</button>

<div id="info">الوضع الحالي: مغلق</div>

<script>
let angle = 0;

function update(){
    document.getElementById("bar").style.transform =
        `rotate(${angle}deg)`;
}

function openValve(){
    angle -= 15;
    update();
    document.getElementById("info").innerHTML =
        "الوضع الحالي: فتح ↺";
}

function closeValve(){
    angle += 15;
    update();
    document.getElementById("info").innerHTML =
        "الوضع الحالي: غلق ↻";
}

update();
</script>

</body>
</html>
