  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ناطق الأرقام | عربي · Français · English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1a26;
    --panel:#122a3d;
    --panel-2:#0e2231;
    --gold:#f4c542;
    --gold-light:#ffe08a;
    --text:#eef3f6;
    --muted:#8fa8bd;
    --line: rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans Arabic','Tajawal',sans-serif;
    min-height:100vh;
    padding:24px 16px 60px;
    position:relative;
    overflow-x:hidden;
  }
  #stars{ position:fixed; inset:0; z-index:0; }
  .wrap{ max-width:720px; margin:0 auto; position:relative; z-index:1; }

  header{ text-align:center; margin-bottom:26px; }
  header .eyebrow{
    display:inline-block; font-family:'Tajawal',sans-serif; font-weight:700;
    letter-spacing:.5px; color:var(--gold-light); font-size:13px;
    border:1px solid var(--gold); border-radius:999px; padding:4px 16px;
    margin-bottom:14px; background:rgba(244,197,66,0.08);
  }
  h1{
    font-family:'Tajawal',sans-serif; font-weight:900; font-size:clamp(26px,5vw,40px);
    margin:0 0 8px;
    background:linear-gradient(90deg, var(--gold-light), var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header p{ color:var(--muted); margin:0; font-size:14.5px; }

  .card{
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--line); border-radius:16px; padding:22px;
    margin-bottom:18px;
  }

  .lang-tabs{ display:flex; gap:8px; margin-bottom:18px; }
  .lang-tab{
    flex:1; text-align:center; padding:10px 6px; border-radius:10px;
    border:1px solid var(--line); background:rgba(255,255,255,0.03);
    cursor:pointer; font-family:'Tajawal',sans-serif; font-weight:700; font-size:14px;
    color:var(--muted); transition:.15s;
  }
  .lang-tab.active{ background:var(--gold); color:#1a1305; border-color:var(--gold); }

  #numInput{
    width:100%; font-size:26px; font-family:'IBM Plex Mono', monospace;
    text-align:center; background:rgba(0,0,0,0.25); border:1px solid var(--line);
    border-radius:12px; color:var(--gold-light); padding:14px; outline:none;
    letter-spacing:2px;
  }
  #numInput:focus{ border-color:var(--gold); }

  .actions{ display:flex; gap:10px; margin-top:14px; }
  button{
    font-family:'Tajawal',sans-serif; font-weight:700; font-size:15px;
    border:1px solid var(--gold); background:rgba(244,197,66,0.12); color:var(--gold-light);
    padding:12px 20px; border-radius:10px; cursor:pointer; transition:.15s; flex:1;
  }
  button:hover{ background:rgba(244,197,66,0.25); }
  button:disabled{ opacity:0.4; cursor:not-allowed; }
  #speakBtn{ background:var(--gold); color:#1a1305; }
  #speakBtn:hover{ background:var(--gold-light); }

  .output-box{
    margin-top:18px; padding:16px 18px; border-radius:12px;
    background:rgba(0,0,0,0.22); border:1px dashed rgba(244,197,66,0.35);
    font-size:19px; line-height:1.9; min-height:30px; color:var(--text);
  }
  .output-box.rtl{ direction:rtl; text-align:right; font-family:'IBM Plex Sans Arabic',sans-serif; }
  .output-box.ltr{ direction:ltr; text-align:left; font-family:'IBM Plex Sans Arabic',sans-serif; }
  .output-box .placeholder{ color:var(--muted); font-size:15px; }

  .rate-row{ display:flex; align-items:center; gap:10px; margin-top:14px; }
  .rate-row label{ font-size:13px; color:var(--muted); white-space:nowrap; }
  input[type=range]{
    -webkit-appearance:none; flex:1; height:6px; border-radius:4px;
    background:linear-gradient(90deg, var(--gold), var(--gold-light)); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
    background:var(--text); border:3px solid var(--gold); cursor:pointer;
  }

  .status{ text-align:center; font-size:12.5px; color:var(--muted); margin-top:10px; min-height:16px; }
  footer{ text-align:center; color:var(--muted); font-size:12px; margin-top:24px; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="wrap">

  <header>
    <span class="eyebrow">تحويل الأرقام إلى كلام</span>
    <h1>ناطق الأرقام</h1>
    <p>اكتب أي رقم وسيُكتب بالحروف ثم يُنطق صوتيًا — بالعربية أو الفرنسية أو الإنجليزية.</p>
  </header>

  <div class="card">
    <div class="lang-tabs">
      <div class="lang-tab active" data-lang="ar">العربية</div>
      <div class="lang-tab" data-lang="fr">Français</div>
      <div class="lang-tab" data-lang="en">English</div>
    </div>

    <input id="numInput" type="text" inputmode="decimal" placeholder="اكتب رقماً... مثال: 1250.75" value="1250">

    <div class="actions">
      <button id="speakBtn">🔊 انطق الرقم</button>
      <button id="stopBtn">⏹ إيقاف</button>
    </div>

    <div class="rate-row">
      <label>سرعة النطق</label>
      <input type="range" id="rate" min="0.5" max="1.6" step="0.1" value="0.95">
    </div>

    <div id="output" class="output-box rtl"><span class="placeholder">سيظهر الرقم مكتوبًا بالحروف هنا...</span></div>
    <div class="status" id="status"></div>
  </div>

  <footer>يعتمد النطق على أصوات المتصفح المتوفرة على جهازك — قد تختلف الجودة حسب النظام.</footer>
</div>

<script>
(function(){
  // ---------- starfield background (matches portfolio identity) ----------
  const starsCanvas = document.getElementById('stars');
  const sctx = starsCanvas.getContext('2d');
  let stars = [];
  function initStars(){
    starsCanvas.width = innerWidth; starsCanvas.height = innerHeight;
    stars = Array.from({length: 90}, ()=>({
      x: Math.random()*starsCanvas.width,
      y: Math.random()*starsCanvas.height,
      r: Math.random()*1.3+0.2,
      a: Math.random()*0.6+0.2,
      d: Math.random()*0.015+0.003
    }));
  }
  function drawStars(){
    sctx.clearRect(0,0,starsCanvas.width, starsCanvas.height);
    stars.forEach(s=>{
      s.a += s.d;
      const op = 0.3 + Math.abs(Math.sin(s.a))*0.5;
      sctx.beginPath();
      sctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      sctx.fillStyle = `rgba(244,197,66,${op})`;
      sctx.fill();
    });
    requestAnimationFrame(drawStars);
  }
  initStars(); drawStars();
  window.addEventListener('resize', initStars);

  // ---------- number-to-words engines ----------

  function englishGroup(n){
    const ones=['','one','two','three','four','five','six','seven','eight','nine','ten',
      'eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
    const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
    let out=[];
    const h=Math.floor(n/100), r=n%100;
    if(h>0) out.push(ones[h]+' hundred');
    if(r>0){
      if(r<20) out.push(ones[r]);
      else{
        const t=Math.floor(r/10), o=r%10;
        out.push(tens[t] + (o? '-'+ones[o] : ''));
      }
    }
    return out.join(' ');
  }
  function numberToEnglishWords(intPart){
    if(intPart===0) return 'zero';
    const scales=['','thousand','million','billion','trillion'];
    let groups=[]; let n=intPart;
    while(n>0){ groups.push(n%1000); n=Math.floor(n/1000); }
    let parts=[];
    for(let i=groups.length-1;i>=0;i--){
      if(groups[i]===0) continue;
      const words=englishGroup(groups[i]);
      parts.push(words + (scales[i]? ' '+scales[i] : ''));
    }
    return parts.join(' ');
  }

  function frenchGroup(n, isLast){
    const ones=['','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix',
      'onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
    const tensBase=['','','vingt','trente','quarante','cinquante','soixante'];
    function twoDigits(r){
      if(r<20) return ones[r];
      if(r<70){
        const t=Math.floor(r/10), o=r%10;
        if(o===1 && t<8) return tensBase[t]+' et un';
        return tensBase[t] + (o? '-'+ones[o]:'');
      }
      if(r<80){ // 70-79 -> soixante + (10-19)
        const o=r-60;
        return 'soixante' + (o===11? ' et onze' : '-'+ones[o]);
      }
      // 80-99
      const o=r-80;
      if(r===80) return 'quatre-vingts';
      return 'quatre-vingt' + (o? '-'+ones[o] : '');
    }
    let out=[];
    const h=Math.floor(n/100), r=n%100;
    if(h>0){
      out.push((h>1? ones[h]+' cent' : 'cent') + (h>1 && r===0? 's' : ''));
    }
    if(r>0) out.push(twoDigits(r));
    return out.join(' ');
  }
  function numberToFrenchWords(intPart){
    if(intPart===0) return 'zéro';
    const scaleNames=['', 'mille', 'million', 'milliard', 'billion'];
    let groups=[]; let n=intPart;
    while(n>0){ groups.push(n%1000); n=Math.floor(n/1000); }
    let parts=[];
    for(let i=groups.length-1;i>=0;i--){
      const val=groups[i];
      if(val===0) continue;
      let words = frenchGroup(val, i===0);
      if(i===1){ // thousand
        parts.push(val===1 ? 'mille' : words+' mille');
      } else if(i>=2){
        const plural = val>1 ? scaleNames[i]+'s' : scaleNames[i];
        parts.push(words+' '+plural);
      } else {
        parts.push(words);
      }
    }
    return parts.join(' ');
  }

  function arabicGroup(n){
    const ones=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة',
      'أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
    const tens=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
    const hundreds=['','مائة','مئتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
    let parts=[];
    const h=Math.floor(n/100), r=n%100;
    if(h>0) parts.push(hundreds[h]);
    if(r>0){
      if(r<20) parts.push(ones[r]);
      else{
        const t=Math.floor(r/10), o=r%10;
        if(o>0) parts.push(ones[o] + ' و' + tens[t]);
        else parts.push(tens[t]);
      }
    }
    return parts.join(' و');
  }
  function numberToArabicWords(intPart){
    if(intPart===0) return 'صفر';
    // scale forms: [singular, dual, plural]
    const scales=[
      null,
      {s:'ألف', d:'ألفان', p:'آلاف'},
      {s:'مليون', d:'مليونان', p:'ملايين'},
      {s:'مليار', d:'ملياران', p:'مليارات'},
      {s:'تريليون', d:'تريليونان', p:'تريليونات'}
    ];
    let groups=[]; let n=intPart;
    while(n>0){ groups.push(n%1000); n=Math.floor(n/1000); }
    let parts=[];
    for(let i=groups.length-1;i>=0;i--){
      const val=groups[i];
      if(val===0) continue;
      if(i===0){
        parts.push(arabicGroup(val));
      } else {
        const sc=scales[i];
        if(val===1) parts.push(sc.s);
        else if(val===2) parts.push(sc.d);
        else if(val>=3 && val<=10) parts.push(arabicGroup(val)+' '+sc.p);
        else parts.push(arabicGroup(val)+' '+sc.s);
      }
    }
    return parts.join(' و');
  }

  // ---------- decimal + sign wrapper ----------
  const digitWords = {
    ar:['صفر','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة'],
    fr:['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf'],
    en:['zero','one','two','three','four','five','six','seven','eight','nine']
  };
  const decimalWord = {ar:'فاصلة', fr:'virgule', en:'point'};
  const negativeWord = {ar:'سالب', fr:'moins', en:'negative'};
  const converters = {ar: numberToArabicWords, fr: numberToFrenchWords, en: numberToEnglishWords};

  function numberStringToWords(str, lang){
    str = str.trim();
    if(str==='') return '';
    let negative = false;
    if(str.startsWith('-')){ negative=true; str=str.slice(1); }
    const [intStr, decStr] = str.split('.');
    const intPart = parseInt(intStr||'0', 10);
    if(isNaN(intPart)) return null;
    let words = converters[lang](intPart);
    if(negative) words = negativeWord[lang] + ' ' + words;
    if(decStr !== undefined && decStr.length>0){
      const digits = decStr.split('').map(d=>digitWords[lang][+d]).join(' ');
      words += ' ' + decimalWord[lang] + ' ' + digits;
    }
    return words;
  }

  // ---------- UI wiring ----------
  const input = document.getElementById('numInput');
  const output = document.getElementById('output');
  const speakBtn = document.getElementById('speakBtn');
  const stopBtn = document.getElementById('stopBtn');
  const status = document.getElementById('status');
  const rateSlider = document.getElementById('rate');
  const tabs = document.querySelectorAll('.lang-tab');
  const speakLabels = {ar:'🔊 انطق الرقم', fr:'🔊 Prononcer', en:'🔊 Speak'};
  const placeholderLabels = {
    ar:'سيظهر الرقم مكتوبًا بالحروف هنا...',
    fr:'Le nombre en toutes lettres apparaîtra ici...',
    en:'The number in words will appear here...'
  };
  const langCodes = {ar:'ar-SA', fr:'fr-FR', en:'en-US'};
  let currentLang = 'ar';

  function render(){
    const val = input.value;
    const words = numberStringToWords(val, currentLang);
    output.classList.toggle('rtl', currentLang==='ar');
    output.classList.toggle('ltr', currentLang!=='ar');
    if(!words){
      output.innerHTML = `<span class="placeholder">${placeholderLabels[currentLang]}</span>`;
    } else {
      output.textContent = words;
    }
    speakBtn.textContent = speakLabels[currentLang];
  }

  tabs.forEach(tab=>{
    tab.addEventListener('click', ()=>{
      tabs.forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      currentLang = tab.dataset.lang;
      render();
    });
  });
  input.addEventListener('input', render);

  function pickVoice(lang){
    const voices = speechSynthesis.getVoices();
    const prefix = langCodes[lang].split('-')[0];
    return voices.find(v=>v.lang && v.lang.toLowerCase().startsWith(langCodes[lang].toLowerCase()))
        || voices.find(v=>v.lang && v.lang.toLowerCase().startsWith(prefix))
        || null;
  }

  speakBtn.addEventListener('click', ()=>{
    const text = numberStringToWords(input.value, currentLang);
    if(!text){ status.textContent='الرجاء إدخال رقم صحيح.'; return; }
    if(!('speechSynthesis' in window)){
      status.textContent='المتصفح لا يدعم النطق الصوتي.'; return;
    }
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = langCodes[currentLang];
    utter.rate = +rateSlider.value;
    const voice = pickVoice(currentLang);
    if(voice) utter.voice = voice;
    else status.textContent = 'تنبيه: لم يُعثر على صوت مخصص لهذه اللغة على جهازك، سيُستخدم الصوت الافتراضي.';
    utter.onstart = ()=>{ if(voice) status.textContent=''; };
    utter.onerror = ()=>{ status.textContent='تعذّر تشغيل الصوت.'; };
    speechSynthesis.speak(utter);
  });

  stopBtn.addEventListener('click', ()=>{
    speechSynthesis.cancel();
  });

  if('speechSynthesis' in window){
    speechSynthesis.onvoiceschanged = ()=>{};
  }

  render();
})();
</script>
</body>
</html>
