  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معرض أنواع السيارات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt:#181a1f;
    --asphalt-2:#232630;
    --chrome:#cfd4dc;
    --chrome-dim:#8b909c;
    --amber:#e8a93a;
    --racing-red:#c4432b;
    --eco-teal:#2f9e8f;
    --line:#3a3f4c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, rgba(232,169,58,0.08), transparent 60%),
      repeating-linear-gradient(90deg, #15171b 0 2px, #181a1f 2px 80px),
      var(--asphalt);
    color:var(--chrome);
    font-family:'Cairo', sans-serif;
    min-height:100vh;
    padding:24px 16px 60px;
  }
  .wrap{max-width:1000px; margin:0 auto;}

  header{text-align:center; margin-bottom:36px; position:relative;}
  .plate{
    display:inline-block;
    background:#eef0f2;
    color:#181a1f;
    font-family:'Oswald', sans-serif;
    font-weight:700;
    letter-spacing:6px;
    font-size:13px;
    padding:5px 18px;
    border-radius:6px;
    border:3px solid #181a1f;
    box-shadow:0 0 0 2px #eef0f2, 0 6px 14px rgba(0,0,0,.5);
    margin-bottom:14px;
  }
  h1{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:clamp(28px,5vw,44px);
    color:#fff;
    text-shadow:0 0 24px rgba(232,169,58,0.25);
  }
  h1 span{color:var(--amber);}
  header p{color:var(--chrome-dim); margin-top:10px; font-size:15px;}

  /* showroom stage */
  .stage{
    position:relative;
    background:radial-gradient(ellipse at center, #2a2d38 0%, #1b1d24 70%);
    border:1px solid var(--line);
    border-radius:18px;
    padding:38px 20px 26px;
    margin-bottom:34px;
    min-height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .spotlight{
    position:absolute; top:-40%; left:50%; transform:translateX(-50%);
    width:420px; height:420px;
    background:radial-gradient(circle, rgba(232,169,58,0.18), transparent 65%);
    pointer-events:none;
    transition:opacity .4s;
    opacity:0;
  }
  .stage.active .spotlight{opacity:1;}
  .stage-content{
    text-align:center; position:relative; z-index:2;
    animation:none;
  }
  .stage-content.reveal{ animation: reveal .5s ease; }
  @keyframes reveal{ from{opacity:0; transform:translateY(14px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);} }
  .stage-empty{color:var(--chrome-dim); font-size:15px;}
  .stage-icon{font-size:64px; margin-bottom:6px; filter:drop-shadow(0 8px 18px rgba(0,0,0,.5));}
  .stage-name{font-family:'Oswald'; font-weight:700; font-size:26px; color:#fff; margin-bottom:4px;}
  .stage-tag{color:var(--amber); font-size:13px; letter-spacing:2px; margin-bottom:16px;}
  .stage-desc{max-width:560px; margin:0 auto 18px; color:var(--chrome); font-size:15px; line-height:1.9;}
  .traits{display:flex; flex-wrap:wrap; gap:8px; justify-content:center;}
  .trait{
    background:var(--asphalt-2); border:1px solid var(--line); color:var(--chrome);
    font-size:12.5px; padding:6px 12px; border-radius:20px;
  }
  .trait b{color:var(--amber); font-weight:600;}

  /* grid of car types */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:12px;
    margin-bottom:40px;
  }
  .car-card{
    background:var(--asphalt-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 10px;
    text-align:center;
    cursor:pointer;
    transition:transform .18s, border-color .18s, box-shadow .18s;
    font-family:inherit;
    color:var(--chrome);
  }
  .car-card:hover{transform:translateY(-3px); border-color:var(--amber);}
  .car-card:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
  .car-card.selected{
    border-color:var(--amber);
    box-shadow:0 0 0 1px var(--amber), 0 8px 20px rgba(232,169,58,.15);
    background:#2a2410;
  }
  .car-card .ic{font-size:30px; display:block; margin-bottom:8px;}
  .car-card .lbl{font-size:13.5px; font-weight:600;}

  /* section divider */
  .divider{
    display:flex; align-items:center; gap:12px; margin:44px 0 22px; color:var(--chrome-dim);
  }
  .divider::before, .divider::after{content:''; flex:1; height:1px; background:var(--line);}
  .divider span{font-family:'Oswald'; font-size:14px; letter-spacing:3px;}

  /* quiz */
  .quiz-box{
    background:var(--asphalt-2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:24px;
  }
  .quiz-progress{font-size:12.5px; color:var(--chrome-dim); margin-bottom:10px; font-family:'Oswald'; letter-spacing:1px;}
  .quiz-scenario{
    background:var(--asphalt);
    border-right:3px solid var(--amber);
    padding:14px 16px;
    border-radius:8px;
    font-size:15.5px;
    line-height:1.8;
    margin-bottom:18px;
  }
  .quiz-options{display:grid; gap:10px;}
  .opt-btn{
    background:var(--asphalt);
    border:1px solid var(--line);
    color:var(--chrome);
    padding:12px 14px;
    border-radius:9px;
    text-align:right;
    font-family:inherit;
    font-size:14.5px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .opt-btn:hover{border-color:var(--chrome-dim);}
  .opt-btn.correct{border-color:var(--eco-teal); background:#12332e; color:#bdeee5;}
  .opt-btn.wrong{border-color:var(--racing-red); background:#331813; color:#f1c3ba;}
  .opt-btn:disabled{cursor:default;}
  .quiz-feedback{margin-top:14px; font-size:14px; min-height:20px;}
  .quiz-feedback.good{color:var(--eco-teal);}
  .quiz-feedback.bad{color:#e08a78;}
  .quiz-nav{margin-top:16px; display:flex; justify-content:space-between; align-items:center;}
  .next-btn{
    background:var(--amber); color:#181a1f; border:none; font-family:'Oswald'; font-weight:700;
    padding:9px 20px; border-radius:8px; cursor:pointer; font-size:14px; letter-spacing:1px;
    visibility:hidden;
  }
  .next-btn.show{visibility:visible;}
  .score{font-family:'Oswald'; font-size:13px; color:var(--chrome-dim);}
  .quiz-done{text-align:center; padding:10px 0;}
  .quiz-done .big{font-family:'Oswald'; font-size:34px; color:#fff; margin-bottom:6px;}
  .restart-btn{
    margin-top:14px; background:none; border:1px solid var(--chrome-dim); color:var(--chrome);
    padding:8px 18px; border-radius:8px; cursor:pointer; font-family:inherit; font-size:13.5px;
  }
  .restart-btn:hover{border-color:var(--amber); color:var(--amber);}

  footer{text-align:center; margin-top:40px; color:var(--chrome-dim); font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="plate">ع ن س • 2026</div>
    <h1>معرض <span>أنواع السيارات</span></h1>
    <p>اضغط على أي سيارة لتتعرف على خصائصها، ثم اختبر معلوماتك في السيناريوهات</p>
  </header>

  <div class="stage" id="stage">
    <div class="spotlight"></div>
    <div class="stage-content" id="stageContent">
      <p class="stage-empty">اختر سيارة من المعرض بالأسفل لعرض تفاصيلها هنا ⤵</p>
    </div>
  </div>

  <div class="grid" id="carGrid"></div>

  <div class="divider"><span>اختبر معلوماتك</span></div>

  <div class="quiz-box" id="quizBox"></div>

  <footer>محاكاة تعليمية تفاعلية — أنواع السيارات</footer>
</div>

<script>
const CARS = [
  {
    id:'sedan', icon:'🚗', name:'السيدان', tag:'SEDAN',
    desc:'سيارة عائلية كلاسيكية بأربعة أبواب وصندوق أمتعة منفصل عن مقصورة الركاب، توفر توازنًا جيدًا بين الراحة والاقتصاد في استهلاك الوقود.',
    traits:[['المقاعد','4-5'],['الاستعمال','التنقل اليومي'],['الاقتصاد','عالٍ']]
  },
  {
    id:'hatchback', icon:'🚙', name:'الهاتشباك', tag:'HATCHBACK',
    desc:'سيارة مدمجة الحجم، يكون فيها صندوق الأمتعة متصلاً بمقصورة الركاب دون فاصل، مما يسهّل القيادة وإيجاد موقف لها داخل المدن المزدحمة.',
    traits:[['الحجم','صغير إلى متوسط'],['الاستعمال','قيادة المدينة'],['وقوف السيارة','سهل']]
  },
  {
    id:'suv', icon:'🚐', name:'الدفع الرباعي', tag:'SUV',
    desc:'سيارة مرتفعة عن الأرض بجسم قوي، وغالبًا ما تتوفر بنظام دفع رباعي يمكّنها من التعامل مع الطرق الوعرة وسوء الأحوال الجوية.',
    traits:[['الارتفاع','عن الأرض كبير'],['نظام الدفع','رباعي غالبًا'],['الاستعمال','طرق وعرة وعائلات']]
  },
  {
    id:'pickup', icon:'🛻', name:'البيك أب', tag:'PICKUP',
    desc:'سيارة ذات صندوق شحن مكشوف في الخلف، مصممة لنقل البضائع والمعدات الثقيلة، وتُستعمل كثيرًا في الأعمال الزراعية والإنشائية.',
    traits:[['صندوق الشحن','مكشوف'],['الاستعمال','نقل بضائع'],['التحمّل','عالٍ']]
  },
  {
    id:'sport', icon:'🏎️', name:'السيارة الرياضية', tag:'SPORTS CAR',
    desc:'سيارة منخفضة وانسيابية الشكل، مصممة لتحقيق سرعة عالية وأداء قيادي قوي، وغالبًا ما تتسع لراكبين فقط.',
    traits:[['المقاعد','2 غالبًا'],['السرعة','عالية جدًا'],['التصميم','انسيابي منخفض']]
  },
  {
    id:'van', icon:'🚌', name:'سيارة الفان', tag:'MINIVAN',
    desc:'سيارة عائلية كبيرة توفر مساحة واسعة وعدة صفوف من المقاعد، مثالية للعائلات الكبيرة أو نقل عدد كبير من الأشخاص معًا.',
    traits:[['المقاعد','7 فما فوق'],['المساحة','واسعة جدًا'],['الاستعمال','عائلات كبيرة']]
  },
  {
    id:'electric', icon:'🔌', name:'السيارة الكهربائية', tag:'ELECTRIC / HYBRID',
    desc:'سيارة تعمل بمحرك كهربائي بالكامل أو بمزيج من الكهرباء والوقود (هجينة)، وتتميز بانخفاض انبعاثاتها وصداقتها للبيئة.',
    traits:[['الطاقة','كهرباء / هجين'],['الانبعاثات','منخفضة'],['التزود بالوقود','شحن كهربائي']]
  },
];

const grid = document.getElementById('carGrid');
const stage = document.getElementById('stage');
const stageContent = document.getElementById('stageContent');

CARS.forEach(car=>{
  const btn = document.createElement('button');
  btn.className = 'car-card';
  btn.id = 'card-'+car.id;
  btn.innerHTML = `<span class="ic">${car.icon}</span><span class="lbl">${car.name}</span>`;
  btn.addEventListener('click', ()=> selectCar(car.id));
  grid.appendChild(btn);
});

function selectCar(id){
  document.querySelectorAll('.car-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('card-'+id).classList.add('selected');
  const car = CARS.find(c=>c.id===id);
  stage.classList.add('active');
  stageContent.classList.remove('reveal');
  void stageContent.offsetWidth;
  stageContent.innerHTML = `
    <div class="stage-icon">${car.icon}</div>
    <div class="stage-name">${car.name}</div>
    <div class="stage-tag">${car.tag}</div>
    <p class="stage-desc">${car.desc}</p>
    <div class="traits">
      ${car.traits.map(t=>`<span class="trait">${t[0]}: <b>${t[1]}</b></span>`).join('')}
    </div>
  `;
  stageContent.classList.add('reveal');
}

/* ---------- QUIZ ---------- */
const QUESTIONS = [
  {
    scenario:'عائلة مكوّنة من 7 أفراد تبحث عن سيارة تتّسع لجميعهم مع أمتعتهم في رحلة صيفية طويلة.',
    options:['السيارة الرياضية','سيارة الفان','السيارة الكهربائية','البيك أب'],
    answer:1,
    explain:'سيارة الفان مصممة بعدة صفوف من المقاعد ومساحة واسعة، وهي الخيار الأنسب للعائلات الكبيرة.'
  },
  {
    scenario:'شخص يريد سيارة سريعة وانسيابية لقيادتها في سباقات نهاية الأسبوع.',
    options:['الهاتشباك','السيدان','السيارة الرياضية','الدفع الرباعي'],
    answer:2,
    explain:'السيارة الرياضية مصممة خصيصًا للسرعة العالية والأداء القوي بفضل هيكلها المنخفض والانسيابي.'
  },
  {
    scenario:'مزارع يحتاج لنقل أكياس الأسمدة والمعدات الثقيلة إلى حقله كل يوم.',
    options:['البيك أب','السيدان','الهاتشباك','السيارة الكهربائية'],
    answer:0,
    explain:'صندوق الشحن المكشوف في البيك أب مصمم لحمل ونقل البضائع والمعدات الثقيلة.'
  },
  {
    scenario:'طالبة تسكن في وسط المدينة وتبحث عن سيارة صغيرة يسهل ركنها في الأزقة الضيقة.',
    options:['الدفع الرباعي','سيارة الفان','السيارة الرياضية','الهاتشباك'],
    answer:3,
    explain:'الهاتشباك سيارة مدمجة الحجم تسهّل القيادة والركن في شوارع المدينة المزدحمة.'
  },
  {
    scenario:'شخص يريد تقليل مصاريف الوقود والمحافظة على البيئة في تنقلاته اليومية.',
    options:['السيارة الكهربائية','البيك أب','السيارة الرياضية','الدفع الرباعي'],
    answer:0,
    explain:'السيارات الكهربائية أو الهجينة تستهلك طاقة أقل وتصدر انبعاثات أقل، فهي صديقة للبيئة والميزانية.'
  },
  {
    scenario:'عائلة تسافر كثيرًا عبر الجبال والطرق الترابية غير المعبّدة.',
    options:['السيدان','الدفع الرباعي','الهاتشباك','السيارة الرياضية'],
    answer:1,
    explain:'ارتفاع هيكل الدفع الرباعي عن الأرض ونظام الدفع الرباعي يجعلانه مناسبًا للطرق الوعرة.'
  },
  {
    scenario:'رجل أعمال يريد سيارة مريحة وأنيقة للتنقل اليومي بين المنزل والمكتب.',
    options:['البيك أب','سيارة الفان','السيدان','السيارة الرياضية'],
    answer:2,
    explain:'السيدان توفر توازنًا مريحًا بين الأناقة والاقتصاد، وهي مناسبة جدًا للتنقل اليومي.'
  }
];

let qIndex = 0, score = 0, answered = false;
const quizBox = document.getElementById('quizBox');

function renderQuestion(){
  answered = false;
  const q = QUESTIONS[qIndex];
  quizBox.innerHTML = `
    <div class="quiz-progress">سؤال ${qIndex+1} / ${QUESTIONS.length}</div>
    <div class="quiz-scenario">${q.scenario}</div>
    <div class="quiz-options" id="optsWrap">
      ${q.options.map((o,i)=>`<button class="opt-btn" data-i="${i}">${o}</button>`).join('')}
    </div>
    <div class="quiz-feedback" id="fb"></div>
    <div class="quiz-nav">
      <span class="score">النقاط: ${score} / ${QUESTIONS.length}</span>
      <button class="next-btn" id="nextBtn">${qIndex===QUESTIONS.length-1 ? 'عرض النتيجة' : 'التالي'}</button>
    </div>
  `;
  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.addEventListener('click', ()=>handleAnswer(parseInt(b.dataset.i)));
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    qIndex++;
    if(qIndex >= QUESTIONS.length){ renderDone(); } else { renderQuestion(); }
  });
}

function handleAnswer(i){
  if(answered) return;
  answered = true;
  const q = QUESTIONS[qIndex];
  const fb = document.getElementById('fb');
  document.querySelectorAll('.opt-btn').forEach((b,idx)=>{
    b.disabled = true;
    if(idx===q.answer) b.classList.add('correct');
    else if(idx===i) b.classList.add('wrong');
  });
  if(i===q.answer){
    score++;
    fb.textContent = '✔ إجابة صحيحة — ' + q.explain;
    fb.className = 'quiz-feedback good';
  } else {
    fb.textContent = '✘ غير صحيح — ' + q.explain;
    fb.className = 'quiz-feedback bad';
  }
  document.getElementById('nextBtn').classList.add('show');
  document.querySelector('.score').textContent = `النقاط: ${score} / ${QUESTIONS.length}`;
}

function renderDone(){
  const pct = Math.round((score/QUESTIONS.length)*100);
  let msg = pct===100 ? 'ممتاز! خبير سيارات حقيقي 🏆' : pct>=70 ? 'أداء جيد جدًا 👏' : pct>=40 ? 'لا بأس، حاول مجددًا لتحسين نتيجتك' : 'حاول مرة أخرى بعد مراجعة المعرض';
  quizBox.innerHTML = `
    <div class="quiz-done">
      <div class="big">${score} / ${QUESTIONS.length}</div>
      <p>${msg}</p>
      <button class="restart-btn" id="restartBtn">إعادة الاختبار</button>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', ()=>{
    qIndex = 0; score = 0; renderQuestion();
  });
}

renderQuestion();
</script>
</body>
</html>
