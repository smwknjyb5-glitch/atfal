<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محاكاة حالات المادة</title>
<style>
  :root{
    --navy-deep:#050b1e;
    --navy:#0a1630;
    --navy-light:#132248;
    --gold:#e8c468;
    --gold-soft:#f0d896;
    --text:#dbe4ff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(ellipse at top, #0d1a3c 0%, var(--navy-deep) 60%, #000 100%);
    font-family:"Tahoma","Segoe UI",sans-serif;
    color:var(--text);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
    overflow-x:hidden;
  }
  /* starfield */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, #fff8 50%, transparent 50%),
      radial-gradient(1px 1px at 70% 60%, #fff6 50%, transparent 50%),
      radial-gradient(1.5px 1.5px at 40% 80%, #fff9 50%, transparent 50%),
      radial-gradient(1px 1px at 85% 20%, #fff5 50%, transparent 50%),
      radial-gradient(1px 1px at 55% 45%, #fff7 50%, transparent 50%),
      radial-gradient(1.5px 1.5px at 10% 70%, #fff8 50%, transparent 50%),
      radial-gradient(1px 1px at 90% 85%, #fff6 50%, transparent 50%);
    background-size:300px 300px;
    z-index:-1;
    opacity:0.6;
  }
  h1{
    color:var(--gold-soft);
    text-shadow:0 0 20px rgba(232,196,104,0.4);
    letter-spacing:1px;
    font-size:clamp(22px,4vw,32px);
    margin:6px 0 2px;
  }
  .subtitle{
    color:#8fa3d4;
    font-size:14px;
    margin-bottom:18px;
    text-align:center;
  }
  .panel{
    background:linear-gradient(160deg, var(--navy-light), var(--navy));
    border:1px solid rgba(232,196,104,0.25);
    border-radius:16px;
    box-shadow:0 10px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03);
    padding:22px;
    max-width:820px;
    width:100%;
  }
  #canvasWrap{
    position:relative;
    border-radius:12px;
    overflow:hidden;
    border:1px solid rgba(232,196,104,0.3);
    box-shadow:inset 0 0 30px rgba(0,0,0,0.6);
  }
  canvas{
    display:block;
    width:100%;
    background:linear-gradient(180deg, #081228, #050c1c);
  }
  .stateLabel{
    position:absolute;
    top:12px;
    right:16px;
    font-size:20px;
    font-weight:bold;
    color:var(--gold);
    text-shadow:0 0 12px rgba(232,196,104,0.6);
    pointer-events:none;
  }
  .tempLabel{
    position:absolute;
    top:12px;
    left:16px;
    font-size:14px;
    color:#9fb3e8;
    pointer-events:none;
  }
  .controls{
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .row{
    display:flex;
    align-items:center;
    gap:14px;
  }
  input[type=range]{
    flex:1;
    -webkit-appearance:none;
    height:6px;
    border-radius:3px;
    background:linear-gradient(90deg, #6ec6ff, #e8c468, #ff6b4a);
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:20px;
    height:20px;
    border-radius:50%;
    background:var(--gold-soft);
    border:2px solid var(--navy-deep);
    box-shadow:0 0 10px rgba(232,196,104,0.7);
    cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:20px;
    height:20px;
    border-radius:50%;
    background:var(--gold-soft);
    border:2px solid var(--navy-deep);
    cursor:pointer;
  }
  .btnRow{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
  }
  button{
    background:linear-gradient(160deg, var(--navy-light), var(--navy));
    color:var(--gold-soft);
    border:1px solid rgba(232,196,104,0.4);
    padding:9px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    font-family:inherit;
    transition:all 0.15s ease;
  }
  button:hover{
    background:rgba(232,196,104,0.15);
    box-shadow:0 0 14px rgba(232,196,104,0.3);
  }
  button.active{
    background:var(--gold);
    color:var(--navy-deep);
    font-weight:bold;
  }
  .info{
    margin-top:16px;
    font-size:13px;
    color:#9fb3e8;
    line-height:1.9;
    background:rgba(0,0,0,0.2);
    border-radius:10px;
    padding:12px 16px;
  }
  .info b{color:var(--gold-soft);}
</style>
</head>
<body>

<h1>محاكاة حالات المادة</h1>
<p class="subtitle">حرّك درجة الحرارة لترى تحوّل الجسيمات بين الحالة الصلبة والسائلة والغازية</p>

<div class="panel">
  <div id="canvasWrap">
    <canvas id="sim" width="760" height="420"></canvas>
    <div class="stateLabel" id="stateLabel">صلبة</div>
    <div class="tempLabel" id="tempLabel">الحرارة: 20°</div>
  </div>

  <div class="controls">
    <div class="row">
      <span>❄️</span>
      <input type="range" id="tempSlider" min="0" max="100" value="20">
      <span>🔥</span>
    </div>
    <div class="btnRow">
      <button id="btnSolid">صلبة (Solid)</button>
      <button id="btnLiquid">سائلة (Liquid)</button>
      <button id="btnGas">غازية (Gas)</button>
    </div>
  </div>

  <div class="info">
    <b>صلبة:</b> الجسيمات مرتبة بإحكام وتهتز في مكانها فقط.<br>
    <b>سائلة:</b> الجسيمات متقاربة لكنها تنزلق وتتحرك بحرية نسبية.<br>
    <b>غازية:</b> الجسيمات متباعدة وتتحرك بسرعة عالية في كل الاتجاهات.
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('sim');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const slider = document.getElementById('tempSlider');
  const stateLabel = document.getElementById('stateLabel');
  const tempLabel = document.getElementById('tempLabel');
  const btnSolid = document.getElementById('btnSolid');
  const btnLiquid = document.getElementById('btnLiquid');
  const btnGas = document.getElementById('btnGas');

  const COLS = 8, ROWS = 6;
  const N = COLS * ROWS;
  const R = 12;

  let particles = [];

  function gridPos(i){
    const spacing = 44;
    const startX = W/2 - (COLS-1)*spacing/2;
    const startY = H/2 - (ROWS-1)*spacing/2;
    const col = i % COLS;
    const row = Math.floor(i / COLS);
    return { x: startX + col*spacing, y: startY + row*spacing };
  }

  function initParticles(){
    particles = [];
    for(let i=0;i<N;i++){
      const base = gridPos(i);
      particles.push({
        x: base.x, y: base.y,
        baseX: base.x, baseY: base.y,
        vx: (Math.random()-0.5)*0.5,
        vy: (Math.random()-0.5)*0.5
      });
    }
  }
  initParticles();

  function temperature(){ return parseInt(slider.value,10); }

  function stateFromTemp(t){
    if(t < 33) return 'solid';
    if(t < 66) return 'liquid';
    return 'gas';
  }

  function updateLabels(){
    const t = temperature();
    const s = stateFromTemp(t);
    stateLabel.textContent = s==='solid' ? 'صلبة' : s==='liquid' ? 'سائلة' : 'غازية';
    tempLabel.textContent = 'الحرارة: ' + t + '°';
    [btnSolid,btnLiquid,btnGas].forEach(b=>b.classList.remove('active'));
    if(s==='solid') btnSolid.classList.add('active');
    if(s==='liquid') btnLiquid.classList.add('active');
    if(s==='gas') btnGas.classList.add('active');
  }

  btnSolid.addEventListener('click', ()=>{ slider.value=15; updateLabels(); });
  btnLiquid.addEventListener('click', ()=>{ slider.value=50; updateLabels(); });
  btnGas.addEventListener('click', ()=>{ slider.value=85; updateLabels(); });
  slider.addEventListener('input', updateLabels);

  function colorForTemp(t){
    // blue (cold) -> gold (mid) -> red-orange (hot)
    if(t < 50){
      const f = t/50;
      const r = Math.round(110 + f*(232-110));
      const g = Math.round(198 + f*(196-198));
      const b = Math.round(255 + f*(104-255));
      return `rgb(${r},${g},${b})`;
    } else {
      const f = (t-50)/50;
      const r = Math.round(232 + f*(255-232));
      const g = Math.round(196 + f*(107-196));
      const b = Math.round(104 + f*(74-104));
      return `rgb(${r},${g},${b})`;
    }
  }

  function step(){
    const t = temperature();
    const s = stateFromTemp(t);
    const color = colorForTemp(t);
    const speed = 0.3 + (t/100)*3.2;

    ctx.clearRect(0,0,W,H);

    // container walls glow
    ctx.strokeStyle = 'rgba(232,196,104,0.15)';
    ctx.lineWidth = 2;
    ctx.strokeRect(4,4,W-8,H-8);

    for(const p of particles){
      if(s==='solid'){
        // vibrate around fixed lattice point
        p.vx += (Math.random()-0.5)*0.4;
        p.vy += (Math.random()-0.5)*0.4;
        p.vx *= 0.7; p.vy *= 0.7;
        const amp = 1 + (t/33)*2;
        p.x = p.baseX + p.vx*amp;
        p.y = p.baseY + p.vy*amp;
      } else if(s==='liquid'){
        p.vx += (Math.random()-0.5)*0.6;
        p.vy += (Math.random()-0.5)*0.6;
        const maxV = speed;
        p.vx = Math.max(-maxV, Math.min(maxV, p.vx));
        p.vy = Math.max(-maxV, Math.min(maxV, p.vy));
        p.x += p.vx;
        p.y += p.vy;
        // gentle pull back toward central cluster region (cohesion)
        const cx = W/2, cy = H/2, clusterR = 170;
        const dx = p.x-cx, dy = p.y-cy;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist > clusterR){
          p.vx -= dx*0.002;
          p.vy -= dy*0.002;
        }
      } else {
        // gas: free movement, bounce off walls
        p.vx += (Math.random()-0.5)*0.5;
        p.vy += (Math.random()-0.5)*0.5;
        const maxV = speed;
        p.vx = Math.max(-maxV, Math.min(maxV, p.vx));
        p.vy = Math.max(-maxV, Math.min(maxV, p.vy));
        p.x += p.vx;
        p.y += p.vy;
      }

      // wall collisions for liquid/gas
      if(s!=='solid'){
        if(p.x < R){ p.x = R; p.vx *= -1; }
        if(p.x > W-R){ p.x = W-R; p.vx *= -1; }
        if(p.y < R){ p.y = R; p.vy *= -1; }
        if(p.y > H-R){ p.y = H-R; p.vy *= -1; }
      }
    }

    // simple particle-particle repulsion for liquid/gas to avoid heavy overlap
    if(s!=='solid'){
      for(let i=0;i<particles.length;i++){
        for(let j=i+1;j<particles.length;j++){
          const a=particles[i], b=particles[j];
          const dx=b.x-a.x, dy=b.y-a.y;
          const dist=Math.sqrt(dx*dx+dy*dy)||0.01;
          const minDist = R*2;
          if(dist < minDist){
            const overlap = (minDist-dist)/2;
            const nx=dx/dist, ny=dy/dist;
            a.x -= nx*overlap; a.y -= ny*overlap;
            b.x += nx*overlap; b.y += ny*overlap;
          }
        }
      }
    }

    // draw particles
    for(const p of particles){
      ctx.beginPath();
      ctx.arc(p.x, p.y, R, 0, Math.PI*2);
      const grad = ctx.createRadialGradient(p.x-4,p.y-4,1,p.x,p.y,R);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.3, color);
      grad.addColorStop(1, color);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    requestAnimationFrame(step);
  }

  updateLabels();
  requestAnimationFrame(step);
})();
</script>

</body>
</html>
