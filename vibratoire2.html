 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محاكاة  النواس البسيط</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(160deg, #0f172a, #1e293b);
    color: #e2e8f0;
    min-height: 100vh;
    padding: 16px;
  }
  h1 {
    text-align: center;
    font-size: 1.3rem;
    margin: 8px 0 18px;
    color: #93c5fd;
  }
  .container {
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .panel {
    background: #111827;
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  canvas {
    display: block;
    width: 100%;
    background: #0b1220;
    border-radius: 10px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
    justify-content: center;
  }
  .ctrl-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 110px;
  }
  .ctrl-group label {
    font-size: 0.85rem;
    color: #94a3b8;
    margin-bottom: 4px;
  }
  .ctrl-group span {
    font-weight: bold;
    color: #38bdf8;
  }
  input[type=range] { width: 130px; }
  .buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 4px;
  }
  button {
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover { background: #1d4ed8; }
  button.secondary { background: #475569; }
  button.secondary:hover { background: #334155; }
  .info {
    text-align: center;
    font-size: 0.9rem;
    color: #cbd5e1;
    margin-top: 6px;
  }
  .note {
    text-align: center;
    font-size: 0.8rem;
    color: #f59e0b;
    margin-top: 4px;
  }
</style>
</head>
<body>
<h1>محاكاة  النواس البسيط ورسم منحنى الزاوية θ(t)</h1>
<div class="container">

  <div class="panel">
    <canvas id="mainCanvas" height="520"></canvas>
    <div class="note"> النواس يتأرجح في الأعلى، ومنحنى الزاوية θ(t) يُرسم أسفله على نفس المحور الأفقي — الخط المتقطع يربط الكتلة بالنقطة المقابلة على المنحنى لحظيًا</div>
  </div>

  <div class="panel controls">
    <div class="ctrl-group">
      <label>طول الخيط L (cm) <span id="lenVal">80</span></label>
      <input type="range" id="len" min="20" max="150" step="5" value="80">
    </div>
    <div class="ctrl-group">
      <label>السعة الزاوية θmax° <span id="ampVal">15</span></label>
      <input type="range" id="amp" min="5" max="30" step="1" value="15">
    </div>
    <div class="ctrl-group">
      <label>الطور الابتدائي φ° <span id="phaseVal">0</span></label>
      <input type="range" id="phase" min="0" max="360" step="10" value="0">
    </div>
  </div>

  <div class="panel">
    <div class="buttons">
      <button id="playBtn">▶ تشغيل</button>
      <button id="resetBtn" class="secondary">↺ إعادة</button>
    </div>
    <div class="info" id="equationLine">θ(t) = 15° cos(ω t + 0°)</div>
    <div class="info" id="periodInfo">الدور T = 2π√(L/g) = 1.79 s</div>
    <div class="info" id="liveInfo">t = 0.00 s &nbsp; | &nbsp; θ = 15.0° &nbsp; | &nbsp; ω̇ = 0.0°/s</div>
  </div>

</div>

<script>
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');

const lenSlider = document.getElementById('len');
const ampSlider = document.getElementById('amp');
const phaseSlider = document.getElementById('phase');
const lenVal = document.getElementById('lenVal');
const ampVal = document.getElementById('ampVal');
const phaseVal = document.getElementById('phaseVal');
const playBtn = document.getElementById('playBtn');
const resetBtn = document.getElementById('resetBtn');
const equationLine = document.getElementById('equationLine');
const periodInfo = document.getElementById('periodInfo');
const liveInfo = document.getElementById('liveInfo');

const g = 980; // cm/s^2

let L = parseFloat(lenSlider.value);       // cm
let thetaMaxDeg = parseFloat(ampSlider.value);
let phiDeg = parseFloat(phaseSlider.value);
let running = false;
let t = 0;
let lastTime = null;
const timeWindow = 8;
const history = [];

function resizeCanvas() {
  const ratio = window.devicePixelRatio || 1;
  const w = canvas.clientWidth;
  const h = canvas.height;
  canvas.width = w * ratio;
  canvas.height = h * ratio;
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
}

function omega() { return Math.sqrt(g / L); }
function period() { return 2 * Math.PI / omega(); }
function phiRad() { return phiDeg * Math.PI / 180; }
function thetaMaxRad() { return thetaMaxDeg * Math.PI / 180; }
function theta_of_t(time) { return thetaMaxRad() * Math.cos(omega() * time + phiRad()); }
function thetaDot_of_t(time) { return -thetaMaxRad() * omega() * Math.sin(omega() * time + phiRad()); }

function updateEquation() {
  equationLine.textContent = `θ(t) = ${thetaMaxDeg}° cos(${omega().toFixed(2)} t + ${phiDeg}°)`;
  periodInfo.textContent = `الدور T = 2π√(L/g) = ${period().toFixed(2)} s   (مستقل عن السعة θmax)`;
}

// تخطيط عام: البندول يتأرجح في الأعلى حول نقطة تعليق ثابتة
// المحور الأفقي المشترك يمثل الإزاحة الأفقية للكتلة (متناسبة تقريبًا مع الزاوية θ لصغر الزوايا)
// محور الزمن في المنحنى رأسي (ينمو نحو الأسفل)
function draw() {
  const w = canvas.clientWidth;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  const centerX = w / 2;
  const pivotY = 22;

  // طول مرئي للبندول (مضغوط ضمن نطاق مناسب بصريًا بغض النظر عن L الفعلي)
  const armPx = 90 + (L - 20) / (150 - 20) * 90; // بين 90 و180 بكسل

  const gapH = 26;
  const graphTop = pivotY + armPx + 30 + gapH;
  const graphBottom = h - 34;
  const plotH = graphBottom - graphTop;

  const maxThetaDeg = 32; // نطاق ثابت لمحور الزاوية
  const pxPerRad = armPx; // لأن sin(θ)≈θ (راديان) للزوايا الصغيرة، الإزاحة الأفقية ≈ armPx*θ

  // ===== منطقة البندول =====
  // نقطة التعليق
  ctx.fillStyle = '#94a3b8';
  ctx.beginPath();
  ctx.arc(centerX, pivotY, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(centerX - 30, pivotY - 6, 60, 6);

  // خط الرأسي المرجعي (θ=0)
  ctx.strokeStyle = '#475569';
  ctx.setLineDash([4,4]);
  ctx.beginPath();
  ctx.moveTo(centerX, pivotY);
  ctx.lineTo(centerX, pivotY + armPx + 25);
  ctx.stroke();
  ctx.setLineDash([]);

  // قوس المسار
  ctx.strokeStyle = '#1e293b';
  ctx.beginPath();
  ctx.arc(centerX, pivotY, armPx, Math.PI/2 - maxThetaDeg*Math.PI/180 - 0.15, Math.PI/2 + maxThetaDeg*Math.PI/180 + 0.15);
  ctx.stroke();

  const theta = theta_of_t(t);
  const bobX = centerX + armPx * Math.sin(theta);
  const bobY = pivotY + armPx * Math.cos(theta);

  // الخيط
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(centerX, pivotY);
  ctx.lineTo(bobX, bobY);
  ctx.stroke();

  // الكتلة (الكرة)
  const grad = ctx.createRadialGradient(bobX-4, bobY-4, 3, bobX, bobY, 15);
  grad.addColorStop(0, '#7dd3fc');
  grad.addColorStop(1, '#0284c7');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(bobX, bobY, 15, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#e0f2fe';
  ctx.lineWidth = 1;
  ctx.stroke();

  // ===== منطقة المنحنى (أسفل) =====
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(centerX, graphTop);
  ctx.lineTo(centerX, graphBottom);
  const padSide = 55;
  ctx.moveTo(padSide - 10, graphTop);
  ctx.lineTo(w - padSide + 10, graphTop);
  ctx.stroke();

  ctx.fillStyle = '#64748b';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('θ (°)', centerX, graphTop - 8);
  ctx.save();
  ctx.translate(padSide - 30, graphTop + 30);
  ctx.textAlign = 'center';
  ctx.fillText('t (s)', 0, 0);
  ctx.restore();

  const tStart = Math.max(0, t - timeWindow);

  ctx.strokeStyle = '#1e293b';
  ctx.fillStyle = '#475569';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'right';
  for (let tt = Math.ceil(tStart); tt <= tStart + timeWindow; tt++) {
    const gy = graphTop + ((tt - tStart) / timeWindow) * plotH;
    ctx.beginPath();
    ctx.moveTo(padSide - 10, gy);
    ctx.lineTo(w - padSide + 10, gy);
    ctx.stroke();
    ctx.fillText(tt + '', padSide - 14, gy + 3);
  }

  // منحنى θ(t)
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 2;
  ctx.beginPath();
  let started = false;
  for (const pt of history) {
    if (pt.t < tStart) continue;
    const gx = centerX + armPx * Math.sin(pt.theta);
    const gy = graphTop + ((t - pt.t) / timeWindow) * plotH;
    if (!started) { ctx.moveTo(gx, gy); started = true; }
    else ctx.lineTo(gx, gy);
  }
  ctx.stroke();

  // النقطة الحالية أعلى المنحنى
  const curveX = bobX;
  const curveY = graphTop;
  ctx.fillStyle = '#f87171';
  ctx.beginPath();
  ctx.arc(curveX, curveY, 5, 0, Math.PI * 2);
  ctx.fill();

  // الخط الواصل العمودي بين الكتلة ونقطة المنحنى
  ctx.strokeStyle = '#f87171';
  ctx.lineWidth = 1.3;
  ctx.setLineDash([5,4]);
  ctx.beginPath();
  ctx.moveTo(bobX, bobY + 16);
  ctx.lineTo(curveX, curveY);
  ctx.stroke();
  ctx.setLineDash([]);
}

function updateLiveInfo() {
  const thetaDeg = theta_of_t(t) * 180 / Math.PI;
  const thetaDotDeg = thetaDot_of_t(t) * 180 / Math.PI;
  liveInfo.textContent = `t = ${t.toFixed(2)} s   |   θ = ${thetaDeg.toFixed(1)}°   |   θ̇ = ${thetaDotDeg.toFixed(1)}°/s`;
}

function step(timestamp) {
  if (!running) return;
  if (lastTime === null) lastTime = timestamp;
  const dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;
  t += dt;
  history.push({ t, theta: theta_of_t(t) });
  while (history.length && history[0].t < t - timeWindow - 1) history.shift();
  draw();
  updateLiveInfo();
  requestAnimationFrame(step);
}

function resetAll() {
  running = false;
  lastTime = null;
  t = 0;
  history.length = 0;
  history.push({ t: 0, theta: theta_of_t(0) });
  playBtn.textContent = '▶ تشغيل';
  draw();
  updateLiveInfo();
}

playBtn.addEventListener('click', () => {
  running = !running;
  playBtn.textContent = running ? '⏸ إيقاف مؤقت' : '▶ تشغيل';
  if (running) {
    lastTime = null;
    requestAnimationFrame(step);
  }
});

resetBtn.addEventListener('click', resetAll);

lenSlider.addEventListener('input', () => {
  L = parseFloat(lenSlider.value);
  lenVal.textContent = L;
  updateEquation();
  if (!running) draw();
});
ampSlider.addEventListener('input', () => {
  thetaMaxDeg = parseFloat(ampSlider.value);
  ampVal.textContent = thetaMaxDeg;
  updateEquation();
  if (!running) draw();
});
phaseSlider.addEventListener('input', () => {
  phiDeg = parseFloat(phaseSlider.value);
  phaseVal.textContent = phiDeg;
  updateEquation();
  if (!running) draw();
});

window.addEventListener('resize', () => { resizeCanvas(); draw(); });

resizeCanvas();
updateEquation();
resetAll();
</script>
</body>
</html>
