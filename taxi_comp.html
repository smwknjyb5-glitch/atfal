 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكاة مكونات السيارة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e, #16213e);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        .header {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #00d4ff;
            box-shadow: 0 5px 30px rgba(0, 212, 255, 0.3);
        }

        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            color: #a0a0a0;
            font-size: 1.1em;
        }

        .main-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            height: calc(100vh - 120px);
        }

        .components-nav {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 20px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .category-title {
            color: #00d4ff;
            font-size: 1.2em;
            margin: 15px 0 10px 0;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.3);
        }

        .component-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border-right: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .component-item:hover {
            background: rgba(0, 212, 255, 0.15);
            border-right-color: #00d4ff;
            transform: translateX(-5px);
        }

        .component-item.active {
            background: rgba(0, 255, 136, 0.2);
            border-right-color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .component-icon {
            font-size: 1.5em;
            width: 40px;
            text-align: center;
        }

        .component-name {
            font-weight: bold;
            color: #e0e0e0;
        }

        .car-preview {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 30px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .car-svg {
            width: 100%;
            max-width: 800px;
            filter: drop-shadow(0 0 30px rgba(0, 212, 255, 0.5));
            transition: all 0.5s;
        }

        .car-svg .highlight-part {
            animation: glow 1.5s infinite;
        }

        @keyframes glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.5) drop-shadow(0 0 10px #00d4ff); }
        }

        .info-panel {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: 25px;
            margin-top: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            width: 100%;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .info-panel h3 {
            color: #00ff88;
            font-size: 1.8em;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-label {
            color: #00d4ff;
            font-size: 0.9em;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .info-value {
            color: #ffffff;
            font-size: 1.1em;
            font-weight: bold;
        }

        .material-badge {
            display: inline-block;
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            padding: 5px 15px;
            border-radius: 20px;
            margin: 5px;
            font-size: 0.9em;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .function-desc {
            color: #c0c0c0;
            line-height: 1.8;
            font-size: 1.1em;
            margin: 15px 0;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .stat {
            background: rgba(0, 212, 255, 0.1);
            padding: 10px 20px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-value {
            color: #00d4ff;
            font-weight: bold;
            font-size: 1.2em;
        }

        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9em;
            pointer-events: none;
            border: 1px solid #00d4ff;
            display: none;
            z-index: 100;
        }

        @media (max-width: 968px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            .components-nav {
                max-height: 300px;
            }
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚗 محاكاة مكونات السيارة</h1>
        <p>اكتشف مكونات السيارة وأسمائها ووظائفها ومواد صنعها</p>
    </div>

    <div class="main-container">
        <!-- قائمة المكونات -->
        <div class="components-nav" id="componentsNav">
            <div class="category-title">🔧 المحرك ومكوناته</div>
            <div id="engineComponents"></div>

            <div class="category-title">🛞 نظام التعليق والفرامل</div>
            <div id="suspensionComponents"></div>

            <div class="category-title">⚡ النظام الكهربائي</div>
            <div id="electricalComponents"></div>

            <div class="category-title">🛡️ الهيكل الخارجي</div>
            <div id="bodyComponents"></div>

            <div class="category-title">💨 نظام العادم والتبريد</div>
            <div id="exhaustComponents"></div>
        </div>

        <!-- معاينة السيارة -->
        <div class="car-preview">
            <svg class="car-svg" viewBox="0 0 800 400" id="carSVG">
                <!-- الجسم الرئيسي -->
                <g id="carBody">
                    <rect x="150" y="200" width="500" height="100" rx="10" fill="#2a2a3e" stroke="#4a4a6e" stroke-width="2"/>
                    <path d="M 200 200 L 250 130 L 550 130 L 600 200 Z" fill="#3a3a5e" stroke="#4a4a6e" stroke-width="2"/>
                    <!-- النوافذ -->
                    <path d="M 260 135 L 320 135 L 320 195 L 250 195 Z" fill="#1a1a2e" stroke="#4a4a6e" stroke-width="1"/>
                    <path d="M 340 135 L 530 135 L 540 195 L 330 195 Z" fill="#1a1a2e" stroke="#4a4a6e" stroke-width="1"/>
                </g>

                <!-- العجلات -->
                <circle cx="250" cy="320" r="40" fill="#1a1a1a" stroke="#333" stroke-width="3"/>
                <circle cx="250" cy="320" r="25" fill="#333" stroke="#555" stroke-width="2"/>
                <circle cx="550" cy="320" r="40" fill="#1a1a1a" stroke="#333" stroke-width="3"/>
                <circle cx="550" cy="320" r="25" fill="#333" stroke="#555" stroke-width="2"/>

                <!-- المصابيح -->
                <rect x="630" y="230" width="30" height="40" rx="5" fill="#ff4444" opacity="0.8"/>
                <rect x="140" y="230" width="30" height="40" rx="5" fill="#ffff00" opacity="0.8"/>

                <!-- المحرك (مميز) -->
                <rect id="engineBlock" x="170" y="220" width="120" height="60" rx="5" fill="#555" stroke="#777" stroke-width="2" cursor="pointer"/>

                <!-- المبرد -->
                <rect id="radiatorBlock" x="120" y="230" width="30" height="50" rx="3" fill="#666" stroke="#888" stroke-width="2" cursor="pointer"/>

                <!-- البطارية -->
                <rect id="batteryBlock" x="200" y="170" width="50" height="30" rx="5" fill="#444" stroke="#666" stroke-width="2" cursor="pointer"/>

                <!-- نظام العادم -->
                <rect id="exhaustBlock" x="650" y="260" width="60" height="15" rx="3" fill="#555" stroke="#777" stroke-width="2" cursor="pointer"/>

                <!-- الفرامل -->
                <circle id="brakeBlock" cx="250" cy="320" r="35" fill="none" stroke="#ff0000" stroke-width="2" stroke-dasharray="5,5" opacity="0.5" cursor="pointer"/>
                <circle id="brakeBlock2" cx="550" cy="320" r="35" fill="none" stroke="#ff0000" stroke-width="2" stroke-dasharray="5,5" opacity="0.5" cursor="pointer"/>

                <!-- نظام التعليق -->
                <rect id="suspensionBlock" x="230" y="280" width="40" height="50" rx="5" fill="#666" stroke="#888" stroke-width="2" cursor="pointer"/>
                <rect id="suspensionBlock2" x="530" y="280" width="40" height="50" rx="5" fill="#666" stroke="#888" stroke-width="2" cursor="pointer"/>
            </svg>

            <div class="tooltip" id="tooltip"></div>

            <div class="info-panel" id="infoPanel">
                <h3>🔍 اختر مكوناً للعرض</h3>
                <p style="color: #888;">انقر على أي جزء في السيارة أو اختر من القائمة</p>
            </div>
        </div>
    </div>

    <script>
        // قاعدة بيانات مكونات السيارة
        const carComponents = {
            engine: {
                name: "المحرك",
                icon: "🔧",
                category: "engine",
                parts: [
                    {
                        id: "engineBlock",
                        name: "كتلة المحرك",
                        icon: "⚙️",
                        function: "هو الهيكل الرئيسي للمحرك ويحتوي على الأسطوانات والمكابس. يحول الطاقة الحرارية الناتجة عن احتراق الوقود إلى طاقة ميكانيكية.",
                        material: ["حديد الزهر", "الألمنيوم", "سبائك المغنيسيوم"],
                        specs: "يتحمل درجات حرارة تصل إلى 2000 درجة مئوية",
                        weight: "150-250 كجم"
                    },
                    {
                        id: "piston",
                        name: "المكبس",
                        icon: "🔩",
                        function: "يتحرك داخل الأسطوانة لضغط خليط الوقود والهواء ونقل القوة الناتجة عن الاحتراق إلى عمود المرفق.",
                        material: ["سبائك الألمنيوم", "الصلب المطاوع"],
                        specs: "يتحرك بسرعة تصل إلى 20 متر/ثانية",
                        weight: "0.5-1 كجم"
                    },
                    {
                        id: "crankshaft",
                        name: "عمود المرفق",
                        icon: "⚡",
                        function: "يحول الحركة الخطية للمكابس إلى حركة دورانية تنقل إلى ناقل الحركة.",
                        material: ["الصلب الكربوني", "حديد الزهر العقدي"],
                        specs: "يتحمل عزم دوران يصل إلى 500 نيوتن.متر",
                        weight: "15-30 كجم"
                    }
                ]
            },
            body: {
                name: "الهيكل",
                icon: "🛡️",
                category: "body",
                parts: [
                    {
                        id: "carBody",
                        name: "هيكل السيارة",
                        icon: "🚗",
                        function: "الإطار الرئيسي الذي يحمل جميع مكونات السيارة ويوفر الحماية للركاب.",
                        material: ["الصلب عالي المقاومة", "الألمنيوم", "ألياف الكربون"],
                        specs: "مصمم لامتصاص الصدمات وحماية الركاب",
                        weight: "300-600 كجم"
                    },
                    {
                        id: "doors",
                        name: "الأبواب",
                        icon: "🚪",
                        function: "توفر مدخلاً للركاب وتحتوي على نوافذ وآليات قفل للحماية.",
                        material: ["الصلب", "الألمنيوم", "البلاستيك المقوى"],
                        specs: "مزودة بعوارض جانبية للحماية من الصدمات",
                        weight: "30-50 كجم للباب الواحد"
                    }
                ]
            },
            electrical: {
                name: "النظام الكهربائي",
                icon: "⚡",
                category: "electrical",
                parts: [
                    {
                        id: "batteryBlock",
                        name: "البطارية",
                        icon: "🔋",
                        function: "تزود السيارة بالطاقة الكهربائية لتشغيل المحرك والأنظمة الكهربائية.",
                        material: ["الرصاص", "حمض الكبريتيك", "البلاستيك"],
                        specs: "12 فولت، 60-100 أمبير/ساعة",
                        weight: "15-25 كجم"
                    },
                    {
                        id: "alternator",
                        name: "المولد الكهربائي",
                        icon: "⚡",
                        function: "يولد الطاقة الكهربائية أثناء دوران المحرك لشحن البطارية وتغذية الأنظمة الكهربائية.",
                        material: ["النحاس", "الصلب", "الألمنيوم"],
                        specs: "ينتج 70-150 أمبير",
                        weight: "5-8 كجم"
                    }
                ]
            },
            suspension: {
                name: "التعليق والفرامل",
                icon: "🛞",
                category: "suspension",
                parts: [
                    {
                        id: "brakeBlock",
                        name: "نظام الفرامل",
                        icon: "🛑",
                        function: "يوقف السيارة عن طريق احتكاك البطانات بالأقراص المعدنية لتحويل الطاقة الحركية إلى حرارة.",
                        material: ["الحديد الزهر", "السيراميك", "ألياف الكربون"],
                        specs: "قوة كبح تصل إلى 1.5 طن",
                        weight: "10-20 كجم للعجلة"
                    },
                    {
                        id: "suspensionBlock",
                        name: "نظام التعليق",
                        icon: "🔧",
                        function: "يمتص الصدمات ويحافظ على ثبات السيارة وراحة الركاب.",
                        material: ["الصلب الزنبركي", "المطاط", "الألمنيوم"],
                        specs: "يتحمل أوزان تصل إلى 2 طن",
                        weight: "20-40 كجم"
                    }
                ]
            },
            cooling: {
                name: "التبريد والعادم",
                icon: "💨",
                category: "exhaust",
                parts: [
                    {
                        id: "radiatorBlock",
                        name: "المبرد",
                        icon: "❄️",
                        function: "يبرد سائل التبريد للحفاظ على درجة حرارة المحرك المثلى.",
                        material: ["الألمنيوم", "النحاس", "البلاستيك"],
                        specs: "يخفض درجة حرارة السائل من 90 إلى 70 درجة",
                        weight: "5-10 كجم"
                    },
                    {
                        id: "exhaustBlock",
                        name: "نظام العادم",
                        icon: "💨",
                        function: "يطرد الغازات الناتجة عن الاحتراق ويقلل الضوضاء والانبعاثات الضارة.",
                        material: ["الصلب المقاوم للصدأ", "الحديد المطلي"],
                        specs: "يقلل الضوضاء بنسبة 80%",
                        weight: "15-25 كجم"
                    }
                ]
            }
        };

        // إنشاء قائمة المكونات
        function createComponentsList() {
            const categories = {
                engine: document.getElementById('engineComponents'),
                suspension: document.getElementById('suspensionComponents'),
                electrical: document.getElementById('electricalComponents'),
                body: document.getElementById('bodyComponents'),
                exhaust: document.getElementById('exhaustComponents')
            };

            for (const [key, component] of Object.entries(carComponents)) {
                const container = categories[component.category];
                if (!container) continue;

                component.parts.forEach(part => {
                    const div = document.createElement('div');
                    div.className = 'component-item';
                    div.id = `nav-${part.id}`;
                    div.innerHTML = `
                        <span class="component-icon">${part.icon}</span>
                        <span class="component-name">${part.name}</span>
                    `;
                    div.onclick = () => showComponentInfo(part);
                    container.appendChild(div);
                });
            }
        }

        // عرض معلومات المكون
        function showComponentInfo(part) {
            // تحديث القائمة النشطة
            document.querySelectorAll('.component-item').forEach(item => {
                item.classList.remove('active');
            });
            const navItem = document.getElementById(`nav-${part.id}`);
            if (navItem) navItem.classList.add('active');

            // تحديث الرسم
            highlightCarPart(part.id);

            // تحديث لوحة المعلومات
            const infoPanel = document.getElementById('infoPanel');
            infoPanel.innerHTML = `
                <h3>${part.icon} ${part.name}</h3>
                <div class="function-desc">${part.function}</div>

                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">🛠️ المواد المستخدمة</div>
                        <div class="info-value">
                            ${part.material.map(m => `<span class="material-badge">${m}</span>`).join(' ')}
                        </div>
                    </div>

                    <div class="info-item">
                        <div class="info-label">⚖️ الوزن التقريبي</div>
                        <div class="info-value">${part.weight}</div>
                    </div>

                    <div class="info-item">
                        <div class="info-label">📊 المواصفات</div>
                        <div class="info-value">${part.specs}</div>
                    </div>

                    <div class="info-item">
                        <div class="info-label">🔧 الصيانة</div>
                        <div class="info-value">كل 10,000 - 20,000 كم</div>
                    </div>
                </div>

                <div class="stats-bar">
                    <div class="stat">
                        <span>🔄</span>
                        <span class="stat-value">عالي</span>
                        <span>الأهمية</span>
                    </div>
                    <div class="stat">
                        <span>💰</span>
                        <span class="stat-value">متوسط</span>
                        <span>التكلفة</span>
                    </div>
                    <div class="stat">
                        <span>⏱️</span>
                        <span class="stat-value">5-10 سنوات</span>
                        <span>العمر الافتراضي</span>
                    </div>
                </div>
            `;

            // تمرير إلى لوحة المعلومات
            infoPanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // تمييز الجزء في الرسم
        function highlightCarPart(partId) {
            // إزالة التمييز السابق
            document.querySelectorAll('.car-svg [id]').forEach(el => {
                el.style.fill = '';
                el.style.stroke = '';
                el.style.filter = '';
                el.classList.remove('highlight-part');
            });

            // تمييز الجزء المحدد
            const element = document.getElementById(partId);
            if (element) {
                element.style.fill = '#00ff88';
                element.style.stroke = '#00d4ff';
                element.style.strokeWidth = '3';
                element.classList.add('highlight-part');
            }
        }

        // إضافة تفاعل الماوس على الرسم
        function addSVGInteractions() {
            const svg = document.getElementById('carSVG');
            const tooltip = document.getElementById('tooltip');

            // ربط عناصر SVG مع المكونات
            const allParts = [];
            for (const component of Object.values(carComponents)) {
                allParts.push(...component.parts);
            }

            allParts.forEach(part => {
                const element = document.getElementById(part.id);
                if (element) {
                    element.addEventListener('click', (e) => {
                        e.stopPropagation();
                        showComponentInfo(part);
                    });

                    element.addEventListener('mouseover', (e) => {
                        tooltip.style.display = 'block';
                        tooltip.innerHTML = `<strong>${part.name}</strong><br>انقر للتفاصيل`;
                        tooltip.style.left = (e.pageX + 10) + 'px';
                        tooltip.style.top = (e.pageY - 30) + 'px';
                    });

                    element.addEventListener('mouseout', () => {
                        tooltip.style.display = 'none';
                    });

                    element.addEventListener('mousemove', (e) => {
                        tooltip.style.left = (e.pageX + 10) + 'px';
                        tooltip.style.top = (e.pageY - 30) + 'px';
                    });
                }
            });
        }

        // إضافة تأثيرات حركية
        function addAnimations() {
            // دوران العجلات
            const wheels = document.querySelectorAll('circle[r="40"]');
            wheels.forEach(wheel => {
                wheel.style.transition = 'transform 0.5s';
                wheel.addEventListener('mouseover', () => {
                    wheel.style.transform = 'rotate(360deg)';
                });
                wheel.addEventListener('mouseout', () => {
                    wheel.style.transform = 'rotate(0deg)';
                });
            });
        }

        // تهيئة المحاكاة
        function init() {
            createComponentsList();
            addSVGInteractions();
            addAnimations();

            // عرض المحرك افتراضياً
            setTimeout(() => {
                const enginePart = carComponents.engine.parts[0];
                showComponentInfo(enginePart);
            }, 500);
        }

        // بدء التشغيل
        init();
    </script>
</body>
</html>
