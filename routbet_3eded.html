<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مراتب العدد</title>
</head>
<body>

<h2>معرفة مراتب العدد</h2>

<input type="number" id="nombre" placeholder="أدخل عدداً طبيعياً">
<button onclick="analyser()">تحليل</button>

<p id="resultat"></p>

<script>
function analyser() {
    let n = document.getElementById("nombre").value;

    if (n === "") {
        document.getElementById("resultat").innerHTML = "أدخل عدداً.";
        return;
    }

    let chiffres = n.split("").reverse();
    let noms = [
        "الوحدات",
        "العشرات",
        "المئات",
        "الآلاف",
        "عشرات الآلاف",
        "مئات الآلاف",
          "الملايين",
          "عشرات الملايين",
          "مئات الملايين",
          "الملايير",
    ];

    let texte = "";

    for (let i = 0; i < chiffres.length; i++) {
        if (i < noms.length) {
            texte += noms[i] + " : " + chiffres[i] + "<br>";
        }
    }

    document.getElementById("resultat").innerHTML = texte;
}
</script>

</body>
</html>
