 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محاكاة: الأستاذ (المعلم) - أدواته ومهامه</title>
<style>
  :root{
    --bg:#f0f7f4;
    --card:#ffffff;
    --accent:#2c6e49;
    --accent2:#e08e45;
    --ink:#2c2c2c;
    --muted:#7a7a7a;
    --shadow: 0 8px 20px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box; font-family:"Tahoma","Segoe UI",Arial,sans-serif;}
  body{
    margin:0;
    background:linear-gradient(160deg,#f0f7f4,#e4efe8);
    color:var(--ink);
    min-height:100vh;
    padding:20px;
  }
  header{text-align:center; margin-bottom:24px;}
  header h1{font-size:1.8rem; color:var(--accent); margin-bottom:6px;}
  header p{color:var(--muted); font-size:.95rem;}

  .tabs{
    display:flex; justify-content:center; gap:10px; margin-bottom:24px; flex-wrap:wrap;
  }
  .tab-btn{
    padding:10px 20px; border:2px solid var(--accent); background:transparent;
    color:var(--accent); border-radius:30px; cursor:pointer; font-weight:bold; transition:.25s;
  }
  .tab-btn.active, .tab-btn:hover{ background:var(--accent); color:#fff; }

  .section{display:none;}
  .section.active{display:block; animation:fadeIn .4s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  .grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:18px; max-width:1000px; margin:0 auto;
  }
  .card{
    background:var(--card); border-radius:16px; box-shadow:var(--shadow);
    padding:18px; cursor:pointer; text-align:center; border:3px solid transparent; transition:.25s;
  }
  .card:hover{ transform:translateY(-5px); border-color:var(--accent2); }
  .card.selected{ border-color:var(--accent); background:#f4fbf7; }
  .card .icon{ font-size:2.6rem; margin-bottom:8px; display:block; }
  .card h3{ margin:6px 0 4px; color:var(--accent); font-size:1.05rem; }
  .card .short{ font-size:.82rem; color:var(--muted); }

  .detail{
    max-width:800px; margin:22px auto 0; background:var(--card); border-radius:16px;
    box-shadow:var(--shadow); padding:22px; display:none;
  }
  .detail.show{display:block; animation:fadeIn .4s ease;}
  .detail h2{ color:var(--accent); margin-top:0; display:flex; align-items:center; gap:10px; }
  .detail .row{ display:flex; gap:10px; margin:10px 0; align-items:flex-start; }
  .detail .row .label{ min-width:110px; font-weight:bold; color:var(--accent2); }

  .quiz-box{
    max-width:700px; margin:0 auto; background:var(--card); border-radius:16px;
    box-shadow:var(--shadow); padding:24px; text-align:center;
  }
  .quiz-box h2{color:var(--accent);}
  .scenario{
    background:#f4fbf7; border-radius:12px; padding:16px; margin-bottom:16px;
    font-size:1.05rem; min-height:70px; display:flex; align-items:center; justify-content:center;
  }
  .options{ display:grid; grid-template-columns:1fr; gap:10px; }
  .opt-btn{
    padding:12px; border-radius:10px; border:2px solid #ddd; background:#fff;
    cursor:pointer; font-size:.95rem; transition:.2s; text-align:right;
  }
  .opt-btn:hover{border-color:var(--accent2);}
  .opt-btn.correct{background:#d4f7e0; border-color:#27ae60;}
  .opt-btn.wrong{background:#fddede; border-color:#e74c3c;}
  .feedback{ margin-top:14px; font-weight:bold; min-height:24px; }
  .score{ margin-top:10px; color:var(--muted); }
  .next-btn{
    margin-top:14px; padding:10px 24px; border:none; background:var(--accent);
    color:#fff; border-radius:30px; cursor:pointer; font-weight:bold; display:none;
  }
  footer{ text-align:center; color:var(--muted); margin-top:30px; font-size:.8rem; }
</style>
</head>
<body>

<header>
  <h1>👨‍🏫 محاكاة: الأستاذ (المعلم)</h1>
  <p>اكتشف أدوات الأستاذ ومهامه داخل القسم، ثم اختبر نفسك في مواقف صفية</p>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="tools">أدوات الأستاذ</button>
  <button class="tab-btn" data-tab="roles">مهام الأستاذ</button>
  <button class="tab-btn" data-tab="quiz">اختبار المواقف</button>
</div>

<!-- TOOLS -->
<div class="section active" id="tools">
  <div class="grid" id="toolsGrid"></div>
  <div class="detail" id="toolsDetail"></div>
</div>

<!-- ROLES -->
<div class="section" id="roles">
  <div class="grid" id="rolesGrid"></div>
  <div class="detail" id="rolesDetail"></div>
</div>

<!-- QUIZ -->
<div class="section" id="quiz">
  <div class="quiz-box">
    <h2>❓ ماذا يفعل الأستاذ الجيد في هذا الموقف؟</h2>
    <div class="scenario" id="scenarioText">اضغط على التبويب لبدء الأسئلة</div>
    <div class="options" id="optionsBox"></div>
    <div class="feedback" id="feedbackText"></div>
    <button class="next-btn" id="nextBtn">السؤال التالي ⬅</button>
    <div class="score" id="scoreText">النقطة: 0 / 0</div>
  </div>
</div>

<footer>محاكاة تفاعلية تعليمية — الأستاذ/المعلم: أدواته ومهامه</footer>

<script>
const tools = [
  {id:'board', icon:'📋', name:'السبورة', short:'وسيلة الشرح الأساسية',
   material:'سبورة بيضاء أو خضراء، أو رقمية (ذكية)',
   usage:'يكتب عليها الأستاذ الدرس، الأمثلة، والتمارين ليراها التلاميذ جميعاً',
   who:'تُستعمل في كل الحصص تقريباً'},
  {id:'chalk', icon:'✏️', name:'الطباشير / القلم', short:'أداة الكتابة على السبورة',
   material:'طباشير كلاسيكي أو أقلام خاصة للسبورة البيضاء',
   usage:'الكتابة والرسم على السبورة أثناء الشرح',
   who:'أداة يومية لكل أستاذ'},
  {id:'book', icon:'📚', name:'الكتاب المدرسي', short:'المرجع الأساسي للدرس',
   material:'كتاب ورقي أو نسخة رقمية',
   usage:'يعتمد عليه الأستاذ لتحضير الدروس واختيار التمارين',
   who:'يُستعمل من طرف الأستاذ والتلاميذ معاً'},
  {id:'redpen', icon:'🖊️', name:'القلم الأحمر (التصحيح)', short:'لتصحيح الفروض والواجبات',
   material:'قلم حبر أحمر',
   usage:'تصحيح أوراق التلاميذ، وضع الملاحظات والعلامات',
   who:'أداة خاصة بمرحلة التصحيح والتقييم'},
  {id:'register', icon:'📔', name:'دفتر التنقيط / لائحة الحضور', short:'لتسجيل النقط والغياب',
   material:'دفتر ورقي أو نظام رقمي',
   usage:'تسجيل حضور وغياب التلاميذ، وتدوين النقط والملاحظات',
   who:'أداة إدارية يومية للأستاذ'},
  {id:'projector', icon:'💻', name:'الحاسوب / جهاز العرض', short:'للدروس الرقمية والوسائط',
   material:'حاسوب محمول وجهاز عرض (بروجكتور)',
   usage:'عرض دروس تفاعلية، صور، فيديوهات، وعروض تقديمية',
   who:'يُستعمل في الأقسام المجهزة بالوسائل الحديثة'},
  {id:'ruler', icon:'📐', name:'المسطرة والأدوات الهندسية', short:'للرسم والقياس',
   material:'مسطرة، منقلة، فرجار',
   usage:'رسم الأشكال الهندسية والجداول على السبورة',
   who:'خاصة بمواد الرياضيات والهندسة'},
  {id:'bag', icon:'💼', name:'حقيبة الأستاذ', short:'لحمل مستلزمات العمل',
   material:'حقيبة يدوية أو ظهرية',
   usage:'حمل الكتب، الدفاتر، الأوراق المصححة، والأدوات اليومية',
   who:'ترافق الأستاذ من وإلى المؤسسة'}
];

const roles = [
  {id:'teach', icon:'🧑‍🏫', name:'التدريس والشرح', short:'إيصال المعرفة',
   material:'—',
   usage:'شرح الدروس بطريقة واضحة ومناسبة لمستوى التلاميذ',
   who:'المهمة الأساسية للأستاذ'},
  {id:'evaluate', icon:'📝', name:'التقييم والتصحيح', short:'قياس مستوى التلاميذ',
   material:'—',
   usage:'إعداد الفروض والاختبارات، تصحيحها، ووضع النقط',
   who:'دور دوري (أسبوعي/شهري)'},
  {id:'guide', icon:'🧭', name:'التوجيه والإرشاد', short:'مساعدة التلاميذ على التقدم',
   material:'—',
   usage:'تقديم النصائح، مساعدة التلاميذ المتعثرين، توجيههم لتحسين مستواهم',
   who:'دور مستمر طيلة السنة الدراسية'},
  {id:'discipline', icon:'⚖️', name:'ضبط النظام داخل القسم', short:'الحفاظ على جو الدراسة',
   material:'—',
   usage:'تنظيم سير الحصة، التعامل مع المشاكل والسلوكيات غير المناسبة',
   who:'ضروري لضمان بيئة تعليمية جيدة'},
  {id:'prepare', icon:'🗂️', name:'تحضير الدروس', short:'الاستعداد قبل الحصة',
   material:'—',
   usage:'إعداد المذكرات، اختيار الوسائل والتمارين المناسبة قبل كل درس',
   who:'يتم خارج أوقات الحصص'},
  {id:'model', icon:'🌟', name:'القدوة الحسنة', short:'التربية بالقيم',
   material:'—',
   usage:'يكون الأستاذ مثالاً في السلوك والأخلاق يقتدي به التلاميذ',
   who:'دور تربوي دائم'}
];

function buildGrid(list, gridId, detailId){
  const grid = document.getElementById(gridId);
  const detail = document.getElementById(detailId);
  list.forEach(a=>{
    const card = document.createElement('div');
    card.className='card';
    card.dataset.id=a.id;
    card.innerHTML = `<span class="icon">${a.icon}</span><h3>${a.name}</h3><div class="short">${a.short}</div>`;
    card.addEventListener('click', ()=>{
      grid.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
      detail.innerHTML = `
        <h2>${a.icon} ${a.name}</h2>
        ${a.material!=='—' ? `<div class="row"><div class="label">المادة:</div><div>${a.material}</div></div>` : ''}
        <div class="row"><div class="label">الوصف:</div><div>${a.usage}</div></div>
        <div class="row"><div class="label">ملاحظة:</div><div>${a.who}</div></div>
      `;
      detail.classList.add('show');
    });
    grid.appendChild(card);
  });
}
buildGrid(tools, 'toolsGrid', 'toolsDetail');
buildGrid(roles, 'rolesGrid', 'rolesDetail');

// Tabs
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab==='quiz' && !quizStarted){ startQuiz(); }
  });
});

// QUIZ
const scenarios = [
  {text:'تلميذ لم يفهم الدرس ويشعر بالإحباط، ماذا يفعل الأستاذ الجيد؟',
   options:['يتجاهله ويكمل الدرس','يعيد الشرح بطريقة مبسطة ويشجعه','يوبخه أمام الزملاء','يطلب منه المغادرة'], correct:1},
  {text:'وقع شجار بسيط بين تلميذين داخل القسم، ما هو الدور المناسب للأستاذ؟',
   options:['التدريس والشرح','ضبط النظام والتدخل لحل المشكلة','تحضير الدروس','القدوة الحسنة فقط'], correct:1},
  {text:'حان وقت تصحيح فروض التلاميذ، أي أداة يحتاجها الأستاذ؟',
   options:['السبورة','القلم الأحمر','المسطرة','جهاز العرض'], correct:1},
  {text:'الأستاذ يريد عرض فيديو تعليمي أثناء الدرس، أي أداة يستعمل؟',
   options:['دفتر التنقيط','الحاسوب وجهاز العرض','حقيبة الأستاذ','الطباشير'], correct:1},
  {text:'تلميذ متفوق لكنه متردد، يحتاج لمن يشجعه على المشاركة أكثر، أي دور يقوم به الأستاذ؟',
   options:['التقييم والتصحيح','التوجيه والإرشاد','ضبط النظام','تحضير الدروس'], correct:1},
  {text:'قبل بداية السنة الدراسية، ماذا يفعل الأستاذ استعداداً للحصص؟',
   options:['تحضير الدروس والمذكرات','تصحيح الفروض','ضبط النظام','التوجيه'], correct:0},
  {text:'أستاذ يحترم مواعيده ويعامل الجميع بإنصاف، أي دور يجسده؟',
   options:['التقييم','القدوة الحسنة','تحضير الدروس','ضبط النظام'], correct:1},
  {text:'الأستاذ يريد رسم مثلث على السبورة بدقة، أي أداة يحتاج؟',
   options:['القلم الأحمر','دفتر التنقيط','المسطرة والأدوات الهندسية','حقيبة الأستاذ'], correct:2}
];

let quizStarted=false, currentIdx=-1, score=0, total=0, order=[];

function startQuiz(){
  quizStarted=true;
  order = [...scenarios].sort(()=>Math.random()-0.5);
  currentIdx=-1; score=0; total=0;
  nextQuestion();
}

function nextQuestion(){
  currentIdx++;
  document.getElementById('feedbackText').textContent='';
  document.getElementById('nextBtn').style.display='none';
  if(currentIdx>=order.length){
    document.getElementById('scenarioText').textContent = `🎉 انتهى الاختبار! نتيجتك النهائية: ${score} / ${total}`;
    document.getElementById('optionsBox').innerHTML='';
    return;
  }
  const s = order[currentIdx];
  document.getElementById('scenarioText').textContent = s.text;

  const box = document.getElementById('optionsBox');
  box.innerHTML='';
  const idxArr = s.options.map((_,i)=>i);
  idxArr.forEach(i=>{
    const btn = document.createElement('button');
    btn.className='opt-btn';
    btn.textContent = s.options[i];
    btn.addEventListener('click', ()=>{
      total++;
      const allBtns = box.querySelectorAll('.opt-btn');
      allBtns.forEach(b=>b.disabled=true);
      if(i===s.correct){
        btn.classList.add('correct');
        score++;
        document.getElementById('feedbackText').textContent='✅ إجابة صحيحة!';
      } else {
        btn.classList.add('wrong');
        document.getElementById('feedbackText').textContent='❌ إجابة خاطئة';
        allBtns[s.correct].classList.add('correct');
      }
      document.getElementById('scoreText').textContent = `النقطة: ${score} / ${total}`;
      document.getElementById('nextBtn').style.display='inline-block';
    });
    box.appendChild(btn);
  });
}

document.getElementById('nextBtn').addEventListener('click', nextQuestion);
</script>

</body>
</html>
