 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكاة انكسار الضوء</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f0f4f8, #d9e2ec);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #ffffffdd;
            backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 25px 30px 30px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        h1 {
            font-size: 28px;
            margin: 0 0 10px 0;
            color: #1a3b5d;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .sub {
            font-size: 16px;
            color: #2c5778;
            margin-bottom: 20px;
            border-bottom: 2px solid #b0c7db;
            padding-bottom: 12px;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background-color: #fafcff;
            border-radius: 20px;
            box-shadow: inset 0 0 0 1px #c0d0e0, 0 8px 16px rgba(0,0,0,0.1);
            width: 100%;
            height: auto;
            aspect-ratio: 600 / 400;
            touch-action: none;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px 30px;
            margin-top: 22px;
            background: #e9f0f8;
            padding: 18px 20px;
            border-radius: 40px;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .control-group label {
            font-weight: 600;
            color: #1f3a57;
            font-size: 17px;
        }
        input[type="range"] {
            width: 180px;
            height: 6px;
            -webkit-appearance: none;
            background: #b8cfec;
            border-radius: 10px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #1f6390;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        select {
            padding: 8px 16px;
            font-size: 16px;
            border-radius: 30px;
            border: 1px solid #8aa9c9;
            background: white;
            color: #1a3b5d;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            transition: 0.2s;
        }
        select:hover {
            border-color: #1f6390;
            box-shadow: 0 0 0 3px #c0daf0;
        }
        .info {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            margin-top: 18px;
            font-size: 18px;
            font-weight: 500;
            color: #0b2a44;
        }
        .info span {
            background: #dce8f5;
            padding: 6px 18px;
            border-radius: 40px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }
        .info .value {
            background: #ffffff;
            padding: 6px 18px;
            border-radius: 40px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            font-weight: 700;
            color: #003d66;
        }
        .note {
            margin-top: 16px;
            font-size: 15px;
            color: #2b4b6e;
            background: #e3eefa;
            padding: 8px 18px;
            border-radius: 30px;
            display: inline-block;
        }
        @media (max-width: 600px) {
            .container { padding: 15px; }
            input[type="range"] { width: 130px; }
            .controls { gap: 12px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔦 انكسار الضوء</h1>
    <div class="sub">شعاع ضوئي من الهواء إلى وسط آخر</div>

    <canvas id="canvas" width="600" height="400"></canvas>

    <div class="controls">
        <div class="control-group">
            <label>زاوية السقوط (θ₁):</label>
            <input type="range" id="angleSlider" min="0" max="89" value="30" step="0.5">
            <span id="angleDisplay" style="min-width:50px; font-weight:700; color:#003d66;">30°</span>
        </div>
        <div class="control-group">
            <label>الوسط الثاني:</label>
            <select id="mediumSelect">
                <option value="1.33">ماء (1.33)</option>
                <option value="1.50" selected>زجاج (1.50)</option>
                <option value="1.54">ملح صخري (1.54)</option>
                <option value="2.42">ماس (2.42)</option>
                <option value="1.00">فراغ (1.00)</option>
            </select>
        </div>
    </div>

    <div class="info">
        <span>معامل الوسط الثاني (n₂) = <span id="n2Display" class="value">1.50</span></span>
        <span>زاوية الانكسار (θ₂) = <span id="refractionAngle" class="value">19.47°</span></span>
    </div>
    <div class="note">⚠️ إذا كانت زاوية السقوط أكبر من الزاوية الحرجة يحدث انعكاس كلي (في حالة n₂ < n₁)</div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const angleSlider = document.getElementById('angleSlider');
        const angleDisplay = document.getElementById('angleDisplay');
        const mediumSelect = document.getElementById('mediumSelect');
        const n2Display = document.getElementById('n2Display');
        const refractionAngleSpan = document.getElementById('refractionAngle');

        // ثوابت الرسم
        const w = 600, h = 400;
        const centerX = 300, centerY = 220;   // نقطة السقوط على السطح الفاصل
        const surfaceY = 220;                 // خط السطح الفاصل (أفقي)
        const rayLength = 180;                // طول الشعاع المرسوم

        // معامل انكسار الهواء (الوسط الأول)
        const n1 = 1.0;

        // دالة الرسم
        function drawScene() {
            ctx.clearRect(0, 0, w, h);

            // ---- خلفية السطح ----
            // الجزء العلوي (هواء)
            ctx.fillStyle = '#e8f0fe';
            ctx.fillRect(0, 0, w, surfaceY);
            // الجزء السفلي (الوسط الثاني)
            ctx.fillStyle = '#d4e2f2';
            ctx.fillRect(0, surfaceY, w, h - surfaceY);

            // خط السطح الفاصل
            ctx.beginPath();
            ctx.moveTo(0, surfaceY);
            ctx.lineTo(w, surfaceY);
            ctx.strokeStyle = '#2a4d6e';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // العمودي (خط منقط)
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(centerX, 0);
            ctx.lineTo(centerX, h);
            ctx.strokeStyle = '#6d8da8';
            ctx.lineWidth = 1.2;
            ctx.stroke();
            ctx.setLineDash([]);

            // تسمية العمودي
            ctx.font = '14px sans-serif';
            ctx.fillStyle = '#2a4d6e';
            ctx.fillText('العمودي', centerX + 10, 30);

            // تسمية السطح
            ctx.fillText('السطح الفاصل', 10, surfaceY - 8);

            // ---- قراءة القيم ----
            const theta1Deg = parseFloat(angleSlider.value);
            const theta1Rad = theta1Deg * Math.PI / 180;
            const n2 = parseFloat(mediumSelect.value);

            // حساب زاوية الانكسار باستخدام قانون سنيل
            let theta2Rad = 0;
            let totalReflection = false;
            const sinTheta2 = (n1 / n2) * Math.sin(theta1Rad);
            if (sinTheta2 <= 1) {
                theta2Rad = Math.asin(sinTheta2);
            } else {
                totalReflection = true;
                // في حالة الانعكاس الكلي، نضع زاوية الانكسار 90 درجة (ولكن لا نرسم شعاع منكسر)
                theta2Rad = Math.PI / 2;
            }
            const theta2Deg = theta2Rad * 180 / Math.PI;

            // تحديث العرض
            angleDisplay.textContent = theta1Deg.toFixed(1) + '°';
            n2Display.textContent = n2.toFixed(2);
            if (totalReflection) {
                refractionAngleSpan.textContent = 'انعكاس كلي';
                refractionAngleSpan.style.color = '#b22222';
            } else {
                refractionAngleSpan.textContent = theta2Deg.toFixed(2) + '°';
                refractionAngleSpan.style.color = '#003d66';
            }

            // ---- رسم الشعاع الساقط (من الأعلى إلى السطح) ----
            // زاوية السقوط تقاس من العمودي، والشعاع يأتي من أعلى اليسار إذا كانت الزاوية موجبة
            // نرسم الشعاع من نقطة على مسافة rayLength من نقطة السقوط باتجاه السطح
            // اتجاه الشعاع الساقط: من الأعلى إلى الأسفل، مع ميل بزاوية theta1 من العمودي.
            // الإحداثيات: الشعاع يبدأ من (centerX - rayLength*sin(theta1), surfaceY - rayLength*cos(theta1))
            const startX = centerX - rayLength * Math.sin(theta1Rad);
            const startY = surfaceY - rayLength * Math.cos(theta1Rad);
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(centerX, surfaceY);
            ctx.strokeStyle = '#f5a623';
            ctx.lineWidth = 3.5;
            ctx.stroke();

            // سهم صغير على الشعاع الساقط (اختياري)
            drawArrowhead(ctx, startX, startY, centerX, surfaceY, '#f5a623');

            // تسمية زاوية السقوط (قوس)
            ctx.beginPath();
            ctx.arc(centerX, surfaceY, 40, -theta1Rad, 0);
            ctx.strokeStyle = '#d48f2b';
            ctx.lineWidth = 1.8;
            ctx.stroke();
            ctx.fillStyle = '#b8731a';
            ctx.font = '15px sans-serif';
            ctx.fillText('θ₁', centerX + 48, surfaceY - 18);

            // ---- رسم الشعاع المنكسر (إذا لم يكن انعكاس كلي) ----
            if (!totalReflection && theta1Deg > 0) {
                // الشعاع المنكسر في الوسط الثاني: يخرج من نقطة السقوط إلى الأسفل
                // الزاوية من العمودي هي theta2Rad، والاتجاه للأسفل
                const endX = centerX + rayLength * Math.sin(theta2Rad);
                const endY = surfaceY + rayLength * Math.cos(theta2Rad);
                ctx.beginPath();
                ctx.moveTo(centerX, surfaceY);
                ctx.lineTo(endX, endY);
                ctx.strokeStyle = '#2e86c1';
                ctx.lineWidth = 3.5;
                ctx.stroke();

                drawArrowhead(ctx, centerX, surfaceY, endX, endY, '#2e86c1');

                // قوس زاوية الانكسار (أسفل)
                ctx.beginPath();
                ctx.arc(centerX, surfaceY, 40, 0, theta2Rad);
                ctx.strokeStyle = '#1f618d';
                ctx.lineWidth = 1.8;
                ctx.stroke();
                ctx.fillStyle = '#1a5276';
                ctx.font = '15px sans-serif';
                ctx.fillText('θ₂', centerX + 20, surfaceY + 40);
            } else if (theta1Deg === 0) {
                // إذا كانت الزاوية 0، نرسم شعاعًا مستقيمًا دون انكسار
                const endX = centerX;
                const endY = surfaceY + rayLength;
                ctx.beginPath();
                ctx.moveTo(centerX, surfaceY);
                ctx.lineTo(endX, endY);
                ctx.strokeStyle = '#2e86c1';
                ctx.lineWidth = 3.5;
                ctx.stroke();
            } else {
                // انعكاس كلي: نرسم شعاع منعكس (اختياري) - نرسمه بشكل خفيف
                // الشعاع المنعكس يرتد بنفس الزاوية على الجانب الآخر من العمودي
                const reflX = centerX + rayLength * Math.sin(theta1Rad);
                const reflY = surfaceY + rayLength * Math.cos(theta1Rad);
                ctx.beginPath();
                ctx.moveTo(centerX, surfaceY);
                ctx.lineTo(reflX, reflY);
                ctx.strokeStyle = '#aab8c9';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([6, 6]);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = '#6b7b8d';
                ctx.font = '14px sans-serif';
                ctx.fillText('انعكاس كلي', centerX + 30, surfaceY + 70);
            }

            // ---- تسمية الوسائط ----
            ctx.font = 'bold 16px sans-serif';
            ctx.fillStyle = '#1a3b5d';
            ctx.fillText('الهواء (n₁=1)', 20, 50);
            ctx.fillText('الوسط الثاني (n₂=' + n2.toFixed(2) + ')', 20, surfaceY + 50);

            // رسم نقطة السقوط
            ctx.beginPath();
            ctx.arc(centerX, surfaceY, 6, 0, 2 * Math.PI);
            ctx.fillStyle = '#1f3a57';
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // دالة مساعدة لرسم رأس سهم صغير
        function drawArrowhead(ctx, fromX, fromY, toX, toY, color) {
            const headLen = 12;
            const headAngle = 0.45;
            const angle = Math.atan2(toY - fromY, toX - fromX);
            // نرسم السهم في منتصف الشعاع تقريبًا
            const midX = (fromX + toX) / 2;
            const midY = (fromY + toY) / 2;
            // اتجاه السهم على طول الشعاع
            const dx = toX - fromX;
            const dy = toY - fromY;
            const len = Math.sqrt(dx*dx + dy*dy);
            if (len < 5) return;
            const unitX = dx / len;
            const unitY = dy / len;
            // نقطة بداية السهم (في منتصف الشعاع)
            const arrowX = midX;
            const arrowY = midY;
            // نرسم مثلث صغير
            ctx.save();
            ctx.translate(arrowX, arrowY);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-headLen, -headLen * 0.4);
            ctx.lineTo(-headLen, headLen * 0.4);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            ctx.restore();
        }

        // ربط الأحداث
        angleSlider.addEventListener('input', drawScene);
        mediumSelect.addEventListener('change', drawScene);

        // رسم أولي
        drawScene();

        // إعادة الرسم عند تغيير حجم النافذة (للتكيف)
        window.addEventListener('resize', drawScene);

    })();
</script>
</body>
</html>
