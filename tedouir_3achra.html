<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>تدوير قطعة نقدية</title>

<style>
body{
    text-align:center;
    background:#f0f0f0;
    font-family:Arial;
    margin-top:50px;
}

#coin-container{
    width:250px;
    height:250px;
    margin:auto;
    perspective:1000px;
}

#coin{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
}

.face{
    position:absolute;
    width:100%;
    height:100%;
    backface-visibility:hidden;
}

.face img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.back{
    transform:rotateY(180deg);
}

.spin{
    animation:flip 2s ease-in-out;
}

@keyframes flip{
    from{transform:rotateY(0deg);}
    to{transform:rotateY(1800deg);}
}

button{
    margin-top:20px;
    padding:10px 20px;
    font-size:18px;
}
</style>
</head>

<body>

<h2>تدوير قطعة نقدية</h2>

<div id="coin-container">
    <div id="coin">
        <div class="face front">
            <img src="face.png" alt="وجه">
        </div>

        <div class="face back">
            <img src="back.png" alt="ظهر">
        </div>
    </div>
</div>

<button onclick="flipCoin()">تدوير</button>

<p id="result"></p>

<script>
function flipCoin(){

    let coin = document.getElementById("coin");
    let result = document.getElementById("result");

    coin.classList.remove("spin");
    void coin.offsetWidth;
    coin.classList.add("spin");

    let face = Math.random() < 0.5;

    setTimeout(()=>{
        if(face){
            coin.style.transform="rotateY(0deg)";
            result.innerHTML="النتيجة: وجه";
        }else{
            coin.style.transform="rotateY(180deg)";
            result.innerHTML="النتيجة: ظهر";
        }
    },1800);
}
</script>

</body>
</html>
